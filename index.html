<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Планер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07080f; --bg-2: #0d1020; --glass: rgba(255,255,255,.055); --glass-2: rgba(255,255,255,.09);
  --stroke: rgba(255,255,255,.09); --stroke-2: rgba(255,255,255,.16);
  --text: #eef0ff; --text-2: #a3a8c3; --text-3: #6b7090;
  --accent: #7c6cff; --accent-2: #3ad6ff; --accent-3: #ff5fa2;
  --ok: #34e0a1; --warn: #ffb547; --hot: #ff5d6c;
  --grad: linear-gradient(135deg, #7c6cff 0%, #3ad6ff 100%);
  --grad-hot: linear-gradient(135deg, #ff5fa2 0%, #ff8a5b 100%);
  --shadow: 0 10px 30px rgba(0,0,0,.35);
  --r: 20px;
  color-scheme: dark;
}
:root.light {
  --bg: #f4f5fb; --bg-2: #e9ebf7; --glass: rgba(255,255,255,.72); --glass-2: rgba(255,255,255,.92);
  --stroke: rgba(20,24,60,.08); --stroke-2: rgba(20,24,60,.14);
  --text: #12142a; --text-2: #565b78; --text-3: #8a8fab;
  --shadow: 0 10px 30px rgba(40,46,110,.12);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  font: 500 15px/1.45 Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--text); background: var(--bg); overflow-x: hidden;
  padding-bottom: calc(118px + env(safe-area-inset-bottom));
}
/* живой фон: мягкое «северное сияние» */
.aurora { position: fixed; inset: -20% -20% auto -20%; height: 70vh; z-index: -1; pointer-events: none; filter: blur(60px); opacity: .55; }
.aurora i { position: absolute; border-radius: 50%; animation: float 18s ease-in-out infinite alternate; }
.aurora i:nth-child(1) { width: 55vw; height: 55vw; left: 5%; top: 5%; background: #6d5cff; }
.aurora i:nth-child(2) { width: 45vw; height: 45vw; right: 0; top: 0; background: #1fb6ff; animation-delay: -6s; }
.aurora i:nth-child(3) { width: 35vw; height: 35vw; left: 40%; top: 30%; background: #ff4f9a; opacity: .7; animation-delay: -12s; }
.light .aurora { opacity: .28; }
@keyframes float { to { transform: translate3d(6vw, 4vh, 0) scale(1.12); } }
@media (prefers-reduced-motion: reduce) { .aurora i, .anim > * { animation: none !important; } }

header { padding: 18px 20px 8px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); }
h1 { margin: 2px 0 0; font-size: 30px; line-height: 1.1; font-weight: 800; letter-spacing: -.02em; }
h1 .g { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
main { padding: 6px 16px 0; max-width: 640px; margin: 0 auto; }
.anim > * { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
.anim > *:nth-child(2) { animation-delay: .04s } .anim > *:nth-child(3) { animation-delay: .08s }
.anim > *:nth-child(4) { animation-delay: .12s } .anim > *:nth-child(5) { animation-delay: .16s }
.anim > *:nth-child(n+6) { animation-delay: .2s }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

.sec { margin: 22px 4px 10px; display: flex; align-items: baseline; justify-content: space-between; }
.sec h3 { margin: 0; font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); }
.sec span { font-size: 12px; color: var(--text-3); font-weight: 600; }
.glass { background: var(--glass); border: 1px solid var(--stroke); border-radius: var(--r); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); box-shadow: var(--shadow); }
.empty { padding: 22px 16px; text-align: center; color: var(--text-3); font-weight: 600; }
.empty b { display: block; font-size: 28px; margin-bottom: 4px; }

/* hero */
.hero { position: relative; overflow: hidden; border-radius: 26px; padding: 20px; color: #fff; background: radial-gradient(120% 140% at 0% 0%, #8a7bff 0%, #5b4bf0 40%, #1d1a5c 100%); box-shadow: 0 20px 50px rgba(91,75,240,.35); }
.hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(58,214,255,.55), transparent 70%); }
.hero .hi { font-size: 14px; opacity: .85; font-weight: 600; }
.hero .now { margin-top: 10px; font-size: 22px; font-weight: 800; line-height: 1.2; letter-spacing: -.01em; position: relative; z-index: 1; }
.hero .meta { margin-top: 4px; font-size: 13px; opacity: .85; position: relative; z-index: 1; }
.hero .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); margin-top: 14px; overflow: hidden; position: relative; z-index: 1; }
.hero .bar i { display: block; height: 100%; background: linear-gradient(90deg, #3ad6ff, #fff); border-radius: 3px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; position: relative; z-index: 1; }
.stat { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.16); border-radius: 16px; padding: 10px 12px; }
.stat b { display: block; font-size: 24px; font-weight: 800; line-height: 1.05; }
.stat span { font-size: 11.5px; opacity: .85; font-weight: 600; }

/* таймлайн пар */
.tl { padding: 6px 0; }
.ls { display: grid; grid-template-columns: 58px 1fr; gap: 0 12px; padding: 10px 16px; position: relative; }
.ls + .ls { border-top: 1px solid var(--stroke); }
.ls .t { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 15px; }
.ls .t small { display: block; font-size: 11px; color: var(--text-3); font-weight: 600; }
.ls .n { font-weight: 700; }
.ls .m { font-size: 12.5px; color: var(--text-2); margin-top: 1px; }
.ls.past { opacity: .45; }
.ls.cur { background: linear-gradient(90deg, rgba(124,108,255,.18), transparent); }
.ls.cur::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--grad); }
.ls.vuc .n::before { content: "🎖 "; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: var(--glass-2); color: var(--text-2); border: 1px solid var(--stroke); }
.pill.live { background: var(--grad); color: #fff; border: 0; }
.pill.hot { background: rgba(255,93,108,.16); color: var(--hot); border-color: rgba(255,93,108,.3); }
.pill.warn { background: rgba(255,181,71,.15); color: var(--warn); border-color: rgba(255,181,71,.3); }
.pill.ok { background: rgba(52,224,161,.15); color: var(--ok); border-color: rgba(52,224,161,.3); }
.pill.acc { background: rgba(124,108,255,.18); color: #b3a9ff; border-color: rgba(124,108,255,.35); }
.light .pill.acc { color: #5b4bf0; }
.hw { margin-top: 8px; padding: 8px 10px; border-radius: 12px; font-size: 13px; background: rgba(124,108,255,.12); border: 1px solid rgba(124,108,255,.22); }

/* задачи */
.task { position: relative; display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 14px 16px; }
.task + .task { border-top: 1px solid var(--stroke); }
.task::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; background: var(--u, transparent); }
.chk { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--stroke-2); background: transparent; display: grid; place-items: center; color: transparent; font-size: 15px; margin-top: 1px; transition: all .2s; }
.chk:active { transform: scale(.9); }
.task.done .chk { background: var(--ok); border-color: var(--ok); color: #062; }
.task.done .tt { text-decoration: line-through; color: var(--text-3); }
.task .top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 4px; }
.task .tt { font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
.task .src { font-size: 12px; color: var(--text-3); margin-top: 4px; }
.task .more { display: none; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.task.open .more { display: flex; }
.btn { border: 1px solid var(--stroke-2); background: var(--glass-2); color: var(--text); font: inherit; font-size: 13px; font-weight: 700; padding: 9px 12px; border-radius: 12px; display: inline-flex; align-items: center; gap: 6px; }
.btn:active { transform: scale(.97); }
.btn.pri { background: var(--grad); border: 0; color: #fff; box-shadow: 0 6px 18px rgba(124,108,255,.35); }
.btn.ghost { background: transparent; }

/* полоса дней */
.days { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; scroll-snap-type: x mandatory; }
.days::-webkit-scrollbar { display: none; }
.day { flex: 0 0 auto; width: 54px; padding: 10px 0 8px; border-radius: 18px; text-align: center; background: var(--glass); border: 1px solid var(--stroke); scroll-snap-align: start; color: var(--text); font: inherit; }
.day .w { font-size: 11px; font-weight: 700; color: var(--text-3); text-transform: uppercase; }
.day .d { font-size: 20px; font-weight: 800; margin-top: 2px; }
.day .dots { display: flex; justify-content: center; gap: 3px; margin-top: 4px; height: 6px; }
.day .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--text-3); }
.day .dots i.h { background: var(--hot); } .day .dots i.v { background: var(--warn); } .day .dots i.b { background: var(--accent-3); }
.day.on { background: var(--grad); border-color: transparent; color: #fff; box-shadow: 0 10px 24px rgba(124,108,255,.4); }
.day.on .w { color: rgba(255,255,255,.8); } .day.on .dots i { background: #fff; }
.day.today:not(.on) { border-color: rgba(124,108,255,.6); }

/* сегменты */
.seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 0 0 auto; border: 1px solid var(--stroke); background: var(--glass); color: var(--text-2); font: inherit; font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 99px; }
.seg button.on { background: var(--text); color: var(--bg); border-color: var(--text); }

/* карточки */
.decks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.deck { padding: 16px; border-radius: 22px; min-height: 120px; display: flex; flex-direction: column; justify-content: space-between; color: #fff; border: 0; font: inherit; text-align: left; box-shadow: var(--shadow); }
.deck b { font-size: 16px; font-weight: 800; line-height: 1.25; }
.deck span { font-size: 12px; opacity: .85; font-weight: 600; }
.deck .pr { height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); margin-top: 8px; overflow: hidden; }
.deck .pr i { display: block; height: 100%; background: #fff; }
.flipwrap { perspective: 1200px; margin-top: 6px; }
.flip { position: relative; height: 300px; transition: transform .55s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; cursor: pointer; }
.flip.on { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 28px; font-size: 22px; font-weight: 800; line-height: 1.3; overflow-wrap: anywhere; }
.face small { display: block; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .7; margin-bottom: 12px; }
.face.front { background: var(--glass-2); border: 1px solid var(--stroke-2); box-shadow: var(--shadow); }
.face.back { transform: rotateY(180deg); background: radial-gradient(120% 140% at 0% 0%, #8a7bff, #3a2fd0 60%, #1d1a5c); color: #fff; }
.cardbar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.cardbar .btn { justify-content: center; padding: 14px; font-size: 15px; }
.prog { height: 6px; border-radius: 3px; background: var(--glass-2); overflow: hidden; margin: 6px 4px 0; }
.prog i { display: block; height: 100%; background: var(--grad); transition: width .3s; }

/* файлы */
.files { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.file { padding: 14px; border-radius: 20px; display: flex; flex-direction: column; gap: 8px; min-height: 130px; }
.file .ic { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 20px; background: var(--grad); }
.file .fn { font-weight: 700; font-size: 13.5px; line-height: 1.3; overflow-wrap: anywhere; flex: 1; }
.file .ft { font-size: 11.5px; color: var(--text-3); }

/* нижнее меню */
nav.dock { position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 20; max-width: 520px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(6, 1fr); padding: 6px; border-radius: 26px;
  background: color-mix(in srgb, var(--bg-2) 72%, transparent); border: 1px solid var(--stroke-2);
  backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); box-shadow: 0 16px 40px rgba(0,0,0,.35); }
.nb { position: relative; border: 0; background: none; color: var(--text-3); font: inherit; font-size: 10px; font-weight: 800; letter-spacing: .02em; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0 5px; border-radius: 20px; transition: color .2s; }
.nb svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .25s cubic-bezier(.2,.8,.2,1); }
.nb.on { color: #fff; }
.light .nb.on { color: #fff; }
.nb.on::before { content: ""; position: absolute; inset: 0; border-radius: 20px; background: var(--grad); box-shadow: 0 8px 20px rgba(124,108,255,.45); z-index: -1; }
.nb.on svg { transform: translateY(-1px) scale(1.05); }
.nb .dot { position: absolute; top: 3px; right: calc(50% - 19px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--hot); color: #fff; font-size: 10px; line-height: 17px; border: 2px solid var(--bg-2); }

/* FAB, шторки, тост */
.fab { position: fixed; right: 18px; bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 19; width: 56px; height: 56px; border-radius: 20px; border: 0; background: var(--grad); color: #fff; font-size: 28px; font-weight: 400; box-shadow: 0 14px 30px rgba(124,108,255,.5); display: grid; place-items: center; }
.fab:active { transform: scale(.94); }
.queue { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 19; display: none; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 99px; background: var(--text); color: var(--bg); font-weight: 700; font-size: 13px; box-shadow: var(--shadow); }
.queue.on { display: flex; }
.queue button { border: 0; border-radius: 99px; padding: 8px 12px; font: inherit; font-weight: 800; font-size: 13px; }
.queue .u { background: transparent; color: var(--bg); opacity: .7; }
.queue .s { background: var(--grad); color: #fff; }
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(4,5,12,.55); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity .25s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-width: 640px; margin: 0 auto; padding: 10px 18px calc(22px + env(safe-area-inset-bottom)); border-radius: 28px 28px 0 0; background: var(--bg-2); border: 1px solid var(--stroke-2); border-bottom: 0; transform: translateY(105%); transition: transform .35s cubic-bezier(.2,.8,.2,1); max-height: 88vh; overflow-y: auto; }
.sheet.on { transform: none; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--stroke-2); margin: 0 auto 14px; }
.sheet h4 { margin: 0 0 4px; font-size: 20px; font-weight: 800; }
.sheet p { margin: 0 0 14px; color: var(--text-2); font-size: 13.5px; }
.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0 14px; }
.quick .btn { justify-content: center; flex-direction: column; gap: 2px; padding: 12px 6px; }
.quick .btn small { font-size: 11px; color: var(--text-3); font-weight: 600; }
.quick .btn.on { background: var(--grad); color: #fff; border-color: transparent; }
.quick .btn.on small { color: rgba(255,255,255,.8); }
label.f { display: block; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin: 12px 2px 6px; }
input, textarea { width: 100%; font: inherit; font-weight: 600; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--stroke-2); background: var(--glass); color: var(--text); outline: none; }
input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(124,108,255,.18); }
textarea { min-height: 84px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toggle { display: flex; align-items: center; justify-content: space-between; padding: 14px; border-radius: 14px; background: var(--glass); border: 1px solid var(--stroke-2); margin-top: 12px; font-weight: 700; }
.sw { width: 50px; height: 30px; border-radius: 15px; background: var(--stroke-2); position: relative; transition: background .2s; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.sw.on { background: var(--hot); } .sw.on::after { transform: translateX(20px); }
.sheet .go { width: 100%; justify-content: center; padding: 15px; font-size: 16px; margin-top: 16px; }
.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top)); z-index: 40; transform: translate(-50%, -140%); padding: 10px 16px; border-radius: 99px; background: var(--text); color: var(--bg); font-weight: 700; font-size: 13.5px; transition: transform .35s cubic-bezier(.2,.8,.2,1); box-shadow: var(--shadow); white-space: nowrap; }
.toast.on { transform: translate(-50%, 0); }
.msg { padding: 80px 24px; text-align: center; color: var(--text-2); font-weight: 600; }
.msg b { display: block; font-size: 42px; margin-bottom: 10px; }
.foot { text-align: center; color: var(--text-3); font-size: 11.5px; font-weight: 600; margin: 26px 0 0; }
.wk { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 10px; }
.wk .btn { padding: 8px 12px; }
.wk b { font-size: 14px; }
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<header><div class="eyebrow" id="eyebrow">&nbsp;</div><h1 id="title">Планер</h1></header>
<main id="main"><div class="msg"><b>✨</b>Загружаю…</div></main>

<div class="queue" id="queue"><span id="qtext"></span><button class="u" id="undo">Отменить</button><button class="s" id="send">Отправить</button></div>
<button class="fab" id="fab" aria-label="Новая задача">＋</button>
<nav class="dock" id="nav"></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor && tg.setHeaderColor(tg.colorScheme === "light" ? "#f4f5fb" : "#07080f"); tg.setBackgroundColor && tg.setBackgroundColor(tg.colorScheme === "light" ? "#f4f5fb" : "#07080f"); } catch (e) {}
  if (tg.colorScheme === "light") document.documentElement.classList.add("light");
  tg.onEvent && tg.onEvent("themeChanged", () => document.documentElement.classList.toggle("light", tg.colorScheme === "light"));
} else if (matchMedia("(prefers-color-scheme: light)").matches) document.documentElement.classList.add("light");

const IC = {
  today: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  week: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="4"/><path d="M8 2v4M16 2v4M3 10h18M8 14h2M14 14h2M8 17h2"/></svg>',
  tasks: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="m8 12 3 3 5-6"/></svg>',
  sched: '<svg viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 0 1 2-2h12v15H6a2 2 0 0 0-2 1.5Zm0 0A2 2 0 0 0 6 21h12"/><path d="M9 7h6M9 11h4"/></svg>',
  cards: '<svg viewBox="0 0 24 24"><rect x="7" y="3" width="13" height="17" rx="3"/><path d="M4 7v11a3 3 0 0 0 3 3h9"/></svg>',
  files: '<svg viewBox="0 0 24 24"><path d="M21 12.5 12.6 21a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4L15.6 8.3"/></svg>',
};
const TABS = [["today", "Сегодня"], ["week", "Неделя"], ["tasks", "Задачи"], ["sched", "Пары"], ["cards", "Карточки"], ["files", "Файлы"]];
const WD = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
const WDL = ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];
const MON = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
const DECK_GRADS = ["linear-gradient(135deg,#7c6cff,#3ad6ff)", "linear-gradient(135deg,#ff5fa2,#ff8a5b)", "linear-gradient(135deg,#00c9a7,#3a7bff)", "linear-gradient(135deg,#f7b733,#fc4a1a)", "linear-gradient(135deg,#8e2de2,#4a00e0)"];

let D = null, tab = new URLSearchParams(location.search).get("tab") || "today";
let selDay = null, schedWeek = 0, filter = "all", deck = null, cardIdx = 0, flipped = false, openTask = null;

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let ops = store.get("ops", []);
const haptic = (t = "light") => { try { t === "sel" ? tg.HapticFeedback.selectionChanged() : t === "ok" ? tg.HapticFeedback.notificationOccurred("success") : tg.HapticFeedback.impactOccurred(t); } catch (e) {} };

// ---------- время (Москва) ----------
const msk = () => new Date(Date.now() + (new Date().getTimezoneOffset() + 180) * 60000);
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const P = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const add = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => iso(msk());
const ddmm = s => s.slice(8, 10) + "." + s.slice(5, 7);
const nice = s => { const d = P(s); return d.getDate() + " " + MON[d.getMonth()]; };
const diff = s => Math.round((P(s) - P(today())) / 864e5);
const relTxt = s => { const n = diff(s); return n === 0 ? "сегодня" : n === 1 ? "завтра" : n === 2 ? "послезавтра" : n < 0 ? "прошло" : n <= 7 ? "через " + n + " дн." : nice(s); };
const mins = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- данные ----------
async function load() {
  const k = new URLSearchParams(location.search).get("k");
  if (!k) throw new Error("Открой планер кнопкой «📅 Планер» в чате с ботом.");
  const raw = Uint8Array.from(atob(k.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((k.length + 3) % 4)), c => c.charCodeAt(0));
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const res = await fetch("data.enc?t=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error("Бот ещё не опубликовал данные.");
  const enc = await res.json(), b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(enc.iv) }, key, b(enc.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function tasks() {
  const L = D.tasks.map(t => ({ ...t }));
  for (const o of ops) {
    const t = L.find(x => x.id === o.id);
    if (o.op === "add") L.push({ id: "n" + o.n, text: o.text, date: o.date, time: o.time, imp: !!o.imp, files: [], src: "из планера", pend: true });
    else if (!t) continue;
    else if (o.op === "done") t.done = true;
    else if (o.op === "tmr" && t.date) { t.date = iso(add(P(t.date), 1)); t.pend = true; }
    else if (o.op === "move") { t.date = o.date; if (o.time) t.time = o.time; t.pend = true; }
    else if (o.op === "imp") { t.imp = o.value; t.pend = true; }
  }
  return L.sort((a, b) => (a.date || "9").localeCompare(b.date || "9") || (a.time || "9").localeCompare(b.time || "9"));
}
function lessons(ds) {
  const S = D.schedule;
  if (S.valid_until && ds > S.valid_until) return null;
  const out = (S.days[ds] || []).map(l => ({ s: l.time, e: endOf(l.time, 80), n: l.subj, m: l.type + " · " + l.room, who: l.teacher }));
  const wd = (P(ds).getDay() + 6) % 7;
  for (const v of S.vuc || []) if (v.wd === wd) {
    const r = v.text.match(/^(\d{2}:\d{2})[–-](\d{2}:\d{2})/);
    const rest = v.text.replace(/^\d{2}:\d{2}[–-]\d{2}:\d{2}\s*/, "");
    out.push({ s: r ? r[1] : v.time, e: r ? r[2] : endOf(v.time, 80), n: rest.split(",")[0].replace(/\s*\(.*$/, "") || "ВУЦ", m: rest, vuc: true });
  }
  return out.sort((a, b) => a.s.localeCompare(b.s));
}
function endOf(t, d) { const m = mins(t) + d; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); }
function urg(t) {
  if (!t.date) return "transparent";
  const n = diff(t.date);
  return n <= 0 ? "var(--hot)" : n === 1 ? "var(--warn)" : n <= 3 ? "#ffd166" : "var(--accent)";
}

// ---------- кусочки интерфейса ----------
function taskEl(t) {
  const id = typeof t.id === "number" ? t.id : null;
  const pills = [];
  if (t.date) {
    const n = diff(t.date);
    pills.push(`<span class="pill ${n <= 0 ? "hot" : n === 1 ? "warn" : ""}">${t.approx ? "~" : ""}${relTxt(t.date)}${t.time ? " · " + t.time : ""}</span>`);
  } else pills.push('<span class="pill">без срока</span>');
  if (t.imp) pills.push('<span class="pill hot">❗️ важно</span>');
  if (t.files?.length) pills.push(`<span class="pill acc">📎 ${t.files.length}</span>`);
  if (t.pend) pills.push('<span class="pill ok">ждёт бота</span>');
  const open = openTask === t.id;
  return `<div class="task ${t.done ? "done" : ""} ${open ? "open" : ""}" style="--u:${t.done ? "transparent" : urg(t)}" data-open="${t.id}">
    <button class="chk" ${id === null || t.done ? "disabled" : ""} data-done="${id}" aria-label="Сделано">✓</button>
    <div><div class="top">${id !== null ? `<span class="pill">#${id}</span>` : ""}${pills.join("")}</div>
    <div class="tt">${esc(t.text)}</div>${t.src ? `<div class="src">${esc(t.src)}</div>` : ""}
    ${id !== null && !t.done ? `<div class="more">
      ${t.date ? `<button class="btn" data-tmr="${id}">⏰ Завтра</button>` : ""}
      <button class="btn" data-move="${id}">📅 Перенести</button>
      <button class="btn" data-imp="${id}">${t.imp ? "Снять ❗️" : "❗️ Важно"}</button></div>` : ""}</div></div>`;
}
const block = (title, aside, inner) => `<div class="sec"><h3>${title}</h3>${aside ? `<span>${aside}</span>` : ""}</div><div class="glass">${inner}</div>`;
const empty = (e, t) => `<div class="empty"><b>${e}</b>${t}</div>`;

function timeline(ds, due = []) {
  const L = lessons(ds);
  if (L === null) return empty("📭", "Расписание дальше не загружено — пришли боту новое");
  if (!L.length) return empty("🌴", "Пар нет — отдыхай");
  const isT = ds === today(), nowM = mins(msk().toTimeString().slice(0, 5)), used = new Set();
  return `<div class="tl">${L.map(l => {
    const past = isT && mins(l.e) <= nowM, cur = isT && mins(l.s) <= nowM && nowM < mins(l.e);
    const hw = due.filter(t => t.time === l.s && !used.has(t.id)); hw.forEach(t => used.add(t.id));
    return `<div class="ls ${past ? "past" : ""} ${cur ? "cur" : ""} ${l.vuc ? "vuc" : ""}">
      <div class="t">${l.s}<small>${l.e}</small></div>
      <div><div class="n">${esc(l.n)} ${cur ? '<span class="pill live">● идёт</span>' : ""}</div><div class="m">${esc(l.m)}</div>
      ${hw.map(t => `<div class="hw">📝 <b>#${t.id}</b> ${t.imp ? "❗️ " : ""}${esc(t.text)}</div>`).join("")}</div></div>`;
  }).join("")}</div>`;
}

// ---------- экраны ----------
function vToday() {
  const t0 = today(), T = tasks().filter(t => !t.done), L = lessons(t0) || [], nowM = mins(msk().toTimeString().slice(0, 5));
  const hr = msk().getHours(), hi = hr < 5 ? "Доброй ночи" : hr < 12 ? "Доброе утро" : hr < 18 ? "Добрый день" : "Добрый вечер";
  const name = tg?.initDataUnsafe?.user?.first_name || "Саша";
  const cur = L.find(l => mins(l.s) <= nowM && nowM < mins(l.e)), next = L.find(l => mins(l.s) > nowM);
  let now, meta, prog = 0;
  if (cur) { now = cur.n; meta = `идёт сейчас · ${cur.m} · до ${cur.e}`; prog = (nowM - mins(cur.s)) / (mins(cur.e) - mins(cur.s)) * 100; }
  else if (next) { const m = mins(next.s) - nowM; now = next.n; meta = `${m < 60 ? "через " + m + " мин" : "в " + next.s} · ${next.m}`; prog = 0; }
  else { const nd = T.find(t => t.date && t.date >= t0); now = L.length ? "Пары закончились 🎉" : "Сегодня без пар"; meta = nd ? `ближайший дедлайн: #${nd.id} ${relTxt(nd.date)}` : "дедлайнов нет — красота"; }
  const in3 = T.filter(t => t.date && diff(t.date) >= 0 && diff(t.date) <= 3).length;
  let h = `<div class="hero"><div class="hi">${hi}, ${esc(name)}</div><div class="now">${esc(now)}</div><div class="meta">${esc(meta)}</div>
    ${cur ? `<div class="bar"><i style="width:${prog.toFixed(0)}%"></i></div>` : ""}
    <div class="stats"><div class="stat"><b>${L.filter(l => !l.vuc).length}</b><span>пар сегодня</span></div>
    <div class="stat"><b>${in3}</b><span>дедлайнов ≤ 3 дн.</span></div><div class="stat"><b>${T.filter(t => t.imp).length}</b><span>❗️ важных</span></div></div></div>`;
  const due = T.filter(t => t.date === t0);
  h += block("Пары", L.length ? L.length + (L.length > 4 ? " занятий" : " занятия") : "", timeline(t0, due));
  const rest = due.filter(t => !(t.time && L.some(l => l.s === t.time)));
  if (rest.length) h += block("Сегодня", rest.length, rest.map(taskEl).join(""));
  const soon = T.filter(t => t.date && diff(t.date) >= 1 && diff(t.date) <= 3);
  h += block("Ближайшие дни", soon.length || "", soon.length ? soon.map(taskEl).join("") : empty("🧘", "На три дня вперёд пусто"));
  const imp = T.filter(t => t.imp && t.date && diff(t.date) > 3 && diff(t.date) <= 7);
  if (imp.length) h += block("❗️ Скоро важное", "", imp.map(taskEl).join(""));
  return h;
}

function dayStrip(start, count, sel, tasksL) {
  return `<div class="days">${Array.from({ length: count }, (_, i) => {
    const ds = iso(add(start, i)), d = P(ds), L = lessons(ds) || [];
    const dots = [];
    L.filter(l => !l.vuc).slice(0, 3).forEach(() => dots.push("<i></i>"));
    if (L.some(l => l.vuc)) dots.push('<i class="v"></i>');
    if (tasksL.some(t => t.date === ds)) dots.push('<i class="h"></i>');
    if (D.birthdays.some(b => b.d === d.getDate() && b.m === d.getMonth() + 1)) dots.push('<i class="b"></i>');
    return `<button class="day ${ds === sel ? "on" : ""} ${ds === today() ? "today" : ""}" data-day="${ds}"><div class="w">${WD[d.getDay()]}</div><div class="d">${d.getDate()}</div><div class="dots">${dots.slice(0, 5).join("")}</div></button>`;
  }).join("")}</div>`;
}

function vWeek() {
  const T = tasks().filter(t => !t.done), s = selDay || today(), d = P(s);
  let h = dayStrip(P(today()), 14, s, T);
  const due = T.filter(t => t.date === s), bd = D.birthdays.filter(b => b.d === d.getDate() && b.m === d.getMonth() + 1);
  h += `<div class="sec"><h3>${WDL[d.getDay()]}, ${nice(s)}</h3><span>${relTxt(s)}</span></div>`;
  if (bd.length) h += `<div class="glass" style="margin-bottom:10px"><div class="empty" style="padding:14px"><b>🎂</b>День рождения: ${bd.map(b => esc(b.name)).join(", ")}</div></div>`;
  h += `<div class="glass">${timeline(s, due)}</div>`;
  const rest = due.filter(t => !(t.time && (lessons(s) || []).some(l => l.s === t.time)));
  h += block("Дедлайны", rest.length || "", rest.length ? rest.map(taskEl).join("") : empty("✨", "В этот день сдавать нечего"));
  return h;
}

function vTasks() {
  const all = tasks();
  const F = { all: ["Все", t => !t.done], imp: ["❗️ Важные", t => !t.done && t.imp], soon: ["≤ 3 дня", t => !t.done && t.date && diff(t.date) <= 3], nodate: ["Без срока", t => !t.done && !t.date], files: ["📎 С файлами", t => !t.done && t.files?.length] };
  const list = all.filter(F[filter][1]);
  let h = `<div class="seg">${Object.entries(F).map(([k, [n]]) => `<button class="${filter === k ? "on" : ""}" data-filter="${k}">${n}</button>`).join("")}</div>`;
  h += block("Список", list.length, list.length ? list.map(taskEl).join("") : empty("🎉", "Здесь пусто"));
  const done = all.filter(t => t.done);
  if (done.length) h += block("Отмечено", "уйдёт боту", done.map(taskEl).join(""));
  if (D.regular.length) h += block("🔁 Регулярно", "", D.regular.map(r => `<div class="task" style="grid-template-columns:1fr"><div class="tt" style="font-weight:500">${esc(r)}</div></div>`).join(""));
  return h;
}

function vSched() {
  const base = add(P(today()), schedWeek * 7), mon = add(base, -((base.getDay() + 6) % 7));
  const s = selDay && P(selDay) >= mon && P(selDay) < add(mon, 7) ? selDay : (schedWeek === 0 ? today() : iso(mon));
  let h = `<div class="wk"><button class="btn" data-week="-1">‹</button><b>${nice(iso(mon))} — ${nice(iso(add(mon, 5)))}</b><button class="btn" data-week="1">›</button></div>`;
  h += dayStrip(mon, 6, s, tasks().filter(t => !t.done));
  const L = lessons(s) || [];
  h += `<div class="sec"><h3>${WDL[P(s).getDay()]}</h3><span>${nice(s)}</span></div><div class="glass"><div class="tl">${
    lessons(s) === null ? empty("📭", "Не загружено") : !L.length ? empty("🌴", "Пар нет") :
    L.map(l => `<div class="ls ${l.vuc ? "vuc" : ""}"><div class="t">${l.s}<small>${l.e}</small></div><div><div class="n">${esc(l.n)}</div><div class="m">${esc(l.m)}${l.who ? " · " + esc(l.who) : ""}</div></div></div>`).join("")}</div></div>`;
  if (D.schedule.changes?.length) h += block("Изменения", "", D.schedule.changes.map(c => `<div class="task" style="grid-template-columns:1fr"><div class="tt">${esc(c)}</div></div>`).join(""));
  return h;
}

function vCards() {
  const decks = D.cards || [];
  if (!decks.length) return `<div class="glass">${empty("🃏", "Колод пока нет.<br><br>Напиши боту «сделай карточки по #1» — он соберёт колоду из материалов задачи.")}</div>`;
  if (deck === null) return `<div class="decks">${decks.map((d, i) => {
    const k = store.get("known:" + d.name, []).length;
    return `<button class="deck" data-deck="${i}" style="background:${DECK_GRADS[i % DECK_GRADS.length]}"><b>${esc(d.name)}</b><div><span>${d.cards.length} карточек${d.task ? " · #" + d.task : ""}</span><div class="pr"><i style="width:${Math.round(k / d.cards.length * 100)}%"></i></div></div></button>`;
  }).join("")}</div>`;
  const d = decks[deck], c = d.cards[cardIdx], known = new Set(store.get("known:" + d.name, []));
  return `<div class="prog"><i style="width:${(cardIdx + 1) / d.cards.length * 100}%"></i></div>
    <div class="sec" style="margin-top:12px"><h3>${cardIdx + 1} / ${d.cards.length}</h3><span>знаю ${known.size}</span></div>
    <div class="flipwrap"><div class="flip ${flipped ? "on" : ""}" id="flip">
      <div class="face front"><small>${known.has(c[0]) ? "✓ знаю" : "вопрос"}</small>${esc(c[0])}</div>
      <div class="face back"><small>ответ</small>${esc(c[1])}</div></div></div>
    <div class="cardbar"><button class="btn" data-card="again">🔁 Ещё раз</button><button class="btn pri" data-card="know">✓ Знаю</button></div>
    <div class="cardbar"><button class="btn ghost" data-card="prev">‹ Назад</button><button class="btn ghost" data-card="shuffle">🔀 Перемешать</button></div>`;
}

function vFiles() {
  const f = D.files || [];
  if (!f.length) return `<div class="glass">${empty("📎", "Файлов пока нет — они появятся, когда к задачам прикрепят материалы")}</div>`;
  return `<div class="files">${f.map(x => `<div class="glass file"><div class="ic">${x.kind === "photo" ? "🖼" : "📄"}</div>
    <div class="fn">${esc(x.name)}</div><div class="ft">#${x.task} · ${esc(x.task_text).slice(0, 48)}</div>
    <button class="btn" data-file="${esc(x.path)}" data-task="${x.task}" ${x.path ? "" : "disabled"}>📩 В чат</button></div>`).join("")}</div>`;
}

// ---------- шторки ----------
function sheet(html) { document.getElementById("sheet").innerHTML = '<div class="grab"></div>' + html; document.getElementById("scrim").classList.add("on"); document.getElementById("sheet").classList.add("on"); }
function closeSheet() { document.getElementById("scrim").classList.remove("on"); document.getElementById("sheet").classList.remove("on"); }
function quickDates() {
  const t = P(today()), o = [["Сегодня", 0], ["Завтра", 1], ["Послезавтра", 2]];
  const nextMon = (8 - t.getDay()) % 7 || 7; o.push(["Пн", nextMon], ["+ неделя", 7]);
  return o.map(([n, k]) => { const ds = iso(add(t, k)); return [n, ds]; });
}
let draft = {};
function addSheet() {
  draft = { date: null, time: "", imp: false };
  sheet(`<h4>Новая задача</h4><p>Бот добавит её в список в ближайший запуск</p>
    <textarea id="ntext" placeholder="Например: эссе по социологии, 5 страниц"></textarea>
    <label class="f">Срок</label><div class="quick" id="nq">${quickDates().map(([n, ds]) => `<button class="btn" data-qd="${ds}">${n}<small>${ddmm(ds)}</small></button>`).join("")}<button class="btn" data-qd="">Без срока<small>—</small></button></div>
    <div class="row2"><div><label class="f">Дата</label><input type="date" id="ndate"></div><div><label class="f">Время</label><input type="time" id="ntime"></div></div>
    <div class="toggle" data-tg="imp">❗️ Важная (контрольная, сдача)<div class="sw" id="nimp"></div></div>
    <button class="btn pri go" data-save="add">Добавить</button>`);
  setTimeout(() => document.getElementById("ntext")?.focus(), 350);
}
function moveSheet(id) {
  const t = tasks().find(x => x.id === id);
  draft = { id, date: t?.date || null, time: t?.time || "" };
  sheet(`<h4>Перенести #${id}</h4><p>${esc(t?.text || "").slice(0, 120)}</p>
    <div class="quick" id="nq">${quickDates().map(([n, ds]) => `<button class="btn ${draft.date === ds ? "on" : ""}" data-qd="${ds}">${n}<small>${ddmm(ds)}</small></button>`).join("")}</div>
    <div class="row2"><div><label class="f">Дата</label><input type="date" id="ndate" value="${draft.date || ""}"></div><div><label class="f">Время</label><input type="time" id="ntime" value="${draft.time || ""}"></div></div>
    <button class="btn pri go" data-save="move">Перенести</button>`);
}

// ---------- отрисовка ----------
function render(animate = true) {
  const act = tasks().filter(t => !t.done), td = today(), d = P(td);
  const badge = { today: act.filter(t => t.date === td).length, tasks: act.filter(t => t.imp).length };
  document.getElementById("nav").innerHTML = TABS.map(([k, n]) => `<button class="nb ${tab === k ? "on" : ""}" data-tab="${k}">${IC[k]}${n}${badge[k] ? `<span class="dot">${badge[k]}</span>` : ""}</button>`).join("");
  const H = {
    today: [WDL[d.getDay()] + " · " + nice(td), 'Твой <span class="g">день</span>'],
    week: ["две недели вперёд", 'Твоя <span class="g">неделя</span>'],
    tasks: [act.length + " активных", '<span class="g">Задачи</span>'],
    sched: ["пары и ВУЦ", '<span class="g">Расписание</span>'],
    cards: [deck === null ? "колоды для зубрёжки" : "нажми на карточку", deck === null ? '<span class="g">Карточки</span>' : esc(D.cards[deck].name)],
    files: ["материалы к задачам", '<span class="g">Файлы</span>'],
  }[tab];
  document.getElementById("eyebrow").textContent = H[0];
  document.getElementById("title").innerHTML = H[1];
  const V = { today: vToday, week: vWeek, tasks: vTasks, sched: vSched, cards: vCards, files: vFiles }[tab];
  const main = document.getElementById("main");
  main.className = animate ? "anim" : "";
  main.innerHTML = V() + `<div class="foot">обновлено ботом ${D.generated.slice(8, 10)}.${D.generated.slice(5, 7)} в ${D.generated.slice(11, 16)}</div>`;
  document.getElementById("fab").style.display = tab === "tasks" || tab === "today" ? "grid" : "none";
  if (tg?.BackButton) (tab === "cards" && deck !== null) ? tg.BackButton.show() : tg.BackButton.hide();
  renderQueue();
}
function renderQueue() {
  const n = ops.length, mb = !!(tg && tg.initData && tg.MainButton);
  document.getElementById("queue").classList.toggle("on", n > 0);
  document.getElementById("qtext").textContent = n + " " + (n === 1 ? "изменение" : n < 5 ? "изменения" : "изменений");
  document.getElementById("send").style.display = mb ? "none" : "";
  document.getElementById("fab").style.bottom = n ? "calc(146px + env(safe-area-inset-bottom))" : "";
  if (mb) { if (n) { tg.MainButton.setParams({ text: "Отправить боту · " + n, color: "#6d5cff", text_color: "#ffffff" }); tg.MainButton.show(); } else tg.MainButton.hide(); }
}
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1800); }
function addOp(o, msg) { ops.push(o); store.set("ops", ops); haptic("light"); if (msg) toast(msg); render(false); }
function sendOps() {
  const payload = JSON.stringify({ v: 1, ops });
  if (!tg || !tg.initData) { toast("Открой планер кнопкой внизу чата"); return; }
  if (payload.length > 4000) { tg.showAlert("Слишком много изменений сразу — отправь часть, потом остальное."); return; }
  ops = []; store.set("ops", []); haptic("ok");
  tg.sendData(payload);
}

// ---------- события ----------
document.addEventListener("click", e => {
  const el = e.target.closest("button, [data-open], #flip, .toggle");
  if (!el) return;
  const s = el.dataset;
  if (s.tab) { if (tab !== s.tab) haptic("sel"); tab = s.tab; deck = null; selDay = null; openTask = null; render(); scrollTo({ top: 0 }); return; }
  if (s.done) { const id = +s.done; addOp({ op: "done", id }, "✅ #" + id + " — сделано"); return; }
  if (s.tmr) { addOp({ op: "tmr", id: +s.tmr }, "⏰ Перенесено на завтра"); return; }
  if (s.move) { moveSheet(+s.move); return; }
  if (s.imp) { const t = tasks().find(x => x.id === +s.imp); addOp({ op: "imp", id: +s.imp, value: !t.imp }, t.imp ? "Пометка снята" : "❗️ Отмечено важным"); return; }
  if (s.filter) { filter = s.filter; haptic("sel"); render(false); return; }
  if (s.day) { selDay = s.day; haptic("sel"); render(false); return; }
  if (s.week) { schedWeek += +s.week; selDay = null; haptic("sel"); render(false); return; }
  if (s.deck) { deck = +s.deck; cardIdx = 0; flipped = false; render(); return; }
  if (el.id === "flip") { flipped = !flipped; haptic("light"); el.classList.toggle("on", flipped); return; }
  if (s.card) {
    const d = D.cards[deck], n = d.cards.length;
    if (s.card === "know") { const k = new Set(store.get("known:" + d.name, [])); k.add(d.cards[cardIdx][0]); store.set("known:" + d.name, [...k]); cardIdx = (cardIdx + 1) % n; haptic("ok"); }
    else if (s.card === "again") { d.cards.push(d.cards.splice(cardIdx, 1)[0]); }
    else if (s.card === "prev") cardIdx = (cardIdx + n - 1) % n;
    else if (s.card === "shuffle") { d.cards.sort(() => Math.random() - .5); cardIdx = 0; toast("🔀 Перемешано"); }
    flipped = false; render(false); return;
  }
  if (s.file !== undefined) { addOp({ op: "send_file", path: s.file, task: +s.task }, "📩 Придёт в чат после отправки"); return; }
  if (s.qd !== undefined) { draft.date = s.qd || null; document.querySelectorAll("#nq .btn").forEach(b => b.classList.toggle("on", b === el)); const di = document.getElementById("ndate"); if (di) di.value = s.qd; haptic("sel"); return; }
  if (s.tg === "imp") { draft.imp = !draft.imp; document.getElementById("nimp").classList.toggle("on", draft.imp); haptic("sel"); return; }
  if (s.save === "add") {
    const text = document.getElementById("ntext").value.trim();
    if (!text) { document.getElementById("ntext").focus(); return; }
    const date = document.getElementById("ndate").value || draft.date || null, time = document.getElementById("ntime").value || null;
    closeSheet(); addOp({ op: "add", n: Date.now() % 1e6, text, date, time, imp: draft.imp }, "➕ Задача добавлена"); return;
  }
  if (s.save === "move") {
    const date = document.getElementById("ndate").value || draft.date, time = document.getElementById("ntime").value || null;
    if (!date) return;
    closeSheet(); addOp({ op: "move", id: draft.id, date, time }, "📅 #" + draft.id + " → " + ddmm(date)); return;
  }
  if (s.open !== undefined && !e.target.closest("button")) { const id = isNaN(+s.open) ? s.open : +s.open; openTask = openTask === id ? null : id; haptic("sel"); render(false); return; }
});
document.getElementById("scrim").onclick = closeSheet;
document.getElementById("fab").onclick = () => { haptic("light"); addSheet(); };
document.getElementById("undo").onclick = () => { ops.pop(); store.set("ops", ops); toast("↩︎ Отменено"); render(false); };
document.getElementById("send").onclick = sendOps;
if (tg?.MainButton) tg.MainButton.onClick(sendOps);
if (tg?.BackButton) tg.BackButton.onClick(() => { deck = null; render(); });

load().then(d => { D = d; if (msk().getDay() === 0) schedWeek = 1; render(); }).catch(err => {
  document.getElementById("main").innerHTML = `<div class="msg"><b>🔒</b>${esc(err.message && !/decrypt|operation/i.test(err.message) ? err.message : "Не удалось расшифровать данные — открой планер кнопкой в чате с ботом")}</div>`;
});
</script>
</body>
</html>
