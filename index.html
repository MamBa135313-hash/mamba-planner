<!doctype html>
<html lang="ru" class="noanim">
<head>
<meta charset="utf-8">
<!-- безопасность: адрес с ключом не передаётся сторонним сайтам; страница может обращаться только к своему сайту и к погоде -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org https://cdnjs.cloudflare.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' blob: data:; connect-src 'self' https://api.open-meteo.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="app-v" content="202610052100">
<title>Планер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..600&family=Onest:wght@400..800&display=swap" rel="stylesheet">
<style>
/* «Бумага поверх неба». Небо Москвы живёт за стеклом и остаётся главным; интерфейс — тихий:
   тёмное чернильное стекло, антиква Literata для часов, чисел и заголовков, гротеск Onest для текста.
   Цвет «бумаги» — у того, что выбрано и что нажимают (кнопки, вкладка, день, карточка для зубрёжки, цитата дня);
   остальные цвета несут смысл: предмет, срочность, готово. */
:root {
  --bg: #080c19; --bg-2: #111730;
  --glass: rgba(12,17,36,.68); --glass-hi: rgba(255,255,255,.06);
  --stroke: rgba(255,255,255,.08); --stroke-2: rgba(255,255,255,.15);
  --text: #f3f4f8; --text-2: #c9cee0; --text-3: #aab1c9;
  --paper: #f3eee2; --paper-2: #e6dfcd; --paper-ink: #161b2e; --paper-ink-2: #5d6278;
  --accent: var(--paper); --accent-2: #93d0ff; --accent-3: #ff86b4;
  --ok: #54e0aa; --warn: #ffad4d; --hot: #ff5f52; --soon: #b0a6ff;
  --grad: var(--paper);
  --serif: Literata, Georgia, "Times New Roman", serif;
  --disp: var(--serif);
  --sans: Onest, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  /* шкала кеглей (по «Основам стиля в типографике» Брингхерста): 11 · 12 · 14 · 16 · 18 · 21 · 24 · 36 · 48 · 72, часы — 84 */
  --fs-11: 11px; --fs-12: 12px; --fs-14: 14px; --fs-16: 16px; --fs-18: 18px; --fs-21: 21px; --fs-24: 24px; --fs-36: 36px; --fs-48: 48px; --fs-72: 72px; --fs-clock: 84px;
  --ease: cubic-bezier(.2,.8,.2,1); --spring: cubic-bezier(.34,1.5,.6,1);
  --safe-top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
  /* снизу: на iPhone — стандартный отступ браузера, на Android в полноэкранном Telegram — высота системных кнопок,
     которую сообщает сам Telegram (стандартный там пустой, и меню оказывалось под кнопками ||| ○ ‹) */
  --safe-bottom: max(env(safe-area-inset-bottom, 0px), calc(var(--tg-safe-area-inset-bottom, 0px) + var(--tg-content-safe-area-inset-bottom, 0px)));
  --edge-hi: rgba(255,255,255,.2); --edge-lo: rgba(255,255,255,.035);
  --shadow: 0 24px 48px -20px rgba(0,0,0,.6);
  color-scheme: dark;
}
@property --paper { syntax: "<color>"; inherits: true; initial-value: #f3eee2; }
@property --i { syntax: "<number>"; inherits: true; initial-value: 0; }
@property --paper-2 { syntax: "<color>"; inherits: true; initial-value: #e6dfcd; }
@property --on-sky { syntax: "<color>"; inherits: true; initial-value: #ffffff; }
@property --on-sky-2 { syntax: "<color>"; inherits: true; initial-value: rgba(255,255,255,.8); }
@property --on-sky-sh { syntax: "<color>"; inherits: true; initial-value: rgba(4,7,20,.3); }
@property --on-sky-scrim { syntax: "<color>"; inherits: true; initial-value: rgba(4,7,20,0); }
/* небо меняется по минуте — «бумага» и текст поверх неба следуют за ним медленно, без скачков; смена светлый ↔ тёмный — сразу (skyjump) */
:root { transition: --paper 6s linear, --paper-2 6s linear, --on-sky 4s linear, --on-sky-2 4s linear, --on-sky-sh 4s linear, --on-sky-scrim 4s linear; }
:root.noanim, :root.skyjump { transition: none; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  font: 450 var(--fs-16)/1.45 var(--sans); font-optical-sizing: auto;
  color: var(--text); background: var(--bg); overflow-x: hidden; -webkit-font-smoothing: antialiased;
  padding-top: var(--safe-top); padding-bottom: calc(120px + var(--safe-bottom));
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, .toggle:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
/* всё, что въезжает сбоку (анимации, свайпы), обрезаем по краю экрана: иначе страница на миг
   становится шире, Telegram перестраивает окно и нижняя панель уезжает вниз */
.wrap { overflow-x: hidden; overflow-x: clip; }
button:disabled { cursor: default; }
.num { font-variant-numeric: tabular-nums lining-nums; }
.nw { white-space: nowrap; }

/* ---------- сцена: небо Москвы ---------- */
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
#scene { position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none; }
#scene .g { position: absolute; inset: 0; transition: background 2.5s ease; }
#scene .haze { position: absolute; inset: 0; transition: background 2.5s ease, opacity 2.5s; }
.sun { position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; transition: left 3s ease, top 3s ease, opacity 2.5s, transform 3s, filter 2.5s;
  background: radial-gradient(circle, #fffef4 0%, #fff1b8 38%, #ffcf5c 62%, rgba(255,190,70,0) 71%);
  box-shadow: 0 0 70px 26px rgba(255,214,120,.42), 0 0 220px 90px rgba(255,190,90,.22); }
.sun.low { background: radial-gradient(circle, #fff3d6 0%, #ffb36b 40%, #ff7a3d 62%, rgba(255,110,60,0) 71%); box-shadow: 0 0 90px 36px rgba(255,140,80,.5), 0 0 260px 120px rgba(255,100,70,.28); transform: scale(1.25); }
.moon { position: absolute; width: 66px; height: 66px; margin: -33px 0 0 -33px; overflow: visible; transition: left 3s, top 3s, opacity 2.5s; }
/* свечение — только от освещённой части; ярче к полнолунию */
.moon .lit { filter: drop-shadow(0 0 calc(3px + 5px * var(--mk, 1)) rgba(245,246,255,.65)) drop-shadow(0 0 calc(10px + 26px * var(--mk, 1)) rgba(170,190,255,.4)); }
.moon .ash { fill: #8d9cc4; opacity: .07; }
.skyline { position: absolute; left: 0; bottom: 0; width: 100%; height: 26vh; min-height: 150px; transition: opacity 2s; }
.skyline .b { transition: fill 2.5s; }
.skyline .w { fill: #ffd77a; transition: opacity 2.5s; }
.sun, .moon { opacity: 0; }
.noanim #scene *, .noanim #scene { transition: none !important; }
.flash { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: #dfe6ff; opacity: 0; }
.flash.on { animation: flash .9s ease-out; }
@keyframes flash { 0% { opacity: 0 } 8% { opacity: .35 } 16% { opacity: .05 } 26% { opacity: .28 } 100% { opacity: 0 } }
/* плёночное зерно и мягкое затемнение снизу — чтобы стекло читалось на любом небе */
.grain { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .07; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.vig { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(180deg, transparent 55%, rgba(4,6,16,.3) 100%); }

/* ---------- шапка поверх неба ---------- */
.hud { position: relative; isolation: isolate; max-width: 640px; margin: 0 auto; padding: 18px 20px 4px; color: var(--on-sky); will-change: transform, opacity; }
.hud::before { content: ""; position: absolute; inset: -40px -10px -30px; z-index: -1; pointer-events: none; background: radial-gradient(120% 90% at 35% 40%, var(--on-sky-scrim), transparent 72%); }
.hud .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.hud .row > div:first-child { min-width: 0; }
.greet { font-weight: 550; font-size: var(--fs-16); opacity: .9; text-shadow: 0 0 2px var(--on-sky-sh), 0 1px 12px var(--on-sky-sh); }
.clock { white-space: nowrap; font: 500 var(--fs-clock)/.9 var(--serif); font-optical-sizing: auto; letter-spacing: -.035em; margin: 6px 0 0 -4px; font-variant-numeric: tabular-nums lining-nums; text-shadow: 0 6px 34px var(--on-sky-sh); }
.clock i { font-style: normal; display: inline-block; animation: tick 2s ease-in-out infinite; margin: 0 -.07em 0 -.05em; transform: translateY(-.05em); }
@keyframes tick { 50% { opacity: .4 } }
.date { font: italic 500 var(--fs-21)/1.2 var(--serif); color: var(--on-sky); margin-top: 8px; text-shadow: 0 0 2px var(--on-sky-sh), 0 1px 10px var(--on-sky-sh); }
.wx { flex: none; max-width: 46%; text-align: right; padding-top: 4px; text-shadow: 0 0 2px var(--on-sky-sh), 0 2px 16px var(--on-sky-sh); cursor: pointer; }
.wx .temp { font: 500 var(--fs-48)/1 var(--serif); letter-spacing: -.03em; font-variant-numeric: lining-nums; }
.wx .cond { font-weight: 650; font-size: var(--fs-14); margin-top: 8px; }
.wx .feel { font-size: var(--fs-12); font-weight: 550; color: var(--on-sky-2); margin-top: 3px; font-variant-numeric: tabular-nums; }
.title { margin: 0 0 0 -1px; font: 600 var(--fs-36)/1.04 var(--serif); letter-spacing: -.025em; text-shadow: 0 4px 26px var(--on-sky-sh); overflow-wrap: anywhere; }
.sub { margin-top: 7px; font-size: var(--fs-14); font-weight: 550; color: var(--on-sky-2); text-shadow: 0 0 2px var(--on-sky-sh), 0 1px 8px var(--on-sky-sh); }
/* сводка дня — одной-двумя фразами, а не облаком чипов */
.lede { margin: 16px 0 0; max-width: 34em; font-size: var(--fs-16); line-height: 1.45; font-weight: 550; color: var(--on-sky-2); text-shadow: 0 0 2px var(--on-sky-sh), 0 1px 12px var(--on-sky-sh); text-wrap: pretty; }
.lede b { font-weight: 700; color: var(--on-sky); }
/* номер задачи в сводке — нажимается, открывает шторку задачи */
.tref { border: 0; background: none; padding: 6px 2px; margin: -6px -2px; font: inherit; font-weight: 700; color: var(--on-sky); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--on-sky) 45%, transparent); }
.brief { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.brief:empty { display: none; }
#chatcard { scroll-margin-top: calc(var(--safe-top) + 60px); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 99px; font-size: var(--fs-14); font-weight: 600; color: var(--text); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  background: var(--glass); border: 1px solid var(--stroke-2); backdrop-filter: blur(16px) saturate(170%); -webkit-backdrop-filter: blur(16px) saturate(170%); text-shadow: none; }
.topbar { position: fixed; left: 0; right: 0; top: 0; z-index: 25; padding: calc(var(--safe-top) + 12px) 20px 12px; text-align: center; font: 600 var(--fs-16)/1.2 var(--serif); font-variant-numeric: tabular-nums lining-nums;
  background: color-mix(in srgb, var(--bg-2) 66%, transparent); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-bottom: 1px solid var(--stroke); transform: translateY(-101%); transition: transform .45s var(--ease); }
.topbar.on { transform: none; }

/* ---------- стекло ---------- */
main { max-width: 640px; margin: 0 auto; padding: 8px 14px 0; }
.glass { position: relative; isolation: isolate; border-radius: 26px;
  background: linear-gradient(170deg, var(--glass-hi), transparent 40%), var(--glass);
  backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%);
  box-shadow: var(--shadow), inset 0 1px 0 var(--edge-hi); }
.glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(160deg, var(--edge-hi), var(--edge-lo) 32%, var(--edge-lo) 70%, rgba(255,255,255,.1));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.card { margin-top: 12px; overflow: hidden; }
.ch { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 16px 18px 6px; }
.ch h3 { margin: 0; min-width: 0; font: 600 var(--fs-18)/1.2 var(--serif); letter-spacing: -.01em; color: var(--text); }
.ch h3 i { display: none; }
.ch span { flex: none; font-size: var(--fs-14); font-weight: 550; color: var(--text-3); font-variant-numeric: tabular-nums; }
.empty { padding: 22px 22px 26px; text-align: center; color: var(--text-2); font-weight: 500; font-size: var(--fs-14); }
.empty b { display: grid; place-items: center; width: 54px; height: 54px; margin: 0 auto 12px; border-radius: 50%; font-size: var(--fs-24); font-weight: 400; background: var(--stroke); box-shadow: inset 0 0 0 1px var(--stroke-2); }
.empty p { margin: 0 auto; max-width: 26em; text-wrap: pretty; }
.empty p strong { display: block; margin-bottom: 4px; font: 600 var(--fs-18)/1.25 var(--serif); color: var(--text); }
.empty .btn { margin-top: 16px; }
.sk { height: 140px; margin-top: 12px; overflow: hidden; }
.sk::before { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.07) 50%, transparent 70%); transform: translateX(-100%); animation: shim 1.4s infinite; }
@keyframes shim { to { transform: translateX(100%); } }

/* ---------- фокус: что сейчас ---------- */
.focus { margin-top: 18px; overflow: hidden; }
.fpages { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.fpages::-webkit-scrollbar { display: none; }
.fp { position: relative; flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; padding: 16px 18px 16px; display: flex; flex-direction: column; will-change: opacity; }
/* свечение — одно на всю плашку: при свайпе цвет страницы плавно перетекает в цвет следующей, без резкой границы */
.fgw { position: absolute; inset: 0; z-index: -1; overflow: hidden; border-radius: inherit; pointer-events: none; }
.fgw i { position: absolute; inset: 0; }
.fgw i::before { content: ""; position: absolute; left: -30%; top: -55%; width: 80%; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle, var(--g) 0%, transparent 65%); opacity: .26; animation: breathe 9s ease-in-out infinite alternate; }
@keyframes breathe { to { transform: translate(8%, 6%) scale(1.12); opacity: .36; } }
/* переключатель страниц — в шапке плашки, справа от подписи страницы */
.fsw { position: absolute; top: 15px; right: 14px; z-index: 2; display: flex; gap: 2px; padding: 3px; border-radius: 99px; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px var(--stroke); }
.fsw button { border: 0; background: none; min-height: 34px; padding: 6px 12px; border-radius: 99px; font-size: var(--fs-12); font-weight: 600; color: var(--text-2); transition: background .3s var(--ease), color .3s var(--ease); }
.fsw button.on { background: var(--paper); color: var(--paper-ink); }
.fx { display: grid; grid-template-columns: 82px 1fr; gap: 16px; align-items: center; margin-top: 14px; }
.fp > .fx:last-child { margin: auto 0; padding-top: 6px; }   /* страница без ленты дня — по центру плашки */
.ring { position: relative; width: 82px; height: 82px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring circle { fill: none; stroke-width: 6; stroke-linecap: round; }
.ring .bg { stroke: var(--stroke-2); }
.ring .fg { stroke: var(--fc); filter: drop-shadow(0 0 5px color-mix(in srgb, var(--fc) 70%, transparent)); transition: stroke-dashoffset 1.2s var(--ease); }
.ring .lb { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .lb b { font: 600 var(--fs-24)/1 var(--serif); letter-spacing: -.02em; font-variant-numeric: tabular-nums lining-nums; }
.ring .lb small { font-size: var(--fs-11); font-weight: 550; color: var(--text-3); margin-top: 3px; }
.flab { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding-right: 150px; font-size: var(--fs-14); font-weight: 650; color: var(--fc); }
.flab.live::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: ping 1.6s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 currentColor; } 100% { box-shadow: 0 0 0 8px transparent; } }
.ftitle { font: 600 var(--fs-21)/1.18 var(--serif); letter-spacing: -.015em; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-wrap: balance; }
.ftitle.long { font-size: var(--fs-18); line-height: 1.25; }
.fmeta { font-size: var(--fs-14); color: var(--text-2); margin-top: 6px; font-weight: 500; }
.ribbon { margin-top: 18px; padding: 0 2px; }
.track { position: relative; height: 8px; border-radius: 99px; background: var(--stroke); }
.track .sg { position: absolute; top: 0; bottom: 0; border-radius: 99px; background: var(--c); opacity: .55; }
.track .sg.past { opacity: .2; }
.track .sg.cur { opacity: 1; box-shadow: 0 0 14px color-mix(in srgb, var(--c) 70%, transparent); }
.needle { position: absolute; top: -6px; bottom: -6px; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--paper); box-shadow: 0 0 8px rgba(0,0,0,.4); }
.needle::before { content: ""; position: absolute; top: -4px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--paper); }
.ticks { position: relative; height: 14px; margin-top: 7px; font-size: var(--fs-12); font-weight: 550; color: var(--text-3); font-variant-numeric: tabular-nums; }
.ticks span { position: absolute; transform: translateX(-50%); }

/* ---------- лента дедлайнов: посадочные талоны ---------- */
.lnk { flex: none; display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; padding: 10px 0 10px 12px; margin: -10px 0 -10px -12px; font-size: var(--fs-14); font-weight: 600; color: var(--accent-2); font-family: var(--sans); }
.lnk svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.tkts { display: flex; gap: 10px; overflow-x: auto; padding: 8px 14px 16px; scroll-snap-type: x proximity; scroll-padding: 0 14px; scrollbar-width: none; overscroll-behavior-x: contain; }
.tkts::-webkit-scrollbar { display: none; }
/* талон: сверху — сколько осталось (корешок цвета срочности), по линии отрыва — что сдать */
.tkt { --perf: 78px; position: relative; isolation: isolate; overflow: hidden; flex: 0 0 160px; height: 186px; scroll-snap-align: start; border: 0; border-radius: 16px; padding: 13px 13px 12px; text-align: left; color: var(--text); display: flex; flex-direction: column;
  background: linear-gradient(180deg, var(--uc) 0 3px, color-mix(in srgb, var(--uc) 13%, rgba(255,255,255,.08)) 3px var(--perf), rgba(255,255,255,.055) var(--perf));
  -webkit-mask: radial-gradient(circle at 0 var(--perf), #0000 7px, #000 7.5px) left / 51% 100% no-repeat, radial-gradient(circle at 100% var(--perf), #0000 7px, #000 7.5px) right / 51% 100% no-repeat;
  mask: radial-gradient(circle at 0 var(--perf), #0000 7px, #000 7.5px) left / 51% 100% no-repeat, radial-gradient(circle at 100% var(--perf), #0000 7px, #000 7.5px) right / 51% 100% no-repeat;
  transition: transform .4s var(--spring); }
.tkt::after { content: ""; position: absolute; left: 10px; right: 10px; top: var(--perf); border-top: 1.5px dashed rgba(255,255,255,.22); pointer-events: none; }
.tkt:active { transform: scale(.95); }
.tkt .tn { display: flex; align-items: baseline; gap: 6px; flex: none; white-space: nowrap; }
.tkt .tn b { font: 600 var(--fs-36)/1 var(--serif); letter-spacing: -.03em; font-variant-numeric: tabular-nums lining-nums; }
.tkt .tn span { font-size: var(--fs-14); font-weight: 650; color: color-mix(in srgb, var(--uc) 75%, #fff); }
.tkt .tw { flex: none; margin-top: 6px; font-size: var(--fs-12); font-weight: 550; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tkt .ti { position: absolute; right: 10px; top: 11px; font-style: normal; font-size: var(--fs-14); }
.tkt .pd { position: absolute; right: 12px; bottom: 15px; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.tkt .tx { margin-top: 22px; font-size: var(--fs-14); font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tkt .tf { margin-top: auto; padding-top: 6px; font-size: var(--fs-12); font-weight: 550; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 12px; font-variant-numeric: tabular-nums; }
/* ближайший дедлайн уже крупно наверху (страница «Дедлайны») — в ленте он схлопывается, при «Парах» возвращается;
   ширину и прозрачность ведёт сам свайп плашки (leadFx), поэтому лента едет вместе с пальцем и ничего не догоняет после */
.tkt.lead .tn, .tkt.lead .tw, .tkt.lead .tx, .tkt.lead .tf { flex: none; width: 134px; }
.tkt.lead .ti { right: auto; left: 149px; transform: translateX(-100%); } .tkt.lead .pd { right: auto; left: 140px; }
.tkts { position: relative; }
.tkt.all { flex-basis: 104px; align-items: center; justify-content: center; text-align: center; font-size: var(--fs-14); font-weight: 550; color: var(--text-2); background: transparent; box-shadow: inset 0 0 0 1.5px var(--stroke-2); -webkit-mask: none; mask: none; }
.tkt.all::after { display: none; }
.tkt.all b { display: block; font: 600 var(--fs-24)/1.1 var(--serif); color: var(--text); margin-bottom: 4px; }
.tkt.solo { position: absolute; left: 14px; top: 8px; width: 160px; height: 186px; padding: 14px; opacity: 0; pointer-events: none; }
.tkt.past { --uc: #8a8fab; opacity: .62; }
.tsh .cd { display: flex; align-items: baseline; gap: 10px; margin: 2px 0 10px; }
.tsh .cd b { font: 600 var(--fs-48)/1 var(--serif); letter-spacing: -.03em; color: var(--uc); font-variant-numeric: lining-nums; }
.tsh .cd span { font-size: var(--fs-14); font-weight: 600; color: var(--text-2); }
.tsh h4.long { font-size: var(--fs-18); line-height: 1.3; }
.tsh .tm { margin-top: 10px; }
.tsh .fpill { margin-top: 8px; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
.acts .btn { justify-content: center; padding: 14px 10px; border-radius: 16px; }

/* ---------- пары ---------- */
.tl { padding: 4px 0 10px; }
.ls { position: relative; display: grid; grid-template-columns: 52px 24px 1fr; padding: 0 16px 0 10px; }
.ls .t { padding: 12px 0 0; text-align: right; font: 600 var(--fs-16)/1 var(--serif); font-variant-numeric: tabular-nums lining-nums; }
.ls .t small { display: block; font: 500 var(--fs-12)/1 var(--sans); color: var(--text-3); margin-top: 5px; }
.ls .rail { position: relative; }
.ls .rail::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--stroke-2); }
.ls:first-child .rail::before { top: 18px; }
.ls:last-child .rail::before { bottom: auto; height: 18px; }
.ls:only-child .rail::before { display: none; }
.ls .rail i { position: absolute; left: 50%; top: 12px; width: 13px; height: 13px; margin-left: -6.5px; border-radius: 50%; background: var(--bg-2); border: 3px solid var(--c); }
.ls.past .rail i { background: var(--c); }
.ls.cur .rail i { background: var(--c); box-shadow: 0 0 0 5px color-mix(in srgb, var(--c) 26%, transparent), 0 0 18px var(--c); }
.ls.cur::before { content: ""; position: absolute; inset: 3px 8px; border-radius: 16px; z-index: -1; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 20%, transparent), transparent 85%); }
.ls .b { padding: 9px 0 13px 6px; min-width: 0; }
.ls .n { font-weight: 650; font-size: var(--fs-16); line-height: 1.3; }
.ls .m { font-size: var(--fs-14); color: var(--text-2); margin-top: 3px; font-weight: 450; }
.ls.past { opacity: .5; }
.hw { margin-top: 8px; padding: 8px 11px; border-radius: 12px; font-size: var(--fs-14); font-weight: 550; background: color-mix(in srgb, var(--c) 13%, transparent); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); }

/* ---------- пилюли и кнопки ---------- */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-12); font-weight: 600; padding: 3px 8px; border-radius: 99px; background: var(--stroke); color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.live { background: var(--c, var(--paper)); color: #10131f; padding: 2px 8px; vertical-align: 2px; }
.pill.hot { background: rgba(255,95,82,.16); color: #ff8a80; }
.pill.ok { background: rgba(84,224,170,.15); color: var(--ok); }
.pill.acc { background: rgba(147,208,255,.14); color: var(--accent-2); }
.btn { border: 1px solid var(--stroke-2); background: var(--stroke); color: var(--text); font-size: var(--fs-14); font-weight: 600; padding: 10px 13px; border-radius: 14px; display: inline-flex; align-items: center; gap: 7px; transition: transform .3s var(--spring), background .2s; }
.btn:active { transform: scale(.95); }
.btn.pri { background: var(--paper); border-color: transparent; color: var(--paper-ink); box-shadow: 0 10px 24px -12px rgba(0,0,0,.7), inset 0 -1px 0 rgba(0,0,0,.08); }
.btn.ghost { background: transparent; }
.btn.pri:disabled { background: var(--stroke); color: var(--text-2); border-color: var(--stroke-2); box-shadow: none; opacity: 1; }

/* ---------- задачи ---------- */
.task { position: relative; }
.task + .task::before { content: ""; position: absolute; left: 58px; right: 18px; top: 0; height: 1px; background: var(--stroke); z-index: 1; }
.tk { position: relative; display: grid; grid-template-columns: 28px 1fr auto; gap: 14px; align-items: start; padding: 14px 16px; touch-action: pan-y; transition: transform .5s var(--spring); }
.rev { position: absolute; top: 7px; bottom: 7px; width: 0; border-radius: 16px; display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap; font-size: var(--fs-14); font-weight: 700; transition: width .5s var(--spring); }
.rev span { transition: transform .3s var(--spring); }
.task.drag .rev { transition: none; }
.tk[data-sw] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.task.grab .tk { background: rgba(255,255,255,.07); box-shadow: inset 3px 0 0 var(--paper); }   /* задача «взята» — можно вести */
.task.arm .rev span { transform: scale(1.15); }
.rev.l { left: 8px; background: var(--ok); color: #05281b; }
.rev.r { right: 8px; background: var(--warn); color: #2c1400; }
.chk { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255,255,255,.28); background: transparent; display: grid; place-items: center; padding: 0; margin-top: 1px; transition: all .35s var(--spring); }
.chk { position: relative; } .chk::after { content: ""; position: absolute; inset: -9px; }   /* зона нажатия 46×46 */
.chk svg { width: 15px; height: 15px; stroke: #05281b; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .4s var(--ease) .08s; }
.chk:not(:disabled):active { transform: scale(.85); }
.task.done .chk, .chk.pop { background: var(--ok); border-color: transparent; transform: scale(1.08); box-shadow: 0 8px 18px -8px rgba(84,224,170,.9); }
.task.done .chk svg, .chk.pop svg { stroke-dashoffset: 0; }
.tb { min-width: 0; }
.tt { font-weight: 600; font-size: var(--fs-16); line-height: 1.38; overflow-wrap: anywhere; }
.task.done .tt { text-decoration: line-through; color: var(--text-3); }
.tm { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.src { font-size: var(--fs-12); color: var(--text-3); margin-top: 6px; font-weight: 500; }
.more { display: none; grid-column: 1 / -1; flex-direction: column; gap: 8px; margin-top: -3px; }
.task.open .more { display: flex; animation: rise .35s var(--ease) both; }
.more .tfl { display: flex; flex-wrap: wrap; } .more .tfl .fpill { margin: 0 6px 4px 0; }
.more .acts { display: flex; gap: 6px; margin-top: 4px; }
.more .acts .btn { flex: 1; min-width: 0; justify-content: center; padding: 10px 6px; font-size: var(--fs-14); white-space: nowrap; }
.due { min-width: 50px; text-align: center; padding: 7px 6px 6px; border-radius: 14px; background: var(--stroke); color: var(--text-2); }
.due b { display: block; font: 600 var(--fs-21)/1 var(--serif); font-variant-numeric: tabular-nums lining-nums; }
.due b.s { font-size: var(--fs-14); padding: 3px 0 2px; }
.due small { display: block; font-size: var(--fs-11); font-weight: 600; margin-top: 4px; }
.due.hot { background: var(--hot); color: #fff; box-shadow: 0 10px 20px -10px rgba(255,95,82,.9); }
.due.warn { background: rgba(255,173,77,.16); color: var(--warn); }
.due.soon { background: rgba(176,166,255,.15); color: var(--soon); }
.task.done .due { opacity: .4; }
.task.past .tb, .task.past .chk { opacity: .55; }
.task.past .tt { color: var(--text-2); }
.due.past { background: var(--stroke); color: var(--text-3); }

/* ---------- дни, фильтры ---------- */
.days { display: flex; gap: 8px; overflow-x: auto; margin: 0 -14px; padding: 6px 14px 12px; scrollbar-width: none; scroll-snap-type: x proximity; scroll-padding: 0 14px; }
.days::-webkit-scrollbar { display: none; }
.day { flex: 0 0 auto; width: 56px; padding: 10px 0 9px; border: 0; border-radius: 18px; text-align: center; color: var(--text); scroll-snap-align: start; transition: transform .4s var(--spring), box-shadow .3s; }
.day .w { font-size: var(--fs-12); font-weight: 600; color: var(--text-3); }
.day .d { font: 600 var(--fs-21)/1 var(--serif); margin-top: 6px; font-variant-numeric: tabular-nums lining-nums; }
.day .ld { display: flex; justify-content: center; align-items: flex-end; gap: 2px; height: 12px; margin-top: 8px; }
.day .ld i { width: 4px; border-radius: 2px; background: var(--text-3); height: 6px; }
.day .ld i.l { height: 10px; opacity: .8; }
.day .ld i.h { background: var(--hot); height: 12px; } .day .ld i.v { background: var(--warn); height: 9px; } .day .ld i.b { background: var(--accent-3); height: 8px; }
.day.today .d { color: var(--accent-2); }
.day.today .w { color: var(--accent-2); }
.day.on { background: var(--paper); color: var(--paper-ink); transform: translateY(-3px); box-shadow: 0 16px 28px -14px rgba(0,0,0,.8); }
.day.on .w { color: var(--paper-ink-2); } .day.on .d { color: var(--paper-ink); } .day.on .ld i:not(.h):not(.v):not(.b) { background: var(--paper-ink); opacity: .45; }
.seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 14px -14px 0; padding: 2px 14px 4px; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 0 0 auto; border: 1px solid var(--stroke-2); background: var(--glass); backdrop-filter: blur(16px) saturate(170%); -webkit-backdrop-filter: blur(16px) saturate(170%); color: var(--text-2); font-size: var(--fs-14); font-weight: 600; padding: 9px 14px; border-radius: 99px; transition: color .3s var(--ease), border-color .3s; }
.seg button b { opacity: .6; margin-left: 6px; font-weight: 600; font-variant-numeric: tabular-nums; }
.seg button.on { background: transparent; color: var(--paper-ink); border-color: transparent; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
.seg button.on b { opacity: .55; }
.wk { display: flex; align-items: center; justify-content: space-between; padding: 6px; border-radius: 99px; margin-top: 14px; }
.wk .ar { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--stroke); color: var(--text); display: grid; place-items: center; transition: transform .3s var(--spring); }
.wk .ar:active { transform: scale(.88); }
.wk .ar svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.wk b, .wk .wkl { min-width: 0; font: 600 var(--fs-16)/1.2 var(--serif); font-variant-numeric: lining-nums; }
.wk .wkl { border: 0; background: none; color: var(--text); text-align: center; padding: 0 6px; }
.wk .wkl small { display: block; text-align: center; font: 550 var(--fs-12)/1.2 var(--sans); color: var(--text-3); margin-top: 3px; }
.wk b { display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.wk b svg { flex: none; width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
.days.seven { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; overflow: visible; margin: 0; padding: 10px 0 12px; }
.days.seven .day { width: auto; border-radius: 16px; }
/* выделение дня — «пилюля», которая переезжает к выбранному дню */
.days.seven { position: relative; }
.days.seven .dsel { position: absolute; top: 10px; bottom: 12px; left: 0; width: calc((100% - 36px) / 7); border-radius: 16px; z-index: 0; pointer-events: none;
  background: var(--paper); box-shadow: 0 16px 28px -14px rgba(0,0,0,.8);
  transform: translateX(calc(var(--i, 0) * (100% + 6px))) translateY(-3px); transform-origin: 50% 50%; }
.days.seven .day.on { background: transparent; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; transform: translateY(-3px); }
.days.seven .day.on::after { opacity: 0; }
.days.seven .day { transition: transform .45s var(--spring), background .3s; }
.day .ld i { transform-origin: 50% 100%; }
html { touch-action: pan-y; }   /* вертикально листает браузер, вбок — свайп между вкладками (карусели, ленты и просмотр файла — свои области прокрутки, у них всё как раньше) */
nav.dock { touch-action: none; }
.dock.drag, .noanim nav.dock { transition: none; }
.calbody .ls .rail::before { transform-origin: 50% 0; }
.anim > .calbody, .anim > .days.seven { animation: none; }
#main.anim:is([data-tab="tasks"], [data-tab="cards"], [data-tab="files"]) > * { animation: none; }   /* там всё анимирует JS — каскадом, по самим плиткам */
.seg { position: relative; }
.seg .segi { position: absolute; left: 0; top: 2px; border-radius: 99px; background: var(--paper); box-shadow: 0 10px 22px -12px rgba(0,0,0,.8); pointer-events: none; z-index: 0; }
.seg button { position: relative; z-index: 1; }
.deck .pr i { transform-origin: 0 50%; }
.wk b small { display: block; text-align: center; font: 550 var(--fs-12)/1.2 var(--sans); color: var(--text-3); margin-top: 3px; }
.bd { display: flex; align-items: center; gap: 14px; padding: 14px 18px 16px; font-weight: 600; }
.bd b { font-size: var(--fs-24); }
.bd div { font: 600 var(--fs-18)/1.3 var(--serif); }
.bd small { display: block; font: 500 var(--fs-14) var(--sans); color: var(--text-2); }
.chg { padding: 10px 18px 14px; display: flex; flex-direction: column; gap: 8px; }
.chg div { font-size: var(--fs-14); font-weight: 500; line-height: 1.4; padding-left: 14px; border-left: 2px solid var(--warn); }

/* ---------- карточки ---------- */
.decks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.deck { position: relative; overflow: hidden; isolation: isolate; padding: 15px 15px 14px; border-radius: 20px; min-height: 158px; display: flex; flex-direction: column; justify-content: space-between; color: var(--text); border: 0; text-align: left;
  background: linear-gradient(165deg, color-mix(in srgb, var(--dc) 20%, rgba(12,17,36,.6)), rgba(12,17,36,.56) 70%);
  backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 0 0 1px color-mix(in srgb, var(--dc) 26%, transparent), 0 16px 30px -20px #000; transition: transform .4s var(--spring); }
.deck:active { transform: scale(.96); }
.deck .cnt { font: 600 var(--fs-36)/1 var(--serif); letter-spacing: -.02em; color: var(--dc); font-variant-numeric: lining-nums; }
.deck b { font: 600 var(--fs-16)/1.22 var(--serif); }
.deck span { display: block; font-size: var(--fs-12); font-weight: 500; color: var(--text-2); margin-top: 6px; }
.deck span em { font-style: normal; font-weight: 650; color: var(--dc); }
.deck .pr { height: 4px; border-radius: 2px; background: var(--stroke-2); margin-top: 10px; overflow: hidden; }
.deck .pr i { display: block; height: 100%; background: var(--dc); border-radius: 2px; }
.dh { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 7px 16px 7px 7px; border-radius: 99px; }
.dh .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--stroke-2); overflow: hidden; }
.dh .bar i { display: block; height: 100%; border-radius: 3px; background: var(--dc, var(--paper)); transition: width .4s var(--ease); }
.dh .ar { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--stroke); color: var(--text); display: grid; place-items: center; padding: 0; }
.dh .ar svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.4; fill: none; stroke-linecap: round; }
.dh b { font: 600 var(--fs-16) var(--serif); white-space: nowrap; font-variant-numeric: tabular-nums lining-nums; }
.dh span { font-size: var(--fs-12); font-weight: 600; color: var(--ok); white-space: nowrap; }
.stack { position: relative; height: 340px; margin-top: 18px; perspective: 1400px; }
.stack .gh { position: absolute; inset: 0; border-radius: 14px; background: var(--paper-2); opacity: .5; }
.stack .g1 { transform: translateY(12px) scale(.95); opacity: .4; }
.stack .g2 { transform: translateY(23px) scale(.9); opacity: .2; }
.flip { position: absolute; inset: 0; touch-action: pan-y; cursor: pointer; transition: transform .55s var(--spring); }
.flip .in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .7s var(--spring); }
.flip.on .in { transform: rotateY(180deg); }
/* карточка для зубрёжки — как настоящая бумажная: красная линия сверху, голубые линейки */
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 36px 26px 30px; overflow-wrap: anywhere; }
.face div { font: 600 var(--fs-24)/1.32 var(--serif); letter-spacing: -.01em; text-wrap: balance; }
.face small { font-size: var(--fs-12); font-weight: 600; margin-bottom: 14px; }
.face em { position: absolute; bottom: 16px; font-style: normal; font-size: var(--fs-12); font-weight: 500; }
.face.front { color: var(--paper-ink); box-shadow: 0 30px 60px -24px rgba(0,0,0,.75);
  background: linear-gradient(180deg, transparent 52px, #e48c8c 52px, #e48c8c 54px, transparent 54px),
    repeating-linear-gradient(180deg, transparent 0 31px, rgba(80,130,200,.2) 31px 32px) 0 54px / 100% calc(100% - 54px) no-repeat, var(--paper); }
.face.front small { color: var(--paper-ink-2); position: absolute; top: 18px; left: 22px; margin: 0; }
.face.front em { color: var(--paper-ink-2); }
.face.back { transform: rotateY(180deg); color: var(--text); box-shadow: 0 30px 60px -24px rgba(0,0,0,.75);
  background: linear-gradient(180deg, var(--dc, var(--soon)) 0 4px, transparent 4px), linear-gradient(165deg, color-mix(in srgb, var(--dc, #b0a6ff) 22%, #161b34), #11152b 85%); }
.face.back small { color: var(--dc, var(--soon)); position: absolute; top: 18px; left: 22px; margin: 0; }
.stamp { position: absolute; top: 26px; padding: 5px 11px; border: 3px solid; border-radius: 8px; font: 700 var(--fs-16) var(--sans); letter-spacing: .06em; opacity: 0; pointer-events: none; background: color-mix(in srgb, var(--paper) 85%, transparent); }
.stamp.k { left: 22px; color: #0d8a5a; transform: rotate(-12deg); }
.stamp.a { right: 22px; color: #c2560c; transform: rotate(12deg); }
.cardbar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.cardbar .btn { justify-content: center; padding: 15px; font-size: var(--fs-16); border-radius: 16px; }
.hint { text-align: center; font-size: var(--fs-14); font-weight: 500; color: var(--on-sky-2); margin-top: 14px; text-wrap: pretty; text-shadow: 0 0 2px var(--on-sky-sh), 0 1px 8px var(--on-sky-sh); }

/* ---------- файлы ---------- */
.files { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.file { padding: 14px; display: flex; flex-direction: column; gap: 10px; min-height: 168px; border-radius: 20px; }
.file .ty { position: relative; width: 40px; height: 50px; border-radius: 6px 14px 6px 6px; display: grid; place-items: end center; padding-bottom: 7px; font: 700 var(--fs-11) var(--sans); letter-spacing: .03em; color: #fff; background: var(--fc); box-shadow: 0 10px 20px -12px var(--fc); }
.file .ty::before { content: ""; position: absolute; right: 0; top: 0; width: 14px; height: 14px; border-radius: 0 0 0 5px; background: linear-gradient(225deg, rgba(12,17,36,.9) 50%, rgba(255,255,255,.55) 50%); }
.file .fn { font-weight: 600; font-size: var(--fs-14); line-height: 1.3; overflow-wrap: anywhere; flex: 1; }
.file .ft { font-size: var(--fs-12); color: var(--text-3); font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.file .btn { justify-content: center; }
.ah { margin: 20px 2px 0; display: flex; align-items: baseline; gap: 10px; }
.ah .chip { padding: 0; border: 0; background: none; backdrop-filter: none; -webkit-backdrop-filter: none; font: 600 var(--fs-18)/1.2 var(--serif); color: var(--on-sky); text-shadow: 0 0 2px var(--on-sky-sh), 0 1px 10px var(--on-sky-sh); gap: 8px; overflow: visible; }
.ah .chip svg { width: 17px; height: 17px; opacity: .7; }
.folders { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.folder { border: 0; text-align: left; color: var(--text); padding: 15px 15px 14px; min-height: 140px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; border-radius: 20px; transition: transform .4s var(--spring); }
.folder:active { transform: scale(.95); }
.folder .fi { width: 54px; height: 43px; margin-bottom: auto; filter: drop-shadow(0 10px 14px color-mix(in srgb, var(--fc) 40%, transparent)); }
.folder .fi .bk { fill: color-mix(in srgb, var(--fc) 62%, #000 30%); }
.folder .fi .fr { fill: var(--fc); }
.folder b { font: 600 var(--fs-18)/1.2 var(--serif); margin-top: 12px; overflow-wrap: anywhere; }
.folder span { font-size: var(--fs-12); font-weight: 500; color: var(--text-2); }
.fbtns { display: flex; gap: 6px; } .fbtns .btn { white-space: nowrap; }
.fbtns .btn.pri { flex: 1; min-width: 0; overflow: hidden; justify-content: center; padding-left: 7px; padding-right: 7px; background: color-mix(in srgb, var(--paper) 12%, transparent); color: var(--paper); border-color: color-mix(in srgb, var(--paper) 26%, transparent); box-shadow: none; }
@media (max-width: 380px) { .fbtns .btn.pri svg { display: none; } }
.fpill { border: 0; margin: 0 6px 6px 0; padding: 7px 11px; font-size: var(--fs-12); line-height: 1.3; cursor: pointer; white-space: normal; text-align: left; max-width: 100%; border-radius: 12px; overflow-wrap: anywhere; }
.fbtns .btn.sq { flex: none; width: 42px; justify-content: center; padding: 10px 0; }
.viewer { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: rgba(5,7,15,.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  padding: calc(var(--safe-top) + 12px) 0 calc(14px + var(--safe-bottom)); opacity: 0; pointer-events: none; transition: opacity .3s; }
.viewer.on { opacity: 1; pointer-events: auto; }
.viewer { background: rgba(5,7,15, calc(.95 * var(--vo, 1))); }
.vtop { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 18px 10px; min-height: 28px; }
.vtitle { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 600 var(--fs-16) var(--serif); color: var(--text); }
.vpage { flex: none; padding: 5px 10px; border-radius: 99px; background: var(--stroke-2); font: 600 var(--fs-12)/1 var(--sans); color: var(--text); font-variant-numeric: tabular-nums; }
.vpage:empty { display: none; }
.vbody { flex: 1; min-height: 0; overflow: auto; position: relative; touch-action: pan-x pan-y; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.vbody::-webkit-scrollbar { display: none; }
.vz { position: relative; transform-origin: 0 0; animation: rise .45s var(--spring) both; }
.vz img { position: absolute; display: block; border-radius: 12px; box-shadow: 0 30px 60px -20px #000; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.vz .col { display: flex; flex-direction: column; align-items: flex-start; gap: calc(10px * var(--z, 1)); padding: 4px 0 calc(10px * var(--z, 1)); }
.vz canvas { display: block; flex: none; border-radius: 6px; box-shadow: 0 16px 30px -14px #000; background: #fff; }
.vbody .msg { padding-top: 26vh; }
.vspin { position: absolute; left: 50%; top: 45%; width: 38px; height: 38px; margin: -19px; border-radius: 50%; border: 3px solid rgba(255,255,255,.15); border-top-color: var(--paper); animation: rot .8s linear infinite; display: none; }
.viewer.busy .vspin { display: block; }
@keyframes rot { to { transform: rotate(360deg); } }
.vbar { display: flex; justify-content: center; gap: 10px; padding: 12px 16px 0; } .vbar .btn { padding: 12px 16px; }
.vbar .btn:not(.pri) { background: rgba(255,255,255,.08); }

/* ---------- док ---------- */
nav.dock { position: fixed; left: 12px; right: 12px; bottom: calc(10px + var(--safe-bottom)); z-index: 20; max-width: 520px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px; border-radius: 26px; isolation: isolate;
  background: color-mix(in srgb, var(--bg-2) 70%, transparent); backdrop-filter: blur(30px) saturate(190%); -webkit-backdrop-filter: blur(30px) saturate(190%);
  box-shadow: 0 22px 50px -14px rgba(0,0,0,.7), inset 0 1px 0 var(--edge-hi); }
nav.dock::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; background: linear-gradient(160deg, var(--edge-hi), var(--edge-lo) 40%, rgba(255,255,255,.08));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.dock .ind { position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 5); border-radius: 20px; z-index: -1;
  background: var(--paper); box-shadow: 0 10px 22px -12px rgba(0,0,0,.9);
  transform: translateX(calc(var(--i, 0) * 100%)); }
/* подложка едет пружиной (переливается сама переменная --i), а подпись и значок темнеют тем сильнее, чем ближе к ним подложка:
   пока ведёшь пальцем по меню или листаешь вкладки, тёмный цвет перетекает вместе с ней и не теряется на стекле */
nav.dock { transition: --i .6s var(--spring); }
.nb { --w: clamp(0, 1 - max(var(--i) - var(--k), var(--k) - var(--i)), 1); position: relative; min-width: 0; border: 0; background: none; color: color-mix(in srgb, var(--paper-ink) calc(var(--w) * 100%), var(--text-2)); font-size: var(--fs-11); font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 6px; }
.nb span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nb svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.nb svg { transform: translateY(calc(var(--w) * -1px)) scale(calc(1 + var(--w) * .08)); }
.nb:active svg { transform: scale(.82); }
.nb .dot { position: absolute; top: 2px; left: calc(50% + 5px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--hot); color: #fff; font: 700 var(--fs-11)/18px var(--sans); font-style: normal; text-align: center; box-shadow: 0 0 0 2px var(--bg-2); font-variant-numeric: tabular-nums; }
.nb .dot:empty { display: none; }
/* пока ведёшь пальцем по меню — над подложкой лупа с вкладкой, на которой окажешься, если отпустить */
.dtip { position: fixed; z-index: 22; left: 50%; top: 0; width: 120px; height: 42px; border-radius: 14px; pointer-events: none;
  background: var(--paper); color: var(--paper-ink); box-shadow: 0 14px 30px -10px rgba(0,0,0,.75);
  /* растёт, качается и опускается вокруг своего уголка — точки над подложкой */
  transform-origin: calc(50% + var(--ax, 0px)) calc(100% + 6px);
  translate: -50% -60%; scale: .4; opacity: 0;
  transition: opacity .16s ease-in, scale .2s cubic-bezier(.5,0,.75,0), translate .2s cubic-bezier(.5,0,.75,0), width .34s cubic-bezier(.34,1.3,.64,1); }
.dtip.on { translate: -50% -100%; scale: 1; opacity: 1;
  transition: opacity .14s ease-out, scale .46s cubic-bezier(.34,1.56,.64,1), translate .46s cubic-bezier(.34,1.56,.64,1), width .34s cubic-bezier(.34,1.3,.64,1); }
.dtip.snap { transition: none !important; }
.dtv { position: relative; height: 100%; overflow: hidden; border-radius: inherit; }
.dl { position: absolute; left: 50%; top: 0; height: 100%; translate: -50% 0; display: flex; align-items: center; gap: 7px; padding: 0 15px 0 12px; white-space: nowrap; font: 650 var(--fs-16)/1 var(--sans); }
.dl svg { flex: none; width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dtip::after { content: ""; position: absolute; left: calc(50% + var(--ax, 0px)); bottom: -5px; width: 11px; height: 11px; margin-left: -5.5px; background: inherit; border-radius: 2px; transform: rotate(45deg); }
.nodata nav.dock, .nodata .fab, .nodata .queue { display: none !important; }
body.hasq { padding-bottom: calc(176px + var(--safe-bottom)); }   /* плашка «N изменений» не закрывает конец списка */

/* ---------- кнопка «+», очередь, шторки, тосты ---------- */
.fab { position: fixed; right: 18px; bottom: calc(96px + var(--safe-bottom)); z-index: 19; width: 56px; height: 56px; border: 0; border-radius: 18px; background: var(--paper); display: grid; place-items: center;
  box-shadow: 0 16px 30px -12px rgba(0,0,0,.75), inset 0 -2px 0 rgba(0,0,0,.08); transition: transform .45s var(--spring), bottom .45s var(--spring), opacity .3s; }
.fab.away { transform: translateY(140%) scale(.6); opacity: 0; pointer-events: none; }
.dockdrag .fab { transform: scale(.7); opacity: 0; pointer-events: none; }
.fab svg { width: 24px; height: 24px; stroke: var(--paper-ink); stroke-width: 2.6; stroke-linecap: round; fill: none; transition: transform .45s var(--spring); }
.fab:active { transform: scale(.9); } .fab:active svg { transform: rotate(90deg); }
.queue { position: fixed; left: 50%; bottom: calc(96px + var(--safe-bottom)); z-index: 19; display: flex; align-items: center; gap: 6px; padding: 5px 5px 5px 6px; border-radius: 99px; font-size: var(--fs-14); font-weight: 600;
  background: color-mix(in srgb, var(--bg-2) 82%, transparent); backdrop-filter: blur(26px) saturate(190%); -webkit-backdrop-filter: blur(26px) saturate(190%); border: 1px solid var(--stroke-2); box-shadow: 0 18px 36px -12px rgba(0,0,0,.7);
  transform: translate(-50%, 24px) scale(.9); opacity: 0; pointer-events: none; transition: all .5s var(--spring); white-space: nowrap; max-width: calc(100% - 24px); }
.queue.on { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.queue .n { flex: none; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 15px; background: var(--hot); color: #fff; display: grid; place-items: center; font: 700 var(--fs-14) var(--sans); font-variant-numeric: tabular-nums; }
.queue #qtext { padding: 0 4px; }
@media (max-width: 400px) { .queue.withsend #qtext { display: none; } }   /* вне Telegram на узком экране: «1 · Отменить · Отправить боту» */
.queue button { flex: none; border: 0; border-radius: 99px; padding: 8px 13px; font-weight: 650; font-size: var(--fs-14); }
.queue .u { background: var(--stroke); color: var(--text); }
.queue .s { background: var(--paper); color: var(--paper-ink); }
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(4,6,14,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .35s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-width: 640px; margin: 0 auto; padding: 4px 18px calc(22px + var(--safe-bottom)); border-radius: 28px 28px 0 0; max-height: 88vh; overflow-y: auto; overflow-x: hidden;
  background: color-mix(in srgb, var(--bg-2) 92%, transparent); backdrop-filter: blur(34px) saturate(190%); -webkit-backdrop-filter: blur(34px) saturate(190%);
  box-shadow: 0 -24px 60px -20px rgba(0,0,0,.7), inset 0 1px 0 var(--edge-hi); transform: translateY(105%); transition: transform .55s cubic-bezier(.3,1.2,.5,1); }
.sheet.on { transform: none; }
.sheet .grab { padding: 8px 0 16px; touch-action: none; cursor: grab; }
.sheet .grab::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--stroke-2); margin: 0 auto; }
.sheet h4 { margin: 0 0 6px; font: 600 var(--fs-24)/1.18 var(--serif); letter-spacing: -.015em; overflow-wrap: anywhere; }
.sheet p { margin: 0 0 16px; color: var(--text-2); font-size: var(--fs-14); font-weight: 500; }
.sheet p.tag { font-size: var(--fs-12); color: var(--text-3); }
.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0 6px; }
.quick .btn { justify-content: center; flex-direction: column; gap: 3px; padding: 11px 6px; border-radius: 14px; }
.quick .btn small { font-size: var(--fs-12); color: var(--text-3); font-weight: 500; }
.quick .btn.on { background: var(--paper); color: var(--paper-ink); border-color: transparent; }
.quick .btn.on small { color: var(--paper-ink-2); }
label.f { display: block; font-size: var(--fs-14); font-weight: 600; color: var(--text-2); margin: 14px 2px 7px; }
input, textarea { width: 100%; font: inherit; font-weight: 500; padding: 14px 15px; border-radius: 14px; border: 1px solid var(--stroke-2); background: rgba(255,255,255,.06); color: var(--text); outline: none; transition: border-color .2s, box-shadow .2s; }
input:focus, textarea:focus { border-color: var(--accent-2); box-shadow: 0 0 0 4px rgba(147,208,255,.16); }
textarea { min-height: 92px; resize: vertical; font-size: var(--fs-16); }
input[type="date"], input[type="time"] { min-height: 50px; -webkit-appearance: none; appearance: none; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 15px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid var(--stroke-2); margin-top: 14px; font-weight: 600; cursor: pointer; }
.toggle small { display: block; color: var(--text-3); font-weight: 500; font-size: var(--fs-12); margin-top: 2px; }
.sw { width: 52px; height: 32px; border-radius: 16px; background: var(--stroke-2); position: relative; transition: background .25s; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .4s var(--spring); box-shadow: 0 3px 8px rgba(0,0,0,.3); }
.sw.on { background: var(--hot); } .sw.on::after { transform: translateX(20px); }
.sheet .go { width: 100%; justify-content: center; padding: 16px; font-size: var(--fs-16); margin-top: 18px; border-radius: 16px; }
.toast { position: fixed; left: 50%; top: calc(var(--safe-top) + 12px); z-index: 40; transform: translate(-50%, -170%) scale(.9); padding: 11px 18px; border-radius: 99px; max-width: calc(100% - 28px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: var(--fs-14); color: var(--text);
  background: color-mix(in srgb, var(--bg-2) 88%, transparent); backdrop-filter: blur(26px) saturate(190%); -webkit-backdrop-filter: blur(26px) saturate(190%); border: 1px solid var(--stroke-2); box-shadow: 0 18px 36px -12px rgba(0,0,0,.7); transition: transform .55s var(--spring); }
.toast.on { transform: translate(-50%, 0); }
.cf { position: fixed; z-index: 45; width: 7px; height: 11px; border-radius: 2px; pointer-events: none; }
/* экран ошибки: что случилось и что сделать */
.msg { padding: 36px 24px 30px; text-align: center; color: var(--text-2); font-weight: 500; font-size: var(--fs-16); }
.msg b { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; font-size: var(--fs-24); background: var(--stroke); box-shadow: inset 0 0 0 1px var(--stroke-2); }
.msg h2 { margin: 0 0 8px; font: 600 var(--fs-24)/1.2 var(--serif); color: var(--text); }
.msg p { margin: 0 auto; max-width: 24em; text-wrap: pretty; }
.msg .btn { margin-top: 20px; padding: 13px 20px; text-decoration: none; }
.foot { text-align: center; margin: 26px 0 0; }
.foot span { display: inline-block; padding: 6px 12px; border-radius: 99px; font-size: var(--fs-12); font-weight: 500; color: var(--text-2); background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font-variant-numeric: tabular-nums; }

/* ---------- чаты: цитата дня и сводка ---------- */
/* цитата дня — вырезка на бумаге */
.quote { position: relative; isolation: isolate; overflow: hidden; margin: 6px 12px 6px; padding: 16px 18px 15px 18px; border-radius: 10px; color: var(--paper-ink);
  background: var(--paper); box-shadow: 0 14px 28px -16px rgba(0,0,0,.8); }
.quote .qm { position: absolute; right: 12px; top: -14px; z-index: -1; font: italic 600 var(--fs-72)/1 var(--serif); color: color-mix(in srgb, var(--paper-ink) 9%, var(--paper)); }
.quote .ql { font-size: var(--fs-12); font-weight: 650; color: #b4466f; }
.quote .qt { margin-top: 6px; font: italic 500 var(--fs-18)/1.38 var(--serif); overflow-wrap: anywhere; text-wrap: pretty; }
.quote .qa { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.av { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 600 var(--fs-16) var(--serif); color: #fff; background: var(--c); }
.quote .av { color: var(--paper-ink); }
.qa b { display: block; font-size: var(--fs-14); font-weight: 650; }
.qa small { display: block; font-size: var(--fs-12); font-weight: 500; color: var(--paper-ink-2); margin-top: 1px; }
.dg { padding: 12px 18px 13px; }
.dg b { display: flex; align-items: center; gap: 8px; font-size: var(--fs-14); font-weight: 650; }
.dg b::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.dg p { margin: 5px 0 0 16px; font-size: var(--fs-14); line-height: 1.5; font-weight: 450; color: var(--text-2); }
.dpages { display: flex; align-items: flex-start; transition: height .4s var(--ease); overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.dpages::-webkit-scrollbar { display: none; }
.dpages .dg { flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; }
.ddots { display: flex; justify-content: center; flex-wrap: wrap; gap: 0; padding: 0 12px 6px; }
.ddots button { width: 32px; height: 32px; padding: 0; border: 0; background: none; display: grid; place-items: center; }   /* точка маленькая, нажимается вся клетка 32×32 */
.ddots button::before { content: ""; width: 7px; height: 7px; border-radius: 4px; background: var(--stroke-2); transition: width .35s var(--spring), background .3s; }
.ddots button.on::before { width: 22px; background: var(--c); }
/* ---------- иконки вместо эмодзи (кроме главной) ---------- */
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.btn:disabled { opacity: .45; }
.chip svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; flex: none; }
/* ---------- карточки: экран колоды, режимы, итоги ---------- */
.dsc { padding: 18px; margin-top: 14px; }
.dtop { display: flex; align-items: center; gap: 16px; }
.dsc .ring { flex: none; }
.dnum { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.dnum b { display: block; font: 600 var(--fs-24)/1 var(--serif); font-variant-numeric: tabular-nums lining-nums; }
.dnum b small { font-size: var(--fs-14); color: var(--text-3); }
.dnum span { display: block; font-size: var(--fs-12); font-weight: 550; color: var(--text-3); margin-top: 6px; line-height: 1.25; }
.btn.big { width: 100%; justify-content: center; padding: 16px; font-size: var(--fs-16); border-radius: 16px; margin-top: 18px; }
.dnote { text-align: center; color: var(--text-2); font-weight: 500; font-size: var(--fs-14); margin: 10px 0 0; }
.modes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 10px; }
.mode { border: 0; text-align: left; color: var(--text); padding: 15px; border-radius: 20px; display: flex; flex-direction: column; gap: 6px; transition: transform .4s var(--spring); }
.mode:active { transform: scale(.96); }
.mode svg { width: 24px; height: 24px; stroke: var(--dc); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; margin-bottom: 6px; }
.mode b { font: 600 var(--fs-16)/1.2 var(--serif); }
.mode span { font-size: var(--fs-12); font-weight: 500; color: var(--text-2); line-height: 1.38; }
.dirsw { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 10px; padding: 4px; border-radius: 99px; background: var(--glass); border: 1px solid var(--stroke-2); backdrop-filter: blur(16px) saturate(170%); -webkit-backdrop-filter: blur(16px) saturate(170%); }
.dirsw button { position: relative; z-index: 1; border: 0; background: transparent; color: var(--text-2); font-size: var(--fs-14); font-weight: 600; padding: 9px 4px; border-radius: 99px; white-space: nowrap; transition: color .3s var(--ease); }
.dirsw button.on { color: var(--paper-ink); }
.dirsw .dsi { position: absolute; left: 0; top: 4px; border-radius: 99px; background: var(--paper); box-shadow: 0 10px 22px -12px rgba(0,0,0,.8); pointer-events: none; z-index: 0; }
.res .rt { font: 600 var(--fs-21)/1.2 var(--serif); }
.btn.unitgo { width: 100%; justify-content: center; padding: 13px; font-size: var(--fs-16); border-radius: 16px; margin: 12px 0 0; }
.res .rs { color: var(--text-2); font-weight: 500; font-size: var(--fs-14); margin-top: 5px; line-height: 1.4; }
.res .big { font-size: var(--fs-48); line-height: 1; }
.miss { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.miss div { padding: 10px 12px; border-radius: 12px; background: var(--stroke); font-size: var(--fs-14); }
.miss span { display: block; color: var(--text-2); font-weight: 500; }
.miss b { display: block; margin-top: 3px; font-weight: 650; }
.cardbar.sub { margin-top: 10px; } .cardbar.sub .btn { padding: 11px; font-size: var(--fs-14); }
.cardbar .btn:not(.pri) { background: var(--glass); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%); }

const TABS = [["today", "Сегодня"], ["cal", "Календарь"], ["tasks", "Задачи"], ["cards", "Карточки"], ["files", "Файлы"]];
const WD = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];

let D = null, tab = ({ week: "cal", sched: "cal" })[QS.get("tab")] || QS.get("tab") || "today", prevTab = null;
let selDay = null, calWeek = 0, filter = "all", deck = null, study = null, openTask = null;
let ffold = null, cfold = null; // открытая папка предмета во вкладках «Файлы» и «Карточки»

const store = {

  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },

let ops = store.get("ops", []);
// отправленные боту изменения: показываем их, пока бот их не применит (он разбирает их раз в час) — иначе после отправки задача «возвращалась»
let sent = store.get("sent", []);
// "tick" — переход на соседнюю вкладку при ведении по меню: на iPhone — чёткий щелчок выбора; на Android щелчок выбора

const haptic = (t = "light") => { if (NATIVE) { try { NATIVE.haptic(t); } catch (e) {} return; } try { if (t === "tick") t = tg.platform === "android" ? "medium" : "sel"; t === "sel" ? tg.HapticFeedback.selectionChanged() : t === "ok" || t === "error" ? tg.HapticFeedback.notificationOccurred(t === "ok" ? "success" : "error") : tg.HapticFeedback.impactOccurred(t); } catch (e) {} };

// ---------- время (Москва) ----------
const msk = () => new Date(Date.now() + (new Date().getTimezoneOffset() + 180) * 60000);
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const P = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const add = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => iso(msk());
const ddmm = s => s.slice(8, 10) + "." + s.slice(5, 7);
const nice = s => { const d = P(s); return d.getDate() + " " + MON[d.getMonth()]; };
const short = s => { const d = P(s); return WD[d.getDay()].toLowerCase() + ", " + d.getDate() + " " + MS[d.getMonth()]; };
const diff = s => Math.round((P(s) - P(today())) / 864e5);
const relTxt = s => { const n = diff(s); return n === 0 ? "сегодня" : n === 1 ? "завтра" : n === 2 ? "послезавтра" : n < 0 ? "прошло" : n <= 7 ? "через " + n + " " + pl(n, "день", "дня", "дней") : nice(s); };
const mins = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const hhmm = m => String(Math.floor(m / 60) % 24).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const hueOf = s => { let h = 11; for (const ch of String(s)) h = (h * 33 + ch.charCodeAt(0)) % 360; return h; };
const colOf = l => l.vuc ? "#ffad4d" : `hsl(${hueOf(l.n)} 85% 66%)`;

// ---------- данные ----------
let KEY = null; // ключ планера: им же расшифровываются файлы
let dataTxt = null, fetchedAt = 0, offline = false, pendingD = null;
async function getKey() {
  if (KEY) return KEY;
  const k = QS.get("k");
  if (!k) throw new Error("Открой планер кнопкой «📅 Планер» в чате с ботом.");
  const raw = Uint8Array.from(atob(k.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((k.length + 3) % 4)), c => c.charCodeAt(0));
  return KEY = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);

  const enc = JSON.parse(txt), b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function fetchData() {
  const res = await fetch("data.enc?t=" + Date.now(), { cache: "no-store" });

  const txt = await res.text();

  try { localStorage.setItem("dataEnc", txt); } catch (e) {}

}
function reopenFile() {
  const lv = store.get("lastView", null), f = lv && Date.now() - lv.at < 30 * 60e3 && fileBy(lv.path);
  if (!f || !viewable(f)) { try { localStorage.removeItem("lastView"); } catch (e) {} return; }
  if (!QS.get("tab") && lv.tab && lv.tab !== tab) { tab = lv.tab; ffold = lv.ffold || null; render(); }
  viewFile(f, { page: lv.page || 0 });

function showData(d, txt) {
  dataTxt = txt;

  else { pendingD = d; applyPending(); }
}
// свежие данные не перебивают то, чем ты занят: учишь карточки, смотришь файл, открыта шторка — применим, когда освободишься
function applyPending() {
  clearTimeout(applyPending.t);

  if (study || G || $("viewer").classList.contains("on") || $("sheet").classList.contains("on") || Date.now() < busyTill) { applyPending.t = setTimeout(applyPending, 1500); return; }

}
// при возвращении в mini и раз в 10 минут: нет ли нового от бота (и новой версии mini)
async function refreshData(force) {
  if (!D || (!force && Date.now() - fetchedAt < 90e3)) return;
  checkVersion(() => !study && !G && !ops.length && !$("viewer").classList.contains("on") && !$("sheet").classList.contains("on"));

    const txt = await fetchData();

  } catch (e) { offline = true; }
}
function tasks() {
  const L = D.tasks.map(t => ({ ...t }));

  const apply = (o, pend) => {
    const t = L.find(x => x.id === o.id);
    if (o.op === "add") L.push({ id: "n" + o.n, text: o.text, date: o.date, time: o.time, imp: !!o.imp, files: [], src: "из планера", pend });
    else if (!t) return;
    else if (o.op === "done") { t.done = true; t.pend = pend; }
    else if (o.op === "tmr" && t.date) { t.date = iso(add(P(t.date), 1)); t.pend = pend; }
    else if (o.op === "move") { t.date = o.date; if (o.time) t.time = o.time; t.pend = pend; }
    else if (o.op === "imp") { t.imp = o.value; t.pend = pend; }
  };
  for (const o of sent) apply(o, "s");
  for (const o of ops) apply(o, "q");

}
function pruneSent() {
  const now = Date.now(), gen = Date.parse(D.generated) || 0, norm = x => String(x || "").replace(/\s+/g, " ").trim().toLowerCase();
  sent = sent.filter(o => {
    if (now - o.at > 6 * 36e5 || gen > o.at + 70 * 6e4) return false;
    const t = D.tasks.find(x => x.id === o.id);
    if (o.op === "done") return !!t;                                   // бот удаляет сделанную задачу
    if (o.op === "add") return !D.tasks.some(x => norm(x.text) === norm(o.text));
    if (!t) return false;
    if (o.op === "tmr") return t.date === o.from;                      // срок ещё прежний
    if (o.op === "move") return t.date !== o.date || (!!o.time && t.time !== o.time);
    if (o.op === "imp") return !!t.imp !== !!o.value;

  });

}
function lessons(ds) {
  const S = D.schedule;

}
const SRS = {

  st(d, c) { return this.get(d).c[h32(c[0])]; }, // [коробка, день показа, повторений, забываний]

    if (c && c.t > l.t) { SRS.mem[id] = c; store.set("srs:" + id, c); changed = true; }

// русская сторона первой (английские подсказки в скобках убираем), ответ — английская
