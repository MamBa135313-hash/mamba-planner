<!doctype html>
<html lang="ru" class="noanim">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="app-v" content="202610041856">
<title>Планер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07080f; --bg-2: #0e1124; --glass: rgba(14,16,34,.56); --glass-hi: rgba(255,255,255,.08);
  --stroke: rgba(255,255,255,.08); --stroke-2: rgba(255,255,255,.16);
  --text: #f2f3ff; --text-2: #b3b8d6; --text-3: #7b81a1;
  --accent: #8b7bff; --accent-2: #45dcff; --accent-3: #ff5fa2;
  --ok: #38e6a6; --warn: #ffb547; --hot: #ff5d6c;
  --grad: linear-gradient(135deg, #8b7bff 0%, #45dcff 100%);
  --grad-hot: linear-gradient(135deg, #ff5fa2 0%, #ff7a5b 100%);
  --grad-ok: linear-gradient(135deg, #38e6a6 0%, #45dcff 100%);
  --grad-sun: linear-gradient(135deg, #ffd25c 0%, #ff8a5b 100%);
  --disp: Unbounded, Manrope, system-ui, sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1); --spring: cubic-bezier(.34,1.5,.6,1);
  --safe-top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
  --edge-hi: rgba(255,255,255,.28); --edge-lo: rgba(255,255,255,.04);
  --shadow: 0 24px 48px -18px rgba(0,0,0,.6);
  color-scheme: dark;
}
:root.light {
  --bg: #eef0fa; --bg-2: #f7f8fd; --glass: rgba(255,255,255,.64); --glass-hi: rgba(255,255,255,.55);
  --stroke: rgba(20,24,60,.07); --stroke-2: rgba(20,24,60,.13);
  --text: #11132a; --text-2: #4b5172; --text-3: #858aa8;
  --accent: #6b5bff; --accent-2: #129fd0;
  --edge-hi: rgba(255,255,255,.95); --edge-lo: rgba(255,255,255,.3);
  --shadow: 0 24px 48px -22px rgba(30,40,110,.35);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  font: 500 15px/1.45 Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--text); background: var(--bg); overflow-x: hidden; -webkit-font-smoothing: antialiased;
  padding-top: var(--safe-top); padding-bottom: calc(128px + env(safe-area-inset-bottom));
}
button { font: inherit; color: inherit; cursor: pointer; }
/* всё, что въезжает сбоку (анимации, свайпы), обрезаем по краю экрана: иначе страница на миг
   становится шире, Telegram перестраивает окно и нижняя панель уезжает вниз */
.wrap { overflow-x: hidden; overflow-x: clip; }
button:disabled { cursor: default; }

/* ---------- сцена: небо Москвы ---------- */
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
#scene { position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none; }
#scene .g { position: absolute; inset: 0; transition: background 2.5s ease; }
#scene .haze { position: absolute; inset: 0; transition: background 2.5s ease, opacity 2.5s; }
.sun { position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; transition: left 3s ease, top 3s ease, opacity 2.5s, transform 3s, filter 2.5s;
  background: radial-gradient(circle, #fffef4 0%, #fff1b8 38%, #ffcf5c 62%, rgba(255,190,70,0) 71%);
  box-shadow: 0 0 70px 26px rgba(255,214,120,.42), 0 0 220px 90px rgba(255,190,90,.22); }
.sun.low { background: radial-gradient(circle, #fff3d6 0%, #ffb36b 40%, #ff7a3d 62%, rgba(255,110,60,0) 71%); box-shadow: 0 0 90px 36px rgba(255,140,80,.5), 0 0 260px 120px rgba(255,100,70,.28); transform: scale(1.25); }
.moon { position: absolute; width: 66px; height: 66px; margin: -33px 0 0 -33px; overflow: visible; transition: left 3s, top 3s, opacity 2.5s; }
/* свечение — только от освещённой части; ярче к полнолунию */
.moon .lit { filter: drop-shadow(0 0 calc(3px + 5px * var(--mk, 1)) rgba(245,246,255,.65)) drop-shadow(0 0 calc(10px + 26px * var(--mk, 1)) rgba(170,190,255,.4)); }
.moon .ash { fill: #8d9cc4; opacity: .07; }
.skyline { position: absolute; left: 0; bottom: 0; width: 100%; height: 26vh; min-height: 150px; transition: opacity 2s; }
.skyline .b { transition: fill 2.5s; }
.skyline .w { fill: #ffd77a; transition: opacity 2.5s; }
.sun, .moon { opacity: 0; }
.noanim #scene *, .noanim #scene { transition: none !important; }
.flash { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: #dfe6ff; opacity: 0; }
.flash.on { animation: flash .9s ease-out; }
@keyframes flash { 0% { opacity: 0 } 8% { opacity: .35 } 16% { opacity: .05 } 26% { opacity: .28 } 100% { opacity: 0 } }
/* плёночное зерно и мягкое затемнение снизу — чтобы стекло читалось на любом небе */
.grain { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .08; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.vig { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(180deg, transparent 55%, rgba(4,6,16,.28) 100%); }
.light .vig { background: linear-gradient(180deg, transparent 60%, rgba(255,255,255,.18) 100%); }

/* ---------- шапка поверх неба ---------- */
.hud { max-width: 640px; margin: 0 auto; padding: 16px 20px 6px; color: var(--on-sky, var(--text)); transition: color 1.5s; will-change: transform, opacity; }
.hud .row { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.hud .row > div:first-child { min-width: 0; }
.greet { font-weight: 700; font-size: 14px; opacity: .88; text-shadow: 0 1px 12px var(--on-sky-sh, transparent); }
.clock { white-space: nowrap; font: 600 64px/.92 var(--disp); letter-spacing: -.06em; margin: 8px 0 0 -3px; font-variant-numeric: tabular-nums; text-shadow: 0 6px 34px var(--on-sky-sh, transparent); }
.clock i { font-style: normal; display: inline-block; animation: tick 2s ease-in-out infinite; margin: 0 -.02em; }
@keyframes tick { 50% { opacity: .35 } }
.date { font-weight: 800; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--on-sky-2, var(--text-2)); margin-top: 10px; text-shadow: 0 1px 10px var(--on-sky-sh, transparent); }
.wx { flex: none; max-width: 46%; text-align: right; padding-bottom: 4px; text-shadow: 0 2px 16px var(--on-sky-sh, transparent); }
.wx .temp { font: 500 46px/1 var(--disp); letter-spacing: -.05em; }
.wx .cond { font-weight: 800; font-size: 13px; margin-top: 8px; }
.wx .feel { font-size: 11.5px; font-weight: 700; color: var(--on-sky-2, var(--text-2)); margin-top: 3px; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--on-sky-2, var(--text-3)); text-shadow: 0 1px 8px var(--on-sky-sh, transparent); }
.title { margin: 6px 0 0 -2px; font: 600 36px/1.02 var(--disp); letter-spacing: -.05em; text-shadow: 0 4px 26px var(--on-sky-sh, transparent); overflow-wrap: anywhere; }
.brief { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
#chatcard { scroll-margin-top: calc(var(--safe-top) + 60px); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 99px; font-size: 12.5px; font-weight: 800; color: var(--text); white-space: nowrap;
  background: var(--glass); border: 1px solid var(--stroke-2); backdrop-filter: blur(16px) saturate(170%); -webkit-backdrop-filter: blur(16px) saturate(170%); text-shadow: none; }
.topbar { position: fixed; left: 0; right: 0; top: 0; z-index: 25; padding: calc(var(--safe-top) + 12px) 20px 12px; text-align: center; font: 600 15px/1.2 var(--disp); letter-spacing: -.02em;
  background: color-mix(in srgb, var(--bg-2) 62%, transparent); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-bottom: 1px solid var(--stroke); transform: translateY(-101%); transition: transform .45s var(--ease); }
.topbar.on { transform: none; }

/* ---------- стекло ---------- */
main { max-width: 640px; margin: 0 auto; padding: 6px 14px 0; }
.glass { position: relative; isolation: isolate; border-radius: 26px;
  background: linear-gradient(165deg, var(--glass-hi), transparent 42%), var(--glass);
  backdrop-filter: blur(26px) saturate(180%); -webkit-backdrop-filter: blur(26px) saturate(180%);
  box-shadow: var(--shadow), inset 0 1px 0 var(--edge-hi); }
.glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(160deg, var(--edge-hi), var(--edge-lo) 32%, var(--edge-lo) 68%, rgba(255,255,255,.14));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.card { margin-top: 14px; overflow: hidden; }
.ch { display: flex; align-items: center; justify-content: space-between; padding: 15px 18px 4px; }
.ch h3 { margin: 0; display: flex; align-items: center; gap: 9px; font: 600 11.5px/1 var(--disp); letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
.ch h3 i { width: 7px; height: 7px; border-radius: 50%; background: var(--dotc, var(--grad)); box-shadow: 0 0 10px var(--accent); }
.ch span { font-size: 12px; font-weight: 800; color: var(--text-3); }
.empty { padding: 26px 18px 28px; text-align: center; color: var(--text-3); font-weight: 700; }
.empty b { display: block; font-size: 34px; margin-bottom: 8px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.25)); }
.sk { height: 140px; margin-top: 14px; overflow: hidden; }
.sk::before { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.09) 50%, transparent 70%); transform: translateX(-100%); animation: shim 1.4s infinite; }
@keyframes shim { to { transform: translateX(100%); } }

/* ---------- фокус: что сейчас ---------- */
.focus { margin-top: 8px; overflow: hidden; }
.fpages { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.fpages::-webkit-scrollbar { display: none; }
.fp { position: relative; isolation: isolate; overflow: hidden; flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; padding: 18px 18px 14px; display: flex; flex-direction: column; justify-content: center; }
.fp::before { content: ""; position: absolute; right: -25%; top: -60%; width: 75%; aspect-ratio: 1; border-radius: 50%; z-index: -1;
  background: radial-gradient(circle, var(--fc) 0%, transparent 65%); opacity: .32; animation: breathe 6s ease-in-out infinite alternate; }
@keyframes breathe { to { transform: translate(-10%, 8%) scale(1.15); opacity: .45; } }
.fsw { display: flex; justify-content: center; gap: 4px; padding: 0 0 12px; }
.fsw button { border: 0; background: none; padding: 5px 12px; border-radius: 99px; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); transition: all .3s var(--ease); }
.fsw button.on { background: var(--stroke-2); color: var(--text); }
.fx { display: grid; grid-template-columns: 78px 1fr; gap: 16px; align-items: center; }
.ring { position: relative; width: 78px; height: 78px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring circle { fill: none; stroke-width: 7; stroke-linecap: round; }
.ring .bg { stroke: var(--stroke-2); }
.ring .fg { stroke: var(--fc); filter: drop-shadow(0 0 6px var(--fc)); transition: stroke-dashoffset 1.2s var(--ease); }
.ring .lb { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .lb b { font: 600 21px/1 var(--disp); letter-spacing: -.04em; }
.ring .lb small { font-size: 9.5px; font-weight: 800; color: var(--text-3); text-transform: uppercase; letter-spacing: .1em; margin-top: 4px; }
.flab { display: inline-flex; align-items: center; gap: 7px; font-size: 10.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--fc); }
.flab.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: ping 1.6s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 currentColor; } 100% { box-shadow: 0 0 0 9px transparent; } }
.ftitle { font: 600 19px/1.2 var(--disp); letter-spacing: -.035em; margin-top: 7px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ftitle.long { font: 800 16px/1.3 Manrope, sans-serif; letter-spacing: 0; }
.fmeta { font-size: 12.5px; color: var(--text-2); margin-top: 5px; font-weight: 700; }
.ribbon { margin-top: 18px; padding: 0 4px; }
.track { position: relative; height: 10px; border-radius: 99px; background: var(--stroke); }
.track .sg { position: absolute; top: 0; bottom: 0; border-radius: 99px; background: var(--c); opacity: .6; }
.track .sg.past { opacity: .22; }
.track .sg.cur { opacity: 1; box-shadow: 0 0 16px var(--c); }
.needle { position: absolute; top: -7px; bottom: -7px; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--text); box-shadow: 0 0 10px var(--text); }
.needle::before { content: ""; position: absolute; top: -5px; left: 50%; width: 9px; height: 9px; margin-left: -4.5px; border-radius: 50%; background: var(--text); }
.ticks { position: relative; height: 14px; margin-top: 8px; font-size: 10.5px; font-weight: 800; color: var(--text-3); font-variant-numeric: tabular-nums; }
.ticks span { position: absolute; transform: translateX(-50%); }

/* ---------- лента дедлайнов ---------- */
.lnk { border: 0; background: none; padding: 0; font-size: 12px; font-weight: 800; color: var(--accent-2); }
.tkts { display: flex; gap: 10px; overflow-x: auto; padding: 10px 14px 16px; scroll-snap-type: x proximity; scroll-padding: 0 14px; scrollbar-width: none; overscroll-behavior-x: contain; }
.tkts::-webkit-scrollbar { display: none; }
.tkt { position: relative; isolation: isolate; overflow: hidden; flex: 0 0 150px; height: 176px; scroll-snap-align: start; border: 0; border-radius: 22px; padding: 13px 13px 12px; text-align: left; color: var(--text); display: flex; flex-direction: column;
  background: linear-gradient(160deg, color-mix(in srgb, var(--uc) 28%, transparent), color-mix(in srgb, var(--uc) 6%, transparent) 75%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.16), inset 0 0 0 1px color-mix(in srgb, var(--uc) 32%, transparent), 0 14px 26px -16px var(--uc); transition: transform .4s var(--spring); }
.tkt:active { transform: scale(.94); }
/* ближайший дедлайн уже крупно наверху (страница «Дедлайны») — в ленте он плавно схлопывается, а при «Парах» так же плавно возвращается */
.tkt.lead { transition: transform .4s var(--spring), flex-basis .5s var(--ease), padding .5s var(--ease), margin .5s var(--ease), opacity .3s ease, box-shadow .3s; }
.fdl .tkt.lead { flex-basis: 0; padding-left: 0; padding-right: 0; margin-right: -10px; opacity: 0; transform: scale(.8); box-shadow: none; pointer-events: none; }
.tkt.solo { display: none; flex-basis: 100%; } .fdl .tkt.solo { display: flex; height: auto; padding: 18px; }
.tkt::before { content: ""; position: absolute; left: -34px; top: -34px; width: 120px; height: 120px; border-radius: 50%; z-index: -1; background: radial-gradient(circle, var(--uc), transparent 70%); opacity: .38; }
.tkt .tr { position: relative; width: 46px; height: 46px; flex: none; }
.tkt .tr svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.tkt .tr circle { fill: none; stroke-width: 5; stroke-linecap: round; }
.tkt .tr .bg { stroke: var(--stroke-2); }
.tkt .tr .fg { stroke: var(--uc); filter: drop-shadow(0 0 4px var(--uc)); }
.tkt .tr b { position: absolute; inset: 0; display: grid; place-items: center; font: 600 16px/1 var(--disp); letter-spacing: -.04em; }
.tkt .tu { position: absolute; left: 68px; top: 17px; font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--uc); line-height: 1.25; }
.tkt .tu small { display: block; font-size: 10.5px; letter-spacing: 0; text-transform: none; color: var(--text-2); }
.tkt .ti { position: absolute; right: 11px; top: 11px; font-style: normal; font-size: 13px; }
.tkt .pd { position: absolute; right: 13px; bottom: 15px; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.tkt .tx { margin-top: 12px; font-size: 13.5px; font-weight: 800; line-height: 1.32; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tkt .tf { margin-top: auto; padding-top: 8px; font-size: 11px; font-weight: 800; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 10px; }
.tkt.all { flex-basis: 100px; align-items: center; justify-content: center; text-align: center; font-size: 12.5px; font-weight: 800; color: var(--text-2); background: var(--stroke); box-shadow: inset 0 0 0 1px var(--stroke-2); }
.tkt.all::before { display: none; }
.tkt.all b { display: block; font: 600 26px/1.1 var(--disp); color: var(--text); margin-bottom: 4px; }
.tsh .cd { display: flex; align-items: baseline; gap: 10px; margin: 2px 0 10px; }
.tsh .cd b { font: 600 34px/1 var(--disp); letter-spacing: -.05em; color: var(--uc); text-shadow: 0 0 22px color-mix(in srgb, var(--uc) 50%, transparent); }
.tsh .cd span { font-size: 13px; font-weight: 800; color: var(--text-2); text-transform: uppercase; letter-spacing: .08em; }
.tsh h4.long { font: 800 18px/1.35 Manrope, sans-serif; letter-spacing: 0; }
.tsh .tm { margin-top: 10px; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
.acts .btn { justify-content: center; padding: 14px 10px; border-radius: 16px; }

/* ---------- пары ---------- */
.tl { padding: 4px 0 8px; }
.ls { position: relative; display: grid; grid-template-columns: 50px 24px 1fr; padding: 0 16px 0 12px; }
.ls .t { padding: 13px 0 0; text-align: right; font: 600 14px/1 var(--disp); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.ls .t small { display: block; font: 800 11px/1 Manrope, sans-serif; color: var(--text-3); margin-top: 5px; letter-spacing: 0; }
.ls .rail { position: relative; }
.ls .rail::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--stroke-2); }
.ls:first-child .rail::before { top: 18px; }
.ls:last-child .rail::before { bottom: auto; height: 18px; }
.ls:only-child .rail::before { display: none; }
.ls .rail i { position: absolute; left: 50%; top: 12px; width: 13px; height: 13px; margin-left: -6.5px; border-radius: 50%; background: var(--bg-2); border: 3px solid var(--c); }
.ls.past .rail i { background: var(--c); }
.ls.cur .rail i { background: var(--c); box-shadow: 0 0 0 5px color-mix(in srgb, var(--c) 28%, transparent), 0 0 20px var(--c); }
.ls.cur::before { content: ""; position: absolute; inset: 3px 8px; border-radius: 18px; z-index: -1; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 22%, transparent), transparent 85%); }
.ls .b { padding: 9px 0 13px 6px; min-width: 0; }
.ls .n { font-weight: 800; font-size: 15px; line-height: 1.3; }
.ls .m { font-size: 12.5px; color: var(--text-2); margin-top: 3px; font-weight: 600; }
.ls.past { opacity: .5; }
.hw { margin-top: 8px; padding: 8px 11px; border-radius: 13px; font-size: 13px; font-weight: 700; background: color-mix(in srgb, var(--c) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c) 32%, transparent); }

/* ---------- пилюли и кнопки ---------- */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 99px; background: var(--stroke); color: var(--text-2); white-space: nowrap; }
.pill.live { background: var(--c, var(--accent)); color: #fff; padding: 2px 8px; vertical-align: 2px; box-shadow: 0 0 12px var(--c, var(--accent)); }
.pill.hot { background: rgba(255,93,108,.16); color: var(--hot); }
.pill.ok { background: rgba(56,230,166,.15); color: var(--ok); }
.pill.acc { background: rgba(139,123,255,.18); color: #c0b6ff; }
.light .pill.acc { color: #5b4bf0; } .light .pill.ok { color: #0f9d6a; }
.btn { border: 1px solid var(--stroke-2); background: var(--stroke); color: var(--text); font-size: 13px; font-weight: 800; padding: 10px 13px; border-radius: 14px; display: inline-flex; align-items: center; gap: 6px; transition: transform .3s var(--spring); }
.btn:active { transform: scale(.95); }
.btn.pri { background: var(--grad); border-color: transparent; color: #fff; box-shadow: 0 10px 24px -8px rgba(139,123,255,.8), inset 0 1px 0 rgba(255,255,255,.35); }
.btn.ghost { background: transparent; }

/* ---------- задачи ---------- */
.task { position: relative; }
.task + .task::before { content: ""; position: absolute; left: 60px; right: 18px; top: 0; height: 1px; background: var(--stroke); z-index: 1; }
.tk { position: relative; display: grid; grid-template-columns: 30px 1fr auto; gap: 13px; align-items: start; padding: 14px 16px 14px 16px; touch-action: pan-y; transition: transform .5s var(--spring); }
.rev { position: absolute; top: 7px; bottom: 7px; width: 0; border-radius: 18px; display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap; font-size: 12.5px; font-weight: 800; transition: width .5s var(--spring); }
.rev span { transition: transform .3s var(--spring); }
.task.drag .rev { transition: none; }
.task.arm .rev span { transform: scale(1.2); }
.rev.l { left: 8px; background: var(--grad-ok); color: #032a1c; }
.rev.r { right: 8px; background: var(--grad-sun); color: #2c1400; }
.chk { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--stroke-2); background: transparent; display: grid; place-items: center; padding: 0; margin-top: 1px; transition: all .35s var(--spring); }
.chk svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .4s var(--ease) .08s; }
.chk:not(:disabled):active { transform: scale(.85); }
.task.done .chk, .chk.pop { background: var(--grad-ok); border-color: transparent; transform: scale(1.1); box-shadow: 0 8px 18px -6px rgba(56,230,166,.8); }
.task.done .chk svg, .chk.pop svg { stroke-dashoffset: 0; }
.tb { min-width: 0; }
.tt { font-weight: 700; line-height: 1.38; overflow-wrap: anywhere; }
.task.done .tt { text-decoration: line-through; color: var(--text-3); }
.tm { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.src { font-size: 12px; color: var(--text-3); margin-top: 6px; font-weight: 600; }
.more { display: none; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.task.open .more { display: flex; animation: rise .35s var(--ease) both; }
.due { min-width: 48px; text-align: center; padding: 7px 6px 6px; border-radius: 15px; background: var(--stroke); color: var(--text-2); }
.due b { display: block; font: 600 19px/1 var(--disp); letter-spacing: -.04em; }
.due b.s { font-size: 13px; letter-spacing: -.02em; padding: 3px 0 2px; }
.due small { display: block; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; margin-top: 4px; }
.due.hot { background: var(--grad-hot); color: #fff; box-shadow: 0 10px 20px -8px rgba(255,93,108,.8); }
.due.warn { background: rgba(255,181,71,.18); color: var(--warn); }
.due.soon { background: rgba(139,123,255,.16); color: #c0b6ff; }
.light .due.soon { color: #5b4bf0; } .light .due.warn { color: #b06d00; }
.task.done .due { opacity: .4; }

/* ---------- дни, фильтры ---------- */
.days { display: flex; gap: 8px; overflow-x: auto; margin: 0 -14px; padding: 6px 14px 12px; scrollbar-width: none; scroll-snap-type: x proximity; scroll-padding: 0 14px; }
.days::-webkit-scrollbar { display: none; }
.day { flex: 0 0 auto; width: 56px; padding: 11px 0 10px; border: 0; border-radius: 22px; text-align: center; color: var(--text); scroll-snap-align: start; transition: transform .4s var(--spring), box-shadow .3s; }
.day .w { font-size: 10.5px; font-weight: 800; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; }
.day .d { font: 600 21px/1 var(--disp); letter-spacing: -.04em; margin-top: 7px; }
.day .ld { display: flex; justify-content: center; align-items: flex-end; gap: 2px; height: 12px; margin-top: 8px; }
.day .ld i { width: 4px; border-radius: 2px; background: var(--text-3); height: 6px; }
.day .ld i.l { height: 10px; opacity: .8; }
.day .ld i.h { background: var(--hot); height: 12px; } .day .ld i.v { background: var(--warn); height: 9px; } .day .ld i.b { background: var(--accent-3); height: 8px; }
.day.today .d { color: var(--accent-2); }
.day.on { background: var(--grad); color: #fff; transform: translateY(-3px); box-shadow: 0 16px 30px -10px rgba(139,123,255,.85), inset 0 1px 0 rgba(255,255,255,.4); }
.day.on .w { color: rgba(255,255,255,.85); } .day.on .d { color: #fff; } .day.on .ld i { background: #fff; }
.seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 6px -14px 0; padding: 2px 14px 4px; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 0 0 auto; border: 1px solid var(--stroke-2); background: var(--glass); backdrop-filter: blur(16px) saturate(170%); -webkit-backdrop-filter: blur(16px) saturate(170%); color: var(--text-2); font-size: 13px; font-weight: 800; padding: 9px 14px; border-radius: 99px; transition: all .3s var(--ease); }
.seg button b { opacity: .55; margin-left: 5px; font-weight: 800; }
.seg button.on { background: var(--text); color: var(--bg); border-color: transparent; box-shadow: 0 10px 22px -10px rgba(0,0,0,.6); }
.wk { display: flex; align-items: center; justify-content: space-between; padding: 6px; border-radius: 99px; margin-top: 8px; }
.wk .ar { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--stroke); display: grid; place-items: center; transition: transform .3s var(--spring); }
.wk .ar:active { transform: scale(.88); }
.wk .ar svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.wk b { font: 600 13.5px var(--disp); letter-spacing: -.03em; }
.wk b small { display: block; text-align: center; font: 800 10px Manrope, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin-top: 3px; }
.bd { display: flex; align-items: center; gap: 14px; padding: 12px 18px 16px; font-weight: 800; }
.bd b { font-size: 30px; }

/* ---------- карточки ---------- */
.decks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
.deck { position: relative; overflow: hidden; isolation: isolate; padding: 16px; border-radius: 26px; min-height: 160px; display: flex; flex-direction: column; justify-content: space-between; color: #fff; border: 0; text-align: left;
  box-shadow: 0 22px 40px -18px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.35); transition: transform .4s var(--spring); }
.deck:active { transform: scale(.96); }
.deck::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(circle at 85% 15%, rgba(255,255,255,.4), transparent 42%), radial-gradient(circle at 0% 100%, rgba(0,0,0,.28), transparent 55%); }
.deck .cnt { font: 600 38px/1 var(--disp); letter-spacing: -.05em; }
.deck b { font: 600 15px/1.2 var(--disp); letter-spacing: -.03em; }
.deck span { display: block; font-size: 11.5px; font-weight: 800; opacity: .85; margin-top: 6px; }
.deck .pr { height: 4px; border-radius: 2px; background: rgba(255,255,255,.28); margin-top: 8px; overflow: hidden; }
.deck .pr i { display: block; height: 100%; background: #fff; border-radius: 2px; }
.dh { display: flex; align-items: center; gap: 12px; margin-top: 8px; padding: 12px 16px; border-radius: 99px; }
.dh .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--stroke-2); overflow: hidden; }
.dh .bar i { display: block; height: 100%; border-radius: 3px; background: var(--grad); transition: width .4s var(--ease); }
.dh b { font: 600 13px var(--disp); letter-spacing: -.02em; white-space: nowrap; }
.dh span { font-size: 12px; font-weight: 800; color: var(--ok); white-space: nowrap; }
.stack { position: relative; height: 340px; margin-top: 18px; perspective: 1400px; }
.stack .gh { position: absolute; inset: 0; border-radius: 30px; background: var(--glass); border: 1px solid var(--stroke-2); }
.stack .g1 { transform: translateY(14px) scale(.94); opacity: .65; }
.stack .g2 { transform: translateY(27px) scale(.88); opacity: .35; }
.flip { position: absolute; inset: 0; touch-action: pan-y; cursor: pointer; transition: transform .55s var(--spring); }
.flip .in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .7s var(--spring); }
.flip.on .in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 26px; overflow-wrap: anywhere; }
.face div { font: 600 21px/1.3 var(--disp); letter-spacing: -.03em; }
.face small { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: .65; margin-bottom: 16px; }
.face em { position: absolute; bottom: 18px; font-style: normal; font-size: 11.5px; font-weight: 700; opacity: .45; }
.face.front { background: linear-gradient(165deg, color-mix(in srgb, var(--bg-2) 70%, #fff 8%), var(--bg-2)); border: 1px solid var(--stroke-2); box-shadow: 0 30px 60px -24px rgba(0,0,0,.7); }
.face.back { transform: rotateY(180deg); color: #fff; box-shadow: 0 30px 60px -24px rgba(0,0,0,.7); }
.stamp { position: absolute; top: 26px; padding: 6px 12px; border: 3px solid; border-radius: 12px; font: 700 15px var(--disp); letter-spacing: .04em; opacity: 0; pointer-events: none; }
.stamp.k { left: 22px; color: var(--ok); transform: rotate(-12deg); }
.stamp.a { right: 22px; color: var(--warn); transform: rotate(12deg); }
.cardbar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.cardbar .btn { justify-content: center; padding: 15px; font-size: 14.5px; border-radius: 18px; }
.hint { text-align: center; font-size: 12px; font-weight: 700; color: var(--on-sky-2, var(--text-3)); margin-top: 12px; }

/* ---------- файлы ---------- */
.files { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
.file { padding: 15px; display: flex; flex-direction: column; gap: 10px; min-height: 172px; }
.file .ty { position: relative; width: 44px; height: 54px; border-radius: 10px 16px 10px 10px; display: grid; place-items: end center; padding-bottom: 8px; font: 700 9.5px var(--disp); letter-spacing: .02em; color: #fff; background: var(--fc); box-shadow: 0 12px 22px -10px var(--fc); }
.file .ty::before { content: ""; position: absolute; right: 0; top: 0; width: 15px; height: 15px; border-radius: 0 0 0 6px; background: linear-gradient(225deg, var(--bg-2) 50%, rgba(255,255,255,.55) 50%); opacity: .9; }
.file .fn { font-weight: 800; font-size: 13.5px; line-height: 1.3; overflow-wrap: anywhere; flex: 1; }
.file .ft { font-size: 11.5px; color: var(--text-3); font-weight: 700; }
.file .btn { justify-content: center; }
.fbtns { display: flex; gap: 8px; } .fbtns .btn { white-space: nowrap; } .fbtns .btn.pri { flex: 1; }
.fpill { border: 0; margin: 0 6px 6px 0; padding: 6px 10px; font-size: 12px; cursor: pointer; }
.fbtns .btn.sq { flex: none; width: 46px; justify-content: center; padding: 10px 0; }
.viewer { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: rgba(3,4,10,.94); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  padding: calc(var(--safe-top) + 12px) 0 calc(14px + env(safe-area-inset-bottom)); opacity: 0; pointer-events: none; transition: opacity .3s; }
.viewer.on { opacity: 1; pointer-events: auto; }
.vbody { flex: 1; min-height: 0; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 0 12px; -webkit-overflow-scrolling: touch; }
.vbody img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 16px; box-shadow: 0 30px 60px -20px #000; animation: rise .45s var(--spring); }
.vbody .pdf { align-self: flex-start; display: flex; flex-direction: column; gap: 10px; padding: 4px 0 10px; }
.vbody .pdf canvas { border-radius: 10px; box-shadow: 0 16px 30px -14px #000; background: #fff; max-width: 100%; }
.vspin { position: absolute; left: 50%; top: 45%; width: 38px; height: 38px; margin: -19px; border-radius: 50%; border: 3px solid rgba(255,255,255,.15); border-top-color: var(--accent-2); animation: rot .8s linear infinite; display: none; }
.viewer.busy .vspin { display: block; }
@keyframes rot { to { transform: rotate(360deg); } }
.vbar { display: flex; justify-content: center; gap: 10px; padding-top: 12px; } .vbar .btn { padding: 12px 16px; }

/* ---------- док ---------- */
nav.dock { position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 20; max-width: 520px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(6, 1fr); padding: 7px; border-radius: 30px; isolation: isolate;
  background: color-mix(in srgb, var(--bg-2) 58%, transparent); backdrop-filter: blur(30px) saturate(200%); -webkit-backdrop-filter: blur(30px) saturate(200%);
  box-shadow: 0 22px 50px -12px rgba(0,0,0,.6), inset 0 1px 0 var(--edge-hi); }
nav.dock::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; background: linear-gradient(160deg, var(--edge-hi), var(--edge-lo) 40%, rgba(255,255,255,.1));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.dock .ind { position: absolute; top: 7px; bottom: 7px; left: 7px; width: calc((100% - 14px) / 6); border-radius: 23px; z-index: -1;
  background: var(--grad); box-shadow: 0 12px 26px -8px rgba(139,123,255,.9), inset 0 1px 0 rgba(255,255,255,.45);
  transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .6s var(--spring); }
.nb { position: relative; border: 0; background: none; color: var(--text-3); font-size: 10px; font-weight: 800; letter-spacing: .01em; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 6px; transition: color .3s; }
.nb svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .5s var(--spring); }
.nb.on { color: #fff; }
.nb.on svg { transform: translateY(-1px) scale(1.12); }
.nb:active svg { transform: scale(.82); }
.nb .dot { position: absolute; top: 2px; left: calc(50% + 5px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--hot); color: #fff; font: 800 10px/17px Manrope, sans-serif; font-style: normal; text-align: center; box-shadow: 0 0 0 2px var(--bg-2), 0 4px 10px rgba(255,93,108,.6); }
.nb .dot:empty { display: none; }

/* ---------- кнопка «+», очередь, шторки, тосты ---------- */
.fab { position: fixed; right: 18px; bottom: calc(98px + env(safe-area-inset-bottom)); z-index: 19; width: 60px; height: 60px; border: 0; border-radius: 22px; background: none; display: grid; place-items: center; isolation: isolate; transition: transform .45s var(--spring), bottom .45s var(--spring); }
.fab::before { content: ""; position: absolute; inset: -4px; border-radius: 26px; z-index: -2; background: conic-gradient(from var(--a), #8b7bff, #45dcff, #ff5fa2, #ffd25c, #8b7bff); filter: blur(10px); opacity: .75; animation: spin 5s linear infinite; }
.fab::after { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; background: var(--grad); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), inset 0 -8px 16px rgba(40,20,120,.25); }
.fab svg { width: 26px; height: 26px; stroke: #fff; stroke-width: 2.8; stroke-linecap: round; fill: none; transition: transform .45s var(--spring); }
.fab:active { transform: scale(.9); } .fab:active svg { transform: rotate(90deg); }
@property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@keyframes spin { to { --a: 360deg; } }
.queue { position: fixed; left: 50%; bottom: calc(98px + env(safe-area-inset-bottom)); z-index: 19; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 7px; border-radius: 99px; font-size: 13px; font-weight: 800;
  background: color-mix(in srgb, var(--bg-2) 72%, transparent); backdrop-filter: blur(26px) saturate(190%); -webkit-backdrop-filter: blur(26px) saturate(190%); border: 1px solid var(--stroke-2); box-shadow: 0 18px 36px -12px rgba(0,0,0,.6);
  transform: translate(-50%, 24px) scale(.9); opacity: 0; pointer-events: none; transition: all .5s var(--spring); white-space: nowrap; }
.queue.on { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.queue .n { min-width: 30px; height: 30px; padding: 0 6px; border-radius: 15px; background: var(--grad); color: #fff; display: grid; place-items: center; font: 600 13px var(--disp); }
.queue button { border: 0; border-radius: 99px; padding: 8px 13px; font-weight: 800; font-size: 13px; }
.queue .u { background: var(--stroke); color: var(--text); }
.queue .s { background: var(--grad); color: #fff; }
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(4,5,14,.5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .35s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-width: 640px; margin: 0 auto; padding: 4px 18px calc(22px + env(safe-area-inset-bottom)); border-radius: 32px 32px 0 0; max-height: 88vh; overflow-y: auto;
  background: color-mix(in srgb, var(--bg-2) 86%, transparent); backdrop-filter: blur(34px) saturate(190%); -webkit-backdrop-filter: blur(34px) saturate(190%);
  box-shadow: 0 -24px 60px -20px rgba(0,0,0,.65), inset 0 1px 0 var(--edge-hi); transform: translateY(105%); transition: transform .55s cubic-bezier(.3,1.2,.5,1); }
.sheet.on { transform: none; }
.sheet .grab { padding: 8px 0 16px; touch-action: none; cursor: grab; }
.sheet .grab::before { content: ""; display: block; width: 42px; height: 5px; border-radius: 3px; background: var(--stroke-2); margin: 0 auto; }
.sheet h4 { margin: 0 0 6px; font: 600 22px/1.15 var(--disp); letter-spacing: -.04em; }
.sheet p { margin: 0 0 16px; color: var(--text-2); font-size: 13.5px; font-weight: 600; }
.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0 6px; }
.quick .btn { justify-content: center; flex-direction: column; gap: 3px; padding: 12px 6px; border-radius: 16px; }
.quick .btn small { font-size: 11px; color: var(--text-3); font-weight: 700; }
.quick .btn.on { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 10px 22px -10px rgba(139,123,255,.9); }
.quick .btn.on small { color: rgba(255,255,255,.85); }
label.f { display: block; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin: 14px 2px 7px; }
input, textarea { width: 100%; font: inherit; font-weight: 700; padding: 14px 15px; border-radius: 16px; border: 1px solid var(--stroke-2); background: var(--stroke); color: var(--text); outline: none; transition: border-color .2s, box-shadow .2s; }
input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(139,123,255,.2); }
textarea { min-height: 90px; resize: vertical; font-size: 16px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 15px; border-radius: 16px; background: var(--stroke); border: 1px solid var(--stroke-2); margin-top: 14px; font-weight: 800; cursor: pointer; }
.sw { width: 52px; height: 32px; border-radius: 16px; background: var(--stroke-2); position: relative; transition: background .25s; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .4s var(--spring); box-shadow: 0 3px 8px rgba(0,0,0,.3); }
.sw.on { background: var(--grad-hot); } .sw.on::after { transform: translateX(20px); }
.sheet .go { width: 100%; justify-content: center; padding: 16px; font-size: 16px; margin-top: 18px; border-radius: 18px; }
.toast { position: fixed; left: 50%; top: calc(var(--safe-top) + 12px); z-index: 40; transform: translate(-50%, -170%) scale(.9); padding: 11px 18px; border-radius: 99px; white-space: nowrap; font-weight: 800; font-size: 13.5px; color: var(--text);
  background: color-mix(in srgb, var(--bg-2) 80%, transparent); backdrop-filter: blur(26px) saturate(190%); -webkit-backdrop-filter: blur(26px) saturate(190%); border: 1px solid var(--stroke-2); box-shadow: 0 18px 36px -12px rgba(0,0,0,.6); transition: transform .55s var(--spring); }
.toast.on { transform: translate(-50%, 0); }
.cf { position: fixed; z-index: 45; width: 7px; height: 11px; border-radius: 2px; pointer-events: none; }
.msg { padding: 70px 24px; text-align: center; color: var(--text-2); font-weight: 700; }
.msg b { display: block; font-size: 44px; margin-bottom: 12px; }
.foot { text-align: center; margin: 28px 0 0; }
.foot span { display: inline-block; padding: 6px 12px; border-radius: 99px; font-size: 11.5px; font-weight: 700; color: var(--text-3); background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }


/* ---------- чаты: цитата дня и сводка ---------- */
.quote { position: relative; isolation: isolate; overflow: hidden; margin: 8px 12px 4px; padding: 16px 18px 15px; border-radius: 22px;
  background: linear-gradient(135deg, rgba(255,95,162,.2), rgba(139,123,255,.16) 60%, rgba(69,220,255,.12)); border: 1px solid rgba(255,95,162,.28); }
.quote .qm { position: absolute; right: 10px; top: -26px; z-index: -1; font: 700 120px/1 var(--disp); background: var(--grad-hot); -webkit-background-clip: text; background-clip: text; color: transparent; opacity: .45; }
.quote .ql { font-size: 10.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-3); }
.quote .qt { margin-top: 8px; font: 600 17px/1.38 var(--disp); letter-spacing: -.03em; overflow-wrap: anywhere; }
.quote .qa { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.av { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 600 14px var(--disp); color: #fff; background: var(--c); box-shadow: 0 6px 14px -6px var(--c); }
.qa b { display: block; font-size: 13px; font-weight: 800; }
.qa small { display: block; font-size: 11.5px; font-weight: 700; color: var(--text-3); margin-top: 1px; }
.dg { padding: 12px 18px 13px; }
.dg b { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 800; }
.dg b::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.dg p { margin: 5px 0 0 16px; font-size: 14px; line-height: 1.45; font-weight: 600; color: var(--text-2); }
.dpages { display: flex; align-items: flex-start; transition: height .4s var(--ease); overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.dpages::-webkit-scrollbar { display: none; }
.dpages .dg { flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; }
.ddots { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; padding: 2px 16px 14px; }
.ddots button { width: 7px; height: 7px; padding: 0; border: 0; border-radius: 4px; background: var(--stroke-2); transition: width .35s var(--spring), background .3s; }
.ddots button.on { width: 22px; background: var(--c); box-shadow: 0 0 10px var(--c); }
/* ---------- движение ---------- */
.anim > * { animation: rise .65s var(--ease) both; }
.anim > *:nth-child(2) { animation-delay: .05s } .anim > *:nth-child(3) { animation-delay: .1s } .anim > *:nth-child(4) { animation-delay: .15s }
.anim > *:nth-child(5) { animation-delay: .2s } .anim > *:nth-child(n+6) { animation-delay: .25s }
.slide-r > * { animation-name: in-r; } .slide-l > * { animation-name: in-l; }
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.985); } }
@keyframes in-r { from { opacity: 0; transform: translateX(28px); } }
@keyframes in-l { from { opacity: 0; transform: translateX(-28px); } }
@media (prefers-reduced-motion: reduce) { .anim > *, .fp::before, .fab::before, .clock i { animation: none !important; } }
@media (max-width: 360px) { .clock { font-size: 54px; } .wx .temp { font-size: 38px; } .nb { font-size: 9px; } }

<script>
// Telegram кэширует страницу: если на сайте новая версия — перезагружаемся на неё
const APP_V = document.querySelector('meta[name="app-v"]').content;
fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).then(j => {
  const q = new URLSearchParams(location.search);
  if (j.v && j.v !== APP_V && q.get("v") !== j.v) { q.set("v", j.v); location.replace(location.pathname + "?" + q.toString()); }
}).catch(() => {});
const QS = new URLSearchParams(location.search);
const tg = window.Telegram && Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  // на телефоне — во весь экран, чтобы небо уходило под статус-бар
  if (/ios|android/.test(tg.platform || "") && tg.isVersionAtLeast?.("8.0")) { try { tg.requestFullscreen(); } catch (e) {} }
}

const IC = {
  today: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  week: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="4"/><path d="M8 2v4M16 2v4M3 10h18M8 14h2M14 14h2M8 17h2"/></svg>',
  tasks: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="m8 12 3 3 5-6"/></svg>',
  sched: '<svg viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 0 1 2-2h12v15H6a2 2 0 0 0-2 1.5Zm0 0A2 2 0 0 0 6 21h12"/><path d="M9 7h6M9 11h4"/></svg>',
  cards: '<svg viewBox="0 0 24 24"><rect x="7" y="3" width="13" height="17" rx="3"/><path d="M4 7v11a3 3 0 0 0 3 3h9"/></svg>',
  files: '<svg viewBox="0 0 24 24"><path d="M21 12.5 12.6 21a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4L15.6 8.3"/></svg>',
  clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  bolt: '<svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>',
  prev: '<svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>',
  next: '<svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>',
};
const TABS = [["today", "Сегодня"], ["week", "Неделя"], ["tasks", "Задачи"], ["sched", "Пары"], ["cards", "Карточки"], ["files", "Файлы"]];
const WD = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
const WDL = ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];
const MON = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
const MS = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
const DECK_GRADS = ["linear-gradient(135deg,#7c6cff,#3ad6ff)", "linear-gradient(135deg,#ff5fa2,#ff8a5b)", "linear-gradient(135deg,#00c9a7,#3a7bff)", "linear-gradient(135deg,#f7b733,#fc4a1a)", "linear-gradient(135deg,#8e2de2,#4a00e0)"];

let D = null, tab = QS.get("tab") || "today", prevTab = null;
let selDay = null, schedWeek = 0, filter = "all", deck = null, cardIdx = 0, flipped = false, openTask = null;

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let ops = store.get("ops", []);
const haptic = (t = "light") => { try { t === "sel" ? tg.HapticFeedback.selectionChanged() : t === "ok" || t === "error" ? tg.HapticFeedback.notificationOccurred(t === "ok" ? "success" : "error") : tg.HapticFeedback.impactOccurred(t); } catch (e) {} };

// ---------- время (Москва) ----------
const msk = () => new Date(Date.now() + (new Date().getTimezoneOffset() + 180) * 60000);
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const P = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const add = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => iso(msk());
const ddmm = s => s.slice(8, 10) + "." + s.slice(5, 7);
const nice = s => { const d = P(s); return d.getDate() + " " + MON[d.getMonth()]; };
const short = s => { const d = P(s); return WD[d.getDay()].toLowerCase() + ", " + d.getDate() + " " + MS[d.getMonth()]; };
const diff = s => Math.round((P(s) - P(today())) / 864e5);
const relTxt = s => { const n = diff(s); return n === 0 ? "сегодня" : n === 1 ? "завтра" : n === 2 ? "послезавтра" : n < 0 ? "прошло" : n <= 7 ? "через " + n + " " + pl(n, "день", "дня", "дней") : nice(s); };
const mins = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const hhmm = m => String(Math.floor(m / 60) % 24).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pl = (n, a, b, c) => { const m = Math.abs(n) % 10, h = Math.abs(n) % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; };
// у каждого предмета свой цвет — одинаковый на всех экранах
const hueOf = s => { let h = 11; for (const ch of String(s)) h = (h * 33 + ch.charCodeAt(0)) % 360; return h; };
const colOf = l => l.vuc ? "#ffb547" : `hsl(${hueOf(l.n)} 85% 66%)`;

// ---------- данные ----------
let KEY = null; // ключ планера: им же расшифровываются файлы
async function load() {
  const k = QS.get("k");
  if (!k) throw new Error("Открой планер кнопкой «📅 Планер» в чате с ботом.");
  const raw = Uint8Array.from(atob(k.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((k.length + 3) % 4)), c => c.charCodeAt(0));
  const key = KEY = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const res = await fetch("data.enc?t=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error("Бот ещё не опубликовал данные.");
  const enc = await res.json(), b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(enc.iv) }, key, b(enc.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function tasks() {
  const L = D.tasks.map(t => ({ ...t }));
  for (const o of ops) {
    const t = L.find(x => x.id === o.id);
    if (o.op === "add") L.push({ id: "n" + o.n, text: o.text, date: o.date, time: o.time, imp: !!o.imp, files: [], src: "из планера", pend: true });
    else if (!t) continue;
    else if (o.op === "done") t.done = true;
    else if (o.op === "tmr" && t.date) { t.date = iso(add(P(t.date), 1)); t.pend = true; }
    else if (o.op === "move") { t.date = o.date; if (o.time) t.time = o.time; t.pend = true; }
    else if (o.op === "imp") { t.imp = o.value; t.pend = true; }
  }
  return L.sort((a, b) => (a.date || "9").localeCompare(b.date || "9") || (a.time || "9").localeCompare(b.time || "9"));
}
function lessons(ds) {
  const S = D.schedule;
  if (S.valid_until && ds > S.valid_until) return null;
  const out = (S.days[ds] || []).map(l => ({ s: l.time, e: endOf(l.time, 80), n: l.subj, m: l.type + " · " + l.room, who: l.teacher }));
  const wd = (P(ds).getDay() + 6) % 7;
  for (const v of S.vuc || []) if (v.wd === wd) {
    const r = v.text.match(/^(\d{2}:\d{2})[–-](\d{2}:\d{2})/);
    const rest = v.text.replace(/^\d{2}:\d{2}[–-]\d{2}:\d{2}\s*/, ""), name = rest.split(/[,:]/)[0].replace(/\s*\(.*$/, "") || "ВУЦ";
    // длинный блок ВУЦ (например, 09:00–15:50) — это несколько пар по стандартной сетке
    const slots = r ? SLOTS.filter(t => mins(t) >= mins(r[1]) && mins(t) + 80 <= mins(r[2])) : [];
    if (slots.length > 1) slots.forEach((t, i) => out.push({ s: t, e: endOf(t, 80), n: name + " · " + (i + 1) + " пара", m: i ? "" : (rest.match(/построение.*$/i) || [""])[0], vuc: true }));
    else out.push({ s: r ? r[1] : v.time, e: r ? r[2] : endOf(v.time, 80), n: name, m: rest, vuc: true });
  }
  return out.sort((a, b) => a.s.localeCompare(b.s));
}
const SLOTS = ["09:00", "10:35", "12:55", "14:30", "16:00", "17:30", "18:55"]; // стандартная сетка пар МГИМО
function endOf(t, d) { return hhmm(mins(t) + d); }

// ---------- кусочки интерфейса ----------
const card = (title, aside, inner, dot) => `<section class="glass card"><div class="ch"><h3><i${dot ? ` style="--dotc:${dot}"` : ""}></i>${title}</h3>${aside ? `<span>${aside}</span>` : ""}</div>${inner}</section>`;
const empty = (e, t) => `<div class="empty"><b>${e}</b>${t}</div>`;

function dueEl(t) {
  if (!t.date) return `<div class="due"><b>∞</b><small>без срока</small></div>`;
  const n = diff(t.date);
  if (n < 0) return `<div class="due hot"><b>!</b><small>прошло</small></div>`;
  if (n === 0) return `<div class="due hot"><b class="${t.time ? "s" : ""}">${t.time || "!"}</b><small>сегодня</small></div>`;
  return `<div class="due ${n === 1 ? "warn" : n <= 3 ? "soon" : ""}"><b>${n}</b><small>${pl(n, "день", "дня", "дней")}</small></div>`;
}
function taskEl(t) {
  const id = typeof t.id === "number" ? t.id : null, sw = id !== null && !t.done;
  const meta = [];
  if (id !== null) meta.push(`<span class="pill">#${id}</span>`);
  if (t.date) meta.push(`<span class="pill">${t.approx ? "~" : ""}${short(t.date)}${t.time ? " · " + t.time : ""}</span>`);
  if (t.imp) meta.push('<span class="pill hot">❗️ важно</span>');
  if (t.files?.length) meta.push(`<span class="pill acc">📎 ${t.files.length}</span>`);
  if (t.pend) meta.push('<span class="pill ok">ждёт бота</span>');
  return `<div class="task ${t.done ? "done" : ""} ${openTask === t.id ? "open" : ""}">
    ${sw ? `<div class="rev l"><span>✓ Сделано</span></div><div class="rev r"><span>${t.date ? "⏰ Завтра" : "📅 Срок"}</span></div>` : ""}
    <div class="tk" data-open="${t.id}" ${sw ? `data-sw="${id}"` : ""}>
      <button class="chk" ${sw ? "" : "disabled"} data-done="${id}" aria-label="Сделано"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <div class="tb"><div class="tt">${esc(t.text)}</div><div class="tm">${meta.join("")}</div>${t.src ? `<div class="src">${esc(t.src)}</div>` : ""}
      ${sw ? `<div class="more">${t.date ? `<button class="btn" data-tmr="${id}">⏰ Завтра</button>` : ""}<button class="btn" data-move="${id}">📅 Перенести</button><button class="btn" data-imp="${id}">${t.imp ? "Снять ❗️" : "❗️ Важно"}</button></div>` : ""}</div>
      ${dueEl(t)}
    </div></div>`;
}
const taskList = L => L.map(taskEl).join("");

function timeline(ds, due = []) {
  const L = lessons(ds);
  if (L === null) return empty("📭", "Расписание дальше не загружено — пришли боту новое");
  if (!L.length) return empty("🌴", "Пар нет — отдыхай");
  const isT = ds === today(), nowM = nowMin(), used = new Set();
  return `<div class="tl">${L.map(l => {
    const past = isT && mins(l.e) <= nowM, cur = isT && mins(l.s) <= nowM && nowM < mins(l.e);
    const hw = due.filter(t => t.time === l.s && !used.has(t.id)); hw.forEach(t => used.add(t.id));
    return `<div class="ls ${past ? "past" : ""} ${cur ? "cur" : ""}" style="--c:${colOf(l)}">
      <div class="t">${l.s}<small>${l.e}</small></div><div class="rail"><i></i></div>
      <div class="b"><div class="n">${l.vuc ? "🎖 " : ""}${esc(l.n)}${cur ? ' <span class="pill live">идёт</span>' : ""}</div><div class="m">${esc(l.m)}${l.who ? " · " + esc(l.who) : ""}</div>
      ${hw.map(t => `<div class="hw">📝 <b>#${t.id}</b> ${t.imp ? "❗️ " : ""}${esc(t.text)}</div>`).join("")}</div></div>`;
  }).join("")}</div>`;
}

// карточка «что сейчас» — две страницы, листаются свайпом: пары и дедлайны
function ringHtml(pct, big, small) {
  const C = 2 * Math.PI * 34;
  return `<div class="ring"><svg viewBox="0 0 78 78"><circle class="bg" cx="39" cy="39" r="34"/><circle class="fg" cx="39" cy="39" r="34" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - pct)).toFixed(1)}"/></svg>
    <div class="lb"><b>${big}</b><small>${small}</small></div></div>`;
}
function page(fc, ring, lab, live, title, meta, extra = "") {
  return `<div class="fp" style="--fc:${fc}"><div class="fx">${ring}
    <div><div class="flab ${live ? "live" : ""}">${lab}</div><div class="ftitle ${title.length > 48 ? "long" : ""}">${esc(title)}</div><div class="fmeta">${esc(meta)}</div></div></div>${extra}</div>`;
}
function pairPage(L, nowM) {
  const cur = L.find(l => mins(l.s) <= nowM && nowM < mins(l.e)), next = L.find(l => mins(l.s) > nowM);
  if (cur) {
    const left = mins(cur.e) - nowM;
    return page(colOf(cur), ringHtml((nowM - mins(cur.s)) / (mins(cur.e) - mins(cur.s)), left, "мин"), "Сейчас", true, cur.n, (cur.m ? cur.m + " · " : "") + "до " + cur.e, ribbon(L, nowM));
  }
  if (next) {
    const m = mins(next.s) - nowM;
    const big = m < 60 ? m : Math.floor(m / 60) + "<small style='font-size:.55em'>ч</small>" + (m % 60 ? String(m % 60).padStart(2, "0") : "");
    return page(colOf(next), ringHtml(1 - Math.min(m, 180) / 180, big, m < 60 ? "мин" : "до пары"), "Далее", false, next.n, `${next.s}–${next.e}${next.m ? " · " + next.m : ""}`, ribbon(L, nowM));
  }
  const tm = lessons(iso(add(P(today()), 1))) || [];
  const meta = tm.length ? `завтра первая в ${tm[0].s} · ${tm[0].n}` : "завтра тоже без пар";
  return page("#38e6a6", ringHtml(1, "✓", L.length ? "готово" : "отдых"), L.length ? "Пары позади" : "Свободный день", false, L.length ? "На сегодня всё" : "Пар нет — отдыхай", meta, L.length ? ribbon(L, nowM) : "");
}
function dlPage(T, nowM) {
  const left = t => diff(t.date) * 1440 + mins(t.time || "23:59") - nowM;
  const nd = T.find(t => t.date && left(t) > 0);
  if (!nd) return page("#38e6a6", ringHtml(1, "✓", "чисто"), "Дедлайны", false, "Дедлайнов нет", "можно выдохнуть ✨");
  const m = left(nd), fc = m < 1440 ? "#ff6b6b" : m < 4320 ? "#ffa94d" : "#8b7bff";
  let big, small;
  if (m < 60) { big = m; small = "мин"; }

function addSheet() {
  draft = { date: null, time: "", imp: false };
  sheet(`<h4>Новая задача</h4><p>Бот добавит её в список в ближайший запуск</p>
    <textarea id="ntext" placeholder="Например: эссе по социологии, 5 страниц"></textarea>
    <label class="f">Срок</label><div class="quick" id="nq">${quickDates().map(([n, ds]) => `<button class="btn" data-qd="${ds}">${n}<small>${WD[P(ds).getDay()].toLowerCase()} ${ddmm(ds)}</small></button>`).join("")}<button class="btn" data-qd="">Без срока<small>—</small></button></div>
    <div class="row2"><div><label class="f">Дата</label><input type="date" id="ndate"></div><div><label class="f">Время</label><input type="time" id="ntime"></div></div>
    <div class="toggle" data-tg="imp"><span>❗️ Важная<br><small style="color:var(--text-3);font-weight:700">контрольная, зачёт, сдача</small></span><div class="sw" id="nimp"></div></div>
    <button class="btn pri go" data-save="add">Добавить</button>`);
  setTimeout(() => $("ntext")?.focus(), 400);
}
function moveSheet(id) {
  const t = tasks().find(x => x.id === id);
  draft = { id, date: t?.date || null, time: t?.time || "" };
  sheet(`<h4>Перенести #${id}</h4><p>${esc(t?.text || "").slice(0, 140)}</p>
    <div class="quick" id="nq">${quickDates().map(([n, ds]) => `<button class="btn ${draft.date === ds ? "on" : ""}" data-qd="${ds}">${n}<small>${WD[P(ds).getDay()].toLowerCase()} ${ddmm(ds)}</small></button>`).join("")}</div>
    <div class="row2"><div><label class="f">Дата</label><input type="date" id="ndate" value="${draft.date || ""}"></div><div><label class="f">Время</label><input type="time" id="ntime" value="${draft.time || ""}"></div></div>
    <button class="btn pri go" data-save="move">Перенести</button>`);
}

// ---------- отрисовка ----------
function renderNav() {
  const nav = $("nav");
  if (!nav.childElementCount) nav.innerHTML = '<i class="ind"></i>' + TABS.map(([k, n]) => `<button class="nb" data-tab="${k}">${IC[k]}<span>${n}</span><em class="dot"></em></button>`).join("");
  const act = D ? tasks().filter(t => !t.done) : [], td = today();
  const badge = { today: act.filter(t => t.date && t.date <= td).length, tasks: act.filter(t => t.imp).length };
  nav.querySelectorAll(".nb").forEach(b => { b.classList.toggle("on", b.dataset.tab === tab); b.querySelector(".dot").textContent = badge[b.dataset.tab] || ""; });
  nav.style.setProperty("--i", TABS.findIndex(x => x[0] === tab));
}
function renderHud(animate) {
  const h = $("hud");
  h.innerHTML = hud();
  h.className = "hud" + (animate ? " anim" : "");
  $("topbar").textContent = tab === "today" ? hhmm(nowMin()) + " · " + (wxKind() ? wxIcon(wxKind()) + (W ? " " + sgn(Math.round(W.temp)) : "") : "Сегодня") : (TABS.find(x => x[0] === tab) || [])[1];
}
function render(animate = true) {
  renderNav(); renderHud(animate);
  const V = { today: vToday, week: vWeek, tasks: vTasks, sched: vSched, cards: vCards, files: vFiles }[tab];
  const i = TABS.findIndex(x => x[0] === tab), j = TABS.findIndex(x => x[0] === prevTab);
  const main = $("main");
  main.className = animate ? "anim" + (prevTab && prevTab !== tab ? (i > j ? " slide-r" : " slide-l") : "") : "";
  main.innerHTML = V() + `<div class="foot"><span>обновлено ботом ${D.generated.slice(8, 10)}.${D.generated.slice(5, 7)} в ${D.generated.slice(11, 16)}</span></div>`;
  prevTab = tab;
  if (tab === "today") { syncFocus(focusPage(), false); syncChats(chatIdx, false); }
  $("fab").style.display = tab === "tasks" || tab === "today" || tab === "week" ? "grid" : "none";
  if (tg?.BackButton) (tab === "cards" && deck !== null) ? tg.BackButton.show() : tg.BackButton.hide();
  renderQueue();
}
function renderQueue() {
  const n = ops.length, mb = !!(tg && tg.MainButton && tg.platform && tg.platform !== "unknown");
  $("queue").classList.toggle("on", n > 0);
  $("qn").textContent = n;
  $("qtext").textContent = n === 1 ? "изменение" : n < 5 ? "изменения" : "изменений";
  $("send").style.display = mb ? "none" : "";
  $("fab").style.bottom = n ? "calc(152px + env(safe-area-inset-bottom))" : "";
  if (mb) { if (n) { tg.MainButton.setParams({ text: "Отправить боту · " + n, color: "#7b6cff", text_color: "#ffffff" }); tg.MainButton.show(); } else tg.MainButton.hide(); }
}
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1900); }
function addOp(o, msg) { ops.push(o); store.set("ops", ops); haptic("light"); if (msg) toast(msg); render(false); }
// Telegram принимает sendData только от планера, открытого кнопкой на клавиатуре под полем ввода.
// Из меню (кнопка слева от поля) данные молча отбрасываются — тогда возвращаем изменения в очередь и объясняем.
function sendOps() {
  if (!ops.length) return;
  const payload = JSON.stringify({ v: 1, ops });
  if (!tg || !tg.platform || tg.platform === "unknown") { toast("Открой планер в Telegram кнопкой «📅 Планер»"); return; }
  if (payload.length > 4000) { tg.showAlert("Слишком много изменений сразу — отправь часть, потом остальное."); return; }
  const keep = ops.slice();
  ops = []; store.set("ops", []); haptic("ok");
  try { tg.sendData(payload); } catch (e) {}
  // приняли — планер сейчас закроется и этот таймер не сработает
  setTimeout(() => {
    if (ops.length) return;
    ops = keep; store.set("ops", ops); render(false); haptic("error");
    const m = "Из меню Telegram не даёт отправлять данные боту. Изменения сохранены: закрой планер, открой его кнопкой «📅 Планер» на клавиатуре под полем ввода и нажми «Отправить боту».";
    tg.showPopup ? tg.showPopup({ title: "Открой с клавиатуры", message: m, buttons: [{ type: "ok" }] }) : tg.showAlert(m);
  }, 1500);
}
// конфетти, когда задача сделана
function burst(x, y) {
  const C = ["#38e6a6", "#45dcff", "#8b7bff", "#ffd25c", "#ff5fa2"];
  for (let i = 0; i < 22; i++) {
    const s = document.createElement("i"), a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 70;
    s.className = "cf"; s.style.left = x + "px"; s.style.top = y + "px"; s.style.background = C[i % C.length];
    document.body.appendChild(s);
    s.animate([{ transform: "translate(-50%,-50%) rotate(0) scale(1)", opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d + 30}px)) rotate(${Math.random() * 540}deg) scale(.5)`, opacity: 0 }],
      { duration: 650 + Math.random() * 400, easing: "cubic-bezier(.2,.8,.2,1)" }).onfinish = () => s.remove();
  }
}
function markDone(id, from) {
  const r = from?.getBoundingClientRect();
  if (r) burst(r.left + 20, r.top + r.height / 2);
  haptic("ok");
  setTimeout(() => addOp({ op: "done", id }, "✅ #" + id + " — сделано"), 320);
}

// ---------- жесты: свайп задач, карточек и шторки ----------
let G = null, noClick = 0;
document.addEventListener("pointerdown", e => {
  if (e.button > 0) return;
  const tk = e.target.closest(".tk[data-sw]"), fl = e.target.closest("#flip"), gr = e.target.closest(".sheet .grab");
  const el = tk || fl || gr;
  if (!el || (tk && e.target.closest("button"))) return;
  G = { el, k: tk ? "task" : fl ? "card" : "sheet", x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, lock: null, id: e.pointerId, arm: false };
});
document.addEventListener("pointermove", e => {
  if (!G || e.pointerId !== G.id) return;
  G.dx = e.clientX - G.x0; G.dy = e.clientY - G.y0;
  if (!G.lock) {
    if (Math.hypot(G.dx, G.dy) < 8) return;
    G.lock = G.k === "sheet" ? "y" : Math.abs(G.dx) > Math.abs(G.dy) * 1.2 ? "x" : "no";
    if (G.lock === "no") return;
    G.el.style.transition = "none";
    if (G.k === "task") G.el.parentElement.classList.add("drag");
    try { G.el.setPointerCapture(G.id); } catch (_) {}
  }
  if (G.lock === "no") return;
  const arm = G.k === "sheet" ? G.dy > 110 : Math.abs(G.dx) > 96;
  if (arm !== G.arm) { G.arm = arm; if (arm) haptic("light"); }
  if (G.k === "task") {
    const row = G.el.parentElement, dx = G.dx;
    G.el.style.transform = `translateX(${dx}px)`;
    row.querySelector(".rev.l").style.width = Math.max(0, dx - 10) + "px";
    row.querySelector(".rev.r").style.width = Math.max(0, -dx - 10) + "px";
    row.classList.toggle("arm", arm);
  } else if (G.k === "card") {
    G.el.style.transform = `translateX(${G.dx}px) rotate(${G.dx / 16}deg)`;
    G.el.querySelector(".stamp.k").style.opacity = clamp(G.dx / 100);
    G.el.querySelector(".stamp.a").style.opacity = clamp(-G.dx / 100);
  } else {
    const sh = $("sheet"); sh.style.transition = "none"; sh.style.transform = `translateY(${Math.max(0, G.dy)}px)`;
  }
});
function endGesture(e) {
  if (!G || e.pointerId !== G.id) return;
  const g = G; G = null;
  if (!g.lock || g.lock === "no") return;
  noClick = Date.now();
  if (g.k === "task") {
    const row = g.el.parentElement, id = +g.el.dataset.sw, L = row.querySelector(".rev.l"), R = row.querySelector(".rev.r");
    row.classList.remove("drag", "arm"); g.el.style.transition = "";
    const reset = () => { g.el.style.transform = ""; L.style.width = ""; R.style.width = ""; };
    if (g.dx > 96) {
      g.el.style.transform = "translateX(110%)"; L.style.width = "calc(100% - 16px)";
      store.set("swipeHint", true); markDone(id, L);
    } else if (g.dx < -96) {
      reset(); store.set("swipeHint", true);
      const t = tasks().find(x => x.id === id);
      if (t?.date) addOp({ op: "tmr", id }, "⏰ #" + id + " — на завтра"); else moveSheet(id);
    } else reset();
  } else if (g.k === "card") {
    g.el.style.transition = "";
    if (Math.abs(g.dx) > 100) {
      g.el.style.transform = `translateX(${Math.sign(g.dx) * 130}vw) rotate(${Math.sign(g.dx) * 24}deg)`;
      haptic(g.dx > 0 ? "ok" : "light");
      setTimeout(() => cardAct(g.dx > 0 ? "know" : "again"), 260);
    } else { g.el.style.transform = ""; g.el.querySelectorAll(".stamp").forEach(s => s.style.opacity = ""); }
  } else {
    const sh = $("sheet"); sh.style.transition = "";
    if (g.dy > 110) closeSheet(); else sh.style.transform = "";
  }
}
document.addEventListener("pointerup", endGesture);
document.addEventListener("pointercancel", endGesture);

function cardAct(a) {
  const d = D.cards[deck], n = d.cards.length;
  if (a === "know") { const k = new Set(store.get("known:" + d.name, [])); k.add(d.cards[cardIdx][0]); store.set("known:" + d.name, [...k]); cardIdx = (cardIdx + 1) % n; haptic("ok"); }
  else if (a === "again") { d.cards.push(d.cards.splice(cardIdx, 1)[0]); }
  else if (a === "prev") cardIdx = (cardIdx + n - 1) % n;
  else if (a === "shuffle") { d.cards.sort(() => Math.random() - .5); cardIdx = 0; toast("🔀 Перемешано"); }
  flipped = false; render(false);
}

// ---------- нажатия ----------
document.addEventListener("click", e => {
  if (Date.now() - noClick < 400) return;
  const el = e.target.closest("button, [data-open], #flip, .toggle");
  if (!el) return;
  const s = el.dataset;
  if (s.tab) { if (tab !== s.tab) haptic("sel"); tab = s.tab; deck = null; selDay = null; openTask = null; render(); scrollTo({ top: 0 }); return; }
  if (s.scroll) { $(s.scroll)?.scrollIntoView({ behavior: "smooth", block: "start" }); haptic("sel"); return; }
  if (s.dp !== undefined) { syncChats(+s.dp, true); return; }
  if (s.fp !== undefined) { store.set("focusPage", { d: today(), i: +s.fp }); syncFocus(+s.fp, true); haptic("sel"); return; }
  if (s.go) { const [t, f] = s.go.split(":"); haptic("sel"); tab = t; if (f) filter = f; deck = null; selDay = null; render(); scrollTo({ top: 0 }); return; }
  if (s.tkt !== undefined) { haptic("light"); taskSheet(s.tkt); return; }
  if (s.done) { el.classList.add("pop"); markDone(+s.done, el); if (el.closest(".sheet")) setTimeout(closeSheet, 250); return; }
  if ((s.tmr || s.imp) && el.closest(".sheet")) closeSheet();
  if (s.tmr) { addOp({ op: "tmr", id: +s.tmr }, "⏰ #" + s.tmr + " — на завтра"); return; }
  if (s.move) { moveSheet(+s.move); return; }
  if (s.imp) { const t = tasks().find(x => x.id === +s.imp); addOp({ op: "imp", id: +s.imp, value: !t.imp }, t.imp ? "Пометка снята" : "❗️ Отмечено важным"); return; }
  if (s.filter) { filter = s.filter; haptic("sel"); render(false); return; }
  if (s.day) { selDay = s.day; haptic("sel"); render(false); return; }
  if (s.week) { schedWeek += +s.week; selDay = null; haptic("sel"); render(false); return; }
  if (s.deck) { deck = +s.deck; cardIdx = 0; flipped = false; haptic("light"); render(); return; }
  if (el.id === "flip") { flipped = !flipped; haptic("light"); el.classList.toggle("on", flipped); return; }
  if (s.card) { cardAct(s.card); return; }
  if (s.fdl) { const f = fileBy(s.fdl); if (f) dlFile(f); return; }
  if (s.fview) { const f = fileBy(s.fview); if (f) viewFile(f); return; }
  if (s.vclose !== undefined) { $("viewer").classList.remove("on"); return; }
  if (s.vdl !== undefined) { const f = fileBy($("viewer").dataset.path); if (f) dlFile(f); return; }
  if (s.vsend !== undefined) { const f = fileBy($("viewer").dataset.path); if (f) { $("viewer").classList.remove("on"); addOp({ op: "send_file", path: f.path, task: f.task }, "📩 Придёт в чат после отправки"); } return; }
  if (s.file !== undefined) { addOp({ op: "send_file", path: s.file, task: +s.task }, "📩 Придёт в чат после отправки"); return; }
  if (s.qd !== undefined) { draft.date = s.qd || null; document.querySelectorAll("#nq .btn").forEach(b => b.classList.toggle("on", b === el)); const di = $("ndate"); if (di) di.value = s.qd; haptic("sel"); return; }
  if (s.tg === "imp") { draft.imp = !draft.imp; $("nimp").classList.toggle("on", draft.imp); haptic("sel"); return; }
  if (s.save === "add") {
    const text = $("ntext").value.trim();
    if (!text) { $("ntext").focus(); return; }
    const date = $("ndate").value || draft.date || null, time = $("ntime").value || null;
    closeSheet(); addOp({ op: "add", n: Date.now() % 1e6, text, date, time, imp: draft.imp }, "➕ Задача добавлена"); return;
  }
  if (s.save === "move") {
    const date = $("ndate").value || draft.date, time = $("ntime").value || null;
    if (!date) return;
    closeSheet(); addOp({ op: "move", id: draft.id, date, time }, "📅 #" + draft.id + " → " + ddmm(date)); return;
  }
  if (s.open !== undefined && !e.target.closest("button")) { const id = isNaN(+s.open) ? s.open : +s.open; openTask = openTask === id ? null : id; haptic("sel"); render(false); return; }
});
$("scrim").onclick = closeSheet;
$("fab").onclick = () => { haptic("light"); addSheet(); if (tab === "week" && selDay) setTimeout(() => { const b = document.querySelector(`#nq [data-qd="${selDay}"]`); $("ndate").value = selDay; draft.date = selDay; b?.classList.add("on"); }, 0); };
$("undo").onclick = () => { ops.pop(); store.set("ops", ops); toast("↩︎ Отменено"); render(false); };
$("send").onclick = sendOps;
if (tg?.MainButton) tg.MainButton.onClick(sendOps);
if (tg?.BackButton) tg.BackButton.onClick(() => { deck = null; render(); });

// шапка мягко уходит при прокрутке, сверху появляется компактная полоса
addEventListener("scroll", () => {
  const y = scrollY, h = $("hud");
  h.style.transform = `translateY(${Math.min(y, 300) * .35}px)`;
  h.style.opacity = Math.max(0, 1 - y / 220);
  $("topbar").classList.toggle("on", y > 150);
}, { passive: true });

// раз в минуту: часы, небо, «идёт сейчас»
function tick() {
  applySky();
  if (D && !G && !$("sheet").classList.contains("on")) render(false);
  else if (!D) renderHud(false);
}
setTimeout(() => { tick(); setInterval(tick, 60000); }, (60 - new Date().getSeconds()) * 1000 + 50);

applySky(); renderNav(); renderHud(true);
requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove("noanim")));
refreshWeather(); setInterval(refreshWeather, 15 * 60000);
load().then(d => { D = d; W = W || d.weather || null; applySky(); if (msk().getDay() === 0) schedWeek = 1; render(); }).catch(err => {
  $("main").innerHTML = `<div class="glass card msg"><b>🔒</b>${esc(err.message && !/decrypt|operation/i.test(err.message) ? err.message : "Не удалось расшифровать данные — открой планер кнопкой в чате с ботом")}</div>`;
});
</script>
</body>
</html>
