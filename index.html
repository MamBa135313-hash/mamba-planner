    nav.classList.remove("drag");
    if (g.k === "dock") {
      const k = Math.max(0, Math.min(TABS.length - 1, Math.round(g.i0 + g.dx / dockStep())));
      if (k !== g.i0) goTab(TABS[k][0]); else nav.style.setProperty("--i", g.i0);
    } else if (g.k === "week") {
      if (go) { g.el.style.transform = ""; calWeekGo(g.dx < 0 ? 1 : -1); }
      else { g.el.style.transition = "transform .4s var(--spring)"; g.el.style.transform = ""; }
    } else {
      const j = g.i0 + (g.dx < 0 ? 1 : -1);
      if (go && TABS[j]) { g.el.style.transform = ""; goTab(TABS[j][0]); }
      else { g.el.style.transition = "transform .4s var(--spring)"; g.el.style.transform = ""; nav.style.setProperty("--i", g.i0); }
    }
  } else if (g.k === "card") {
    g.el.style.transition = "";
    if (Math.abs(g.dx) > 100) {
      g.el.style.transform = `translateX(${Math.sign(g.dx) * 130}vw) rotate(${Math.sign(g.dx) * 24}deg)`;
      haptic(g.dx > 0 ? "ok" : "light");
      if (study) study.busy = true;
      setTimeout(() => study && answer(g.dx > 0), 260);
    } else { g.el.style.transform = ""; g.el.querySelectorAll(".stamp").forEach(s => s.style.opacity = ""); }
  } else {
    const sh = $("sheet"); sh.style.transition = "";
    if (g.dy > 110) closeSheet(); else sh.style.transform = "";
  }
}
document.addEventListener("pointerup", endGesture);
document.addEventListener("pointercancel", endGesture);

// ---------- нажатия ----------
document.addEventListener("click", e => {
  if (Date.now() - noClick < 400) return;
  const el = e.target.closest("button, [data-open], [data-wxs], #flip, .toggle");
  if (!el) return;
  const s = el.dataset;
  if (s.tab) { goTab(s.tab, true); return; }
  if (s.add !== undefined) { $("fab").onclick(); return; }
  if (s.wxs) { haptic("light"); wxSheet(); return; }
  if (s.retry !== undefined) { location.reload(); return; }
  if (s.cdir) { if (s.cdir === cdir) return; const sw = el.parentNode, o = sw.querySelector("button.on"), from = o && { x: o.offsetLeft, w: o.offsetWidth };
    cdir = s.cdir; store.set("cdir", cdir); haptic("sel");
    sw.querySelectorAll("button").forEach(b => { const on = b === el; b.classList.toggle("on", on); b.setAttribute("aria-checked", on); });
    dirPill(from); return; }
  if (s.study) { startStudy(s.study, s.unit || (study?.unit ?? null)); return; }
  if (s.ans !== undefined) { if (study) flyAnswer(s.ans === "1"); return; }
  if (s.sx === "undo") { if (study) undoAnswer(); return; }
  if (s.sx === "finish") { if (study) { study.q = study.q.slice(0, study.pos); haptic("sel"); render(false); } return; }
  if (s.sx === "end") { study = null; navDir = -1; haptic("sel"); render(); scrollTo({ top: 0 }); return; }
  if (s.fold !== undefined) { if (s.fold) { if (s.fk === "c") cfold = s.fold; else ffold = s.fold; navDir = 1; haptic("light"); render(); scrollTo({ top: 0 }); } else goBack(); return; }
  if (s.scroll) { $(s.scroll)?.scrollIntoView({ behavior: MOTION ? "smooth" : "auto", block: "start" }); haptic("sel"); return; }
  if (s.dp !== undefined) { syncChats(+s.dp, true); return; }
  if (s.fp !== undefined) { store.set("focusPage", { d: today(), i: +s.fp }); syncFocus(+s.fp, true); haptic("sel"); return; }
  if (s.go) { const [t, f] = s.go.split(":"); haptic("sel"); tab = t; if (f) filter = f; deck = null; study = null; selDay = null; render(); scrollTo({ top: 0 }); return; }
  if (s.tkt !== undefined) { haptic("light"); taskSheet(s.tkt); return; }
  if (s.done) { el.classList.add("pop"); markDone(+s.done, el); if (el.closest(".sheet")) setTimeout(closeSheet, 250); return; }
  if ((s.tmr || s.imp) && el.closest(".sheet")) closeSheet();
  if (s.tmr) { addOp({ op: "tmr", id: +s.tmr }, "⏰ #" + s.tmr + " — на завтра"); return; }
  if (s.move) { moveSheet(+s.move); return; }
  if (s.imp) { const t = tasks().find(x => x.id === +s.imp); addOp({ op: "imp", id: +s.imp, value: !t.imp }, t.imp ? "#" + s.imp + " — не важно" : "❗️ #" + s.imp + " — важно"); return; }
  if (s.filter) { if (s.filter === filter) return; const from = segFrom(); filter = s.filter; haptic("sel"); renderSmooth(); segPill(from); segReveal(); return; }
  if (s.day) { if (tab === "cal") calSelect(s.day); else { selDay = s.day; haptic("sel"); render(false); } return; }
  if (s.week) { calWeekGo(+s.week); return; }
  if (s.deck) { deck = +s.deck; study = null; navDir = 1; haptic("light"); render(); scrollTo({ top: 0 }); return; }
  if (el.id === "flip") { if (study) { study.flipped = !study.flipped; el.classList.toggle("on", study.flipped); } haptic("light"); return; }
  if (s.fdl) { const f = fileBy(s.fdl); if (f) dlFile(f); return; }
  if (s.fview) { const f = fileBy(s.fview); if (f) viewFile(f, { from: (el.closest(".file") || el).getBoundingClientRect() }); return; }
  if (s.vclose !== undefined) { closeViewer(); return; }
  if (s.vdl !== undefined) { const f = fileBy($("viewer").dataset.path); if (f) dlFile(f); return; }
  if (s.vsend !== undefined) { const f = fileBy($("viewer").dataset.path); if (f) { closeViewer(); addOp({ op: "send_file", path: f.path, task: f.task }, "📩 В чат — придёт после «Отправить боту»"); } return; }
  if (s.file !== undefined) { addOp({ op: "send_file", path: s.file, task: +s.task || null }, "📩 В чат — придёт после «Отправить боту»"); return; }
  if (s.qd !== undefined) { draft.date = s.qd || null; document.querySelectorAll("#nq .btn").forEach(b => b.classList.toggle("on", b === el)); const di = $("ndate"); if (di) di.value = s.qd; haptic("sel"); return; }
  if (s.tg === "imp") { draft.imp = !draft.imp; $("nimp").classList.toggle("on", draft.imp); haptic("sel"); return; }
  if (s.save === "add") {
    const text = $("ntext").value.trim();
    if (!text) { $("ntext").focus(); return; }
    const date = $("ndate").value || draft.date || null, time = $("ntime").value || null;
    closeSheet(); addOp({ op: "add", n: Date.now() % 1e6, text, date, time, imp: draft.imp }, "➕ Задача добавлена"); return;
  }
  if (s.save === "move") {
    const date = $("ndate").value || draft.date, time = $("ntime").value || null;
    if (!date) return;
    closeSheet(); addOp({ op: "move", id: draft.id, date, time }, "📅 #" + draft.id + " — перенесено на " + ddmm(date)); return;
  }
  if (s.open !== undefined && !e.target.closest("button")) { const id = isNaN(+s.open) ? s.open : +s.open; openTask = openTask === id ? null : id; haptic("sel"); renderSmooth(); return; }
});
$("scrim").onclick = closeSheet;
// ссылка на чат с ботом: внутри Telegram открываем её самим Telegram, а не браузером
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="https://t.me/"]');
  if (a && tg?.openTelegramLink && tg.platform && tg.platform !== "unknown") { e.preventDefault(); try { tg.openTelegramLink(a.href); } catch (_) { location.href = a.href; } }
});
$("fab").onclick = () => { haptic("light"); addSheet(); if (tab === "cal" && selDay) setTimeout(() => { const b = document.querySelector(`#nq [data-qd="${selDay}"]`); $("ndate").value = selDay; draft.date = selDay; b?.classList.add("on"); }, 0); };
$("undo").onclick = () => { const o = ops.pop(); store.set("ops", ops); toast("↩︎ Отменено"); renderSmooth(o?.op === "done" ? String(o.id) : null); };
$("send").onclick = sendOps;
if (tg?.MainButton) tg.MainButton.onClick(sendOps);
if (tg?.BackButton) tg.BackButton.onClick(() => { goBack(); });
// кнопка «Назад» Telegram (на Android — и системная «назад»): закрывает сначала просмотр файла, потом шторку, потом папку/колоду
const backNeeded = () => viewerOn() || sheetOn() || (tab === "cards" && (study || deck !== null || cfold)) || (tab === "files" && ffold);
function syncBack() {
  if (!tg?.BackButton) return;
  backNeeded() ? tg.BackButton.show() : tg.BackButton.hide();
}
// системная «Назад» в приложении: true — шаг назад сделан внутри планера, false — приложение уходит в фон
window.miniBack = () => { if (!backNeeded()) return false; goBack(); return true; };
function segReveal() {
  const seg = document.querySelector("#main .seg"), b = seg?.querySelector("button.on"); if (!b) return;
  const sr = seg.getBoundingClientRect(), br = b.getBoundingClientRect(), l = br.left - sr.left, r = br.right - sr.left;
  if (l < 14) seg.scrollBy({ left: l - 14, behavior: MOTION ? "smooth" : "auto" });
  else if (r > sr.width - 14) seg.scrollBy({ left: r - sr.width + 14, behavior: MOTION ? "smooth" : "auto" });
  anim(b, [{ transform: "scale(.9)" }, { transform: "scale(1)" }], { duration: 420, easing: POP });
}
function goTab(t, again) {
  if (t === tab && !again) return;
  if (tab !== t) haptic("sel");
  tab = t; deck = null; study = null; selDay = null; openTask = null; ffold = cfold = null;
  render(); scrollTo({ top: 0 });
}
function goBack() {
  if (viewerOn()) { closeViewer(); haptic("sel"); return; }
  if (sheetOn()) { closeSheet(); haptic("sel"); return; }
  navDir = -1;
  if (tab === "cards" && study) study = null; else if (tab === "cards" && deck !== null) deck = null; else if (tab === "cards") cfold = null; else ffold = null; haptic("sel"); render(); scrollTo({ top: 0 }); }

// шапка мягко уходит при прокрутке, сверху появляется компактная полоса
let fabY = 0;
addEventListener("scroll", () => {
  const y = scrollY, h = $("hud"), f = $("fab");
  if (y < 80) { f.classList.remove("away"); fabY = y; }
  else if (Math.abs(y - fabY) > 10) { f.classList.toggle("away", y > fabY); fabY = y; }
  h.style.transform = `translateY(${Math.min(y, 300) * .35}px)`;
  h.style.opacity = Math.max(0, 1 - y / 220);
  $("topbar").classList.toggle("on", y > 150);
}, { passive: true });

// раз в минуту: часы, небо, «идёт сейчас»
function tick() {
  applySky();
  if (!D) renderHud(false); else quietRender(() => !G && !$("sheet").classList.contains("on"));
}
setTimeout(() => { tick(); setInterval(tick, 60000); }, (60 - new Date().getSeconds()) * 1000 + 50);

$("vbar").innerHTML = `<button class="btn" data-vclose aria-label="Закрыть">${IC.close}</button><button class="btn pri" data-vdl>${IC.down}Сохранить</button><button class="btn" data-vsend>${IC.send}В чат</button>`;
applySky(); renderNav(); renderHud(true);
requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove("noanim")));
refreshWeather(); setInterval(refreshWeather, 15 * 60000);
(async () => {
  let cached = null;
  try { cached = localStorage.getItem("dataEnc"); } catch (e) {}
  if (cached) { try { showData(await decryptData(cached), cached); } catch (e) { D = null; } }   // копия от другого ключа или старого формата — просто ждём свежую
  try {
    const txt = await fetchData();
    if (txt !== dataTxt) showData(await decryptData(txt), txt);
  } catch (err) {
    if (D) { offline = true; render(false); toast(`Нет сети — данные от ${D.generated.slice(8, 10)}.${D.generated.slice(5, 7)} ${D.generated.slice(11, 16)}`); return; }
    // экран ошибки: что случилось и что сделать; вкладки и «+» без данных не нужны — прячем
    const net = err instanceof TypeError || /fetch|network|load failed/i.test(err.message || "");
    const nokey = !QS.get("k"), nodata = /не опубликовал/.test(err.message || "");
    const bot = `<a class="btn" href="https://t.me/MamBa135bot">${IC.chat}Открыть чат с ботом</a>`;
    const [ic, h, txt, act] = nokey ? ["🔑", "Нужна ссылка из чата", "Планер открывается только кнопкой <span class=nw>«📅 Планер»</span> в чате с ботом: в ней ключ к твоим данным.", bot]
      : net ? ["📡", "Нет связи", "Не получилось загрузить данные. Проверь интернет и попробуй ещё раз.", `<button class="btn pri" data-retry>${IC.retry}Повторить</button>`]
      : nodata ? ["⏳", "Данных пока нет", "Бот ещё не опубликовал планер. Загляни после его ближайшего запуска — он работает раз в час.", `<button class="btn pri" data-retry>${IC.retry}Обновить</button>`]
      : ["🔒", "Ключ не подходит", "Ссылка устарела или открыта не из чата. Открой планер заново кнопкой <span class=nw>«📅 Планер»</span> в чате с ботом.", bot];
    document.documentElement.classList.add("nodata");
    $("main").innerHTML = `<section class="glass card msg"><b>${ic}</b><h2>${h}</h2><p>${txt}</p>${act}</section>`;
  }
})();
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { skyCalm(); refreshData(); }
  else if (viewerOn() && store.get("lastView", null)) store.set("lastView", { ...store.get("lastView", {}), at: Date.now() });
});
try { tg?.onEvent?.("activated", () => refreshData()); } catch (e) {}
window.miniResume = () => refreshData();   // приложение вернулось на экран
setInterval(() => { if (!document.hidden) refreshData(); }, 10 * 60000);
</script>
