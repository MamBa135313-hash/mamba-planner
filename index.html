<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Планер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --link: var(--tg-theme-link-color, #2a7de1);
    --btn: var(--tg-theme-button-color, #2a7de1);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --danger: var(--tg-theme-destructive-text-color, #e5484d);
    --sep: color-mix(in srgb, var(--hint) 25%, transparent);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: calc(150px + env(safe-area-inset-bottom)); overflow-x: hidden; }
  header, main { width: 100%; }
  .text, .row { overflow-wrap: anywhere; }
  header { position: sticky; top: 0; z-index: 5; padding: 14px 20px 10px; background: color-mix(in srgb, var(--bg2) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  header h1 { margin: 0; font-size: 24px; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; }
  header .sub { color: var(--hint); font-size: 13px; margin-top: 2px; }
  nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; display: grid; grid-template-columns: repeat(6, 1fr);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--sep); }
  .nb { border: 0; background: none; color: var(--hint); font: inherit; font-size: 10.5px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; position: relative; }
  .nb .ic { font-size: 21px; line-height: 28px; width: 46px; border-radius: 14px; filter: grayscale(1); opacity: .55; transition: all .15s; }
  .nb.on { color: var(--link); }
  .nb.on .ic { filter: none; opacity: 1; background: color-mix(in srgb, var(--link) 14%, transparent); }
  .nb .dot { position: absolute; top: 2px; right: calc(50% - 22px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--danger); color: #fff; font-size: 10px; line-height: 16px; }
  .hero { background: linear-gradient(135deg, var(--btn), color-mix(in srgb, var(--btn) 55%, #8b5cf6)); color: var(--btn-text); border-radius: 16px; padding: 16px; margin-bottom: 4px; }
  .hero .hi { font-size: 18px; font-weight: 700; }
  .hero .stats { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .hero .st { background: rgba(255,255,255,.18); border-radius: 12px; padding: 8px 10px; flex: 1; min-width: 88px; }
  .hero .st b { display: block; font-size: 20px; line-height: 1.1; }
  .hero .st span { font-size: 12px; opacity: .9; }
  .undo-chip { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(72px + env(safe-area-inset-bottom)); z-index: 8; display: none; border: 0; border-radius: 18px; padding: 8px 14px; font: inherit; font-size: 13px; background: var(--text); color: var(--bg); box-shadow: 0 4px 16px rgba(0,0,0,.2); }
  .undo-chip.on { display: block; }
  main { padding: 12px 16px; max-width: 640px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 18px 4px 6px; font-weight: 600; }
  h2:first-child { margin-top: 4px; }
  .card { background: var(--bg); border-radius: 12px; overflow: hidden; }
  .row { padding: 10px 14px; border-top: 1px solid var(--sep); }
  .row:first-child { border-top: 0; }
  .muted { color: var(--hint); font-size: 13px; }
  .time { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 46px; display: inline-block; }
  .hw { margin: 6px 0 0 46px; padding: 6px 10px; border-radius: 8px; background: color-mix(in srgb, var(--link) 10%, transparent); font-size: 14px; }
  .task { display: flex; gap: 10px; align-items: flex-start; }
  .task .body { flex: 1; min-width: 0; }
  .task .text { word-wrap: break-word; }
  .badge { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 10px; background: var(--bg2); color: var(--hint); margin-right: 4px; }
  .badge.imp { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
  .badge.pend { background: color-mix(in srgb, var(--link) 15%, transparent); color: var(--link); }
  .acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  button.s { border: 0; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; background: var(--bg2); color: var(--text); }
  button.s.p { background: var(--btn); color: var(--btn-text); }
  .done .text { text-decoration: line-through; color: var(--hint); }
  .empty { padding: 14px; color: var(--hint); text-align: center; }
  .day { font-weight: 600; }
  .today-tag { color: var(--link); font-weight: 600; }
  .nav { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 10px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 10px; }
  .chip { border: 1px solid var(--sep); border-radius: 16px; padding: 4px 12px; background: var(--bg); color: var(--text); font: inherit; font-size: 13px; }
  .chip.on { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  form label { display: block; margin: 10px 0 4px; font-size: 13px; color: var(--hint); }
  input, textarea, select { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--sep); background: var(--bg); color: var(--text); }
  textarea { min-height: 70px; resize: vertical; }
  .flash { min-height: 190px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 20px; cursor: pointer; user-select: none; }
  .flash .back { color: var(--link); }
  .bar { position: fixed; left: 0; right: 0; bottom: calc(62px + env(safe-area-inset-bottom)); padding: 10px 16px; background: var(--bg); border-top: 1px solid var(--sep); display: none; gap: 8px; z-index: 6; }
  .bar.on { display: flex; }
  .bar button { flex: 1; border: 0; border-radius: 10px; padding: 12px; font: inherit; font-weight: 600; background: var(--btn); color: var(--btn-text); }
  .bar button.sec { flex: 0 0 auto; background: var(--bg2); color: var(--text); }
  .msg { padding: 40px 20px; text-align: center; color: var(--hint); }
</style>
</head>
<body>
<header><h1 id="title">Планер</h1><div class="sub" id="sub"></div></header>
<main id="main"><div class="msg">Загружаю…</div></main>
<div class="bar" id="bar"><button class="sec" id="undo">Отменить</button><button id="send">Отправить боту</button></div>
<button class="undo-chip" id="undo2">↩︎ Отменить последнее</button>
<nav class="bottom" id="nav"></nav>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const TABS = [["today", "Сегодня", "☀️"], ["week", "Неделя", "🗓"], ["tasks", "Задачи", "✅"], ["sched", "Пары", "📚"], ["cards", "Карточки", "🃏"], ["files", "Файлы", "📎"]];
const MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
const useMainButton = () => !!(tg && tg.initData && tg.MainButton);
const WD = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
const WDL = ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];
let D = null, tab = new URLSearchParams(location.search).get("tab") || "today", schedWeek = 0, taskFilter = "all", deck = null, cardIdx = 0, flipped = false;

// ---------- хранилище (localStorage может быть недоступен) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let ops = store.get("ops", []);
const saveOps = () => { store.set("ops", ops); renderBar(); };

// ---------- даты (Москва) ----------
const mskNow = () => new Date(Date.now() + (new Date().getTimezoneOffset() + 180) * 60000);
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const parseIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const ddmm = s => s.slice(8, 10) + "." + s.slice(5, 7);
const today = () => iso(mskNow());
function rel(dateStr) {
  const n = Math.round((parseIso(dateStr) - parseIso(today())) / 864e5);
  return n === 0 ? "сегодня" : n === 1 ? "завтра" : n === 2 ? "послезавтра" : n < 0 ? "просрочено" : "через " + n + " дн.";
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- расшифровка ----------
async function load() {
  const k = new URLSearchParams(location.search).get("k");
  if (!k) throw new Error("Откройте планер кнопкой «📅 Планер» в чате с ботом.");
  const raw = Uint8Array.from(atob(k.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((k.length + 3) % 4)), c => c.charCodeAt(0));
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const res = await fetch("data.enc?t=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error("Данные ещё не опубликованы ботом.");
  const enc = await res.json();
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(enc.iv) }, key, b(enc.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

// ---------- применение локальных изменений ----------
function tasksView() {
  const list = D.tasks.map(t => ({ ...t }));
  for (const o of ops) {
    const t = list.find(x => x.id === o.id);
    if (o.op === "add") list.push({ id: "new" + o.n, text: o.text, date: o.date || null, time: o.time || null, imp: !!o.imp, files: [], src: "из планера", pending: true });
    else if (!t) continue;
    else if (o.op === "done") t.done = true;
    else if (o.op === "tmr" && t.date) { t.date = iso(addDays(parseIso(t.date), 1)); t.pending = true; }
    else if (o.op === "move") { t.date = o.date; t.time = o.time || t.time; t.pending = true; }
    else if (o.op === "imp") { t.imp = o.value; t.pending = true; }
  }
  return list.sort((a, b) => (a.date || "9999") .localeCompare(b.date || "9999") || (a.time || "99").localeCompare(b.time || "99"));
}
function addOp(o) { ops.push(o); saveOps(); tg?.HapticFeedback?.impactOccurred("light"); render(); }

// ---------- расписание ----------
function lessonsFor(dateStr) {
  const S = D.schedule, out = [];
  if (S.valid_until && dateStr > S.valid_until) return null;
  for (const l of S.days[dateStr] || []) out.push({ time: l.time, title: l.subj, sub: l.type + ", " + l.room, teacher: l.teacher });
  const wd = (parseIso(dateStr).getDay() + 6) % 7;
  for (const v of S.vuc || []) if (v.wd === wd) {
    const range = (v.text.match(/^\d{2}:\d{2}[–-]\d{2}:\d{2}/) || [""])[0];
    out.push({ time: v.time, title: "🎖 " + v.text.slice(range.length).trim(), sub: range ? "до " + range.slice(-5) : "", vuc: true });
  }
  return out.sort((a, b) => a.time.localeCompare(b.time));
}

// ---------- отрисовка ----------
function taskRow(t, opts = {}) {
  const when = t.date ? (t.approx ? "~" : "") + ddmm(t.date) + (t.time ? " " + t.time : "") : "без срока";
  const b = [];
  if (t.imp) b.push('<span class="badge imp">❗️ важно</span>');
  if (t.pending) b.push('<span class="badge pend">ждёт бота</span>');
  if (t.files?.length) b.push('<span class="badge">📎 ' + t.files.length + "</span>");
  const id = typeof t.id === "number" ? t.id : null;
  const acts = t.done || id === null ? "" : `<div class="acts">
      <button class="s p" data-a="done" data-id="${id}">✅ Сделал</button>
      ${t.date ? `<button class="s" data-a="tmr" data-id="${id}">⏰ На завтра</button>` : ""}
      <button class="s" data-a="move" data-id="${id}">📅 Перенести</button>
      <button class="s" data-a="imp" data-id="${id}">${t.imp ? "Не важно" : "❗️ Важно"}</button></div>`;
  return `<div class="row task ${t.done ? "done" : ""}"><div class="body">
    <div class="muted">${id !== null ? "#" + id + " · " : ""}${when}${t.date && !opts.noRel ? " · " + rel(t.date) : ""}</div>
    <div class="text">${esc(t.text)}</div><div>${b.join("")}</div>${opts.noActs ? "" : acts}</div></div>`;
}
const section = (title, rows, empty) => `<h2>${title}</h2><div class="card">${rows.length ? rows.join("") : `<div class="empty">${empty}</div>`}</div>`;

function vToday() {
  const t0 = today(), T = tasksView().filter(t => !t.done);
  const d = parseIso(t0), les = lessonsFor(t0), due = T.filter(t => t.date === t0), used = new Set();
  const hr = mskNow().getHours(), hi = hr < 5 ? "Доброй ночи" : hr < 12 ? "Доброе утро" : hr < 18 ? "Добрый день" : "Добрый вечер";
  const name = tg?.initDataUnsafe?.user?.first_name || "Саша";
  const in3 = T.filter(t => t.date && (parseIso(t.date) - d) / 864e5 <= 3).length, impN = T.filter(t => t.imp).length;
  const pairsN = (les || []).filter(l => !l.vuc).length;
  let h = `<div class="hero"><div class="hi">${hi}, ${esc(name)} 👋</div>
    <div class="stats"><div class="st"><b>${les === null ? "—" : pairsN}</b><span>пар сегодня</span></div>
    <div class="st"><b>${in3}</b><span>задач на 3 дня</span></div><div class="st"><b>${impN}</b><span>❗️ важных</span></div></div></div>`;
  h += `<h2>Пары</h2><div class="card">`;
  if (les === null) h += `<div class="empty">Расписание не загружено — пришли боту новое</div>`;
  else if (!les.length) h += `<div class="empty">Пар нет 🎉</div>`;
  else for (const l of les) {
    const hw = due.filter(t => t.time && t.time === l.time && !used.has(t.id));
    hw.forEach(t => used.add(t.id));
    h += `<div class="row"><span class="time">${l.time}</span> ${esc(l.title)}${l.sub ? ` <span class="muted">— ${esc(l.sub)}</span>` : ""}
      ${hw.map(t => `<div class="hw">📝 #${t.id} ${t.imp ? "❗️ " : ""}${esc(t.text)}</div>`).join("")}</div>`;
  }
  h += "</div>";
  h += section("Задачи на сегодня", due.filter(t => !used.has(t.id)).map(t => taskRow(t, { noRel: true })), "Нет 🎉");
  const soon = T.filter(t => t.date && t.date > t0 && (parseIso(t.date) - d) / 864e5 <= 3);
  h += section("Ближайшие 3 дня", soon.map(t => taskRow(t)), "Пусто");
  const imp = T.filter(t => t.imp && t.date && (parseIso(t.date) - d) / 864e5 > 3 && (parseIso(t.date) - d) / 864e5 <= 7);
  if (imp.length) h += section("❗️ Скоро важное", imp.map(t => taskRow(t)), "");
  return h;
}

function vWeek() {
  const T = tasksView().filter(t => !t.done), d0 = parseIso(today());
  let h = "";
  for (let i = 0; i < 7; i++) {
    const ds = iso(addDays(d0, i)), dd = parseIso(ds), les = lessonsFor(ds) || [];
    const due = T.filter(t => t.date === ds);
    const bd = D.birthdays.filter(b => b.d === dd.getDate() && b.m === dd.getMonth() + 1);
    const rows = [];
    const vuc = les.filter(l => l.vuc), pairs = les.filter(l => !l.vuc);
    rows.push(`<div class="row muted">${pairs.length ? "📚 " + pairs.length + " пар(ы): " + pairs.map(l => l.time).join(", ") : "Пар нет"}${vuc.length ? " · " + vuc.map(v => esc(v.title) + " " + esc(v.sub)).join("; ") : ""}</div>`);
    bd.forEach(b => rows.push(`<div class="row">🎂 ${esc(b.name)}</div>`));
    due.forEach(t => rows.push(taskRow(t, { noRel: true })));
    h += `<h2>${WD[dd.getDay()]} ${ddmm(ds)}${i === 0 ? ' · <span class="today-tag">сегодня</span>' : ""}</h2><div class="card">${rows.join("")}</div>`;
  }
  return h;
}

function vTasks() {
  const all = tasksView();
  const F = { all: ["Все", t => !t.done], imp: ["❗️ Важные", t => !t.done && t.imp], nodate: ["Без срока", t => !t.done && !t.date], files: ["С файлами", t => !t.done && t.files?.length] };
  let h = `<div class="chips">${Object.entries(F).map(([k, [n]]) => `<button class="chip ${taskFilter === k ? "on" : ""}" data-f="${k}">${n}</button>`).join("")}</div>`;
  h += section("Задачи", all.filter(F[taskFilter][1]).map(t => taskRow(t)), "Задач нет 🎉");
  const done = all.filter(t => t.done);
  if (done.length) h += section("Отмечены (ждут отправки)", done.map(t => taskRow(t, { noActs: true })), "");
  h += `<h2>Новая задача</h2><form class="card" id="addf" style="padding:4px 14px 14px">
    <label>Что сделать</label><textarea name="text" required placeholder="Например: эссе по социологии"></textarea>
    <label>Срок</label><input type="date" name="date">
    <label>Время</label><input type="time" name="time">
    <label><input type="checkbox" name="imp" style="width:auto"> ❗️ Важная (контрольная, сдача)</label>
    <div class="acts"><button class="s p" type="submit">Добавить</button></div></form>`;
  if (D.regular.length) h += section("🔁 Регулярно", D.regular.map(r => `<div class="row">${esc(r)}</div>`), "");
  return h;
}

function vSched() {
  const d0 = addDays(parseIso(today()), schedWeek * 7), mon = addDays(d0, -((d0.getDay() + 6) % 7));
  let h = `<div class="nav"><button class="s" data-w="-1">← Неделя</button><span class="muted">${ddmm(iso(mon))} – ${ddmm(iso(addDays(mon, 6)))}</span><button class="s" data-w="1">Неделя →</button></div>`;
  for (let i = 0; i < 6; i++) {
    const ds = iso(addDays(mon, i)), les = lessonsFor(ds);
    const rows = les === null ? [`<div class="empty">Не загружено</div>`] : les.length ? les.map(l => `<div class="row"><span class="time">${l.time}</span> ${esc(l.title)}${l.sub || l.teacher ? `<div class="muted" style="margin-left:46px">${esc(l.sub)}${l.teacher ? " · " + esc(l.teacher) : ""}</div>` : ""}</div>`) : [`<div class="empty">Пар нет</div>`];
    h += `<h2>${WD[parseIso(ds).getDay()]} ${ddmm(ds)}${ds === today() ? ' · <span class="today-tag">сегодня</span>' : ""}</h2><div class="card">${rows.join("")}</div>`;
  }
  if (D.schedule.changes?.length) h += section("Изменения", D.schedule.changes.map(c => `<div class="row">${esc(c)}</div>`), "");
  return h;
}

function vCards() {
  const decks = D.cards || [];
  if (!decks.length) return `<div class="msg">Колод пока нет.<br><br>Напиши боту: «сделай карточки по #1» или «карточки по лексике к срезу», и он соберёт колоду из материалов задачи.</div>`;
  if (deck === null) return section("Колоды", decks.map((d, i) => `<div class="row" data-deck="${i}" style="cursor:pointer"><b>${esc(d.name)}</b><div class="muted">${d.cards.length} карточек${d.task ? " · к задаче #" + d.task : ""}</div></div>`), "");
  const d = decks[deck], c = d.cards[cardIdx];
  const known = store.get("known:" + d.name, []);
  return `<div class="nav"><button class="s" data-deck="-1">← Колоды</button><span class="muted">${cardIdx + 1} / ${d.cards.length} · знаю ${known.length}</span><button class="s" data-shuffle>🔀</button></div>
    <div class="card flash" id="flash">${flipped ? `<div><div class="muted">${esc(c[0])}</div><div class="back">${esc(c[1])}</div></div>` : esc(c[0])}</div>
    <div class="acts" style="justify-content:center;margin-top:12px">
      <button class="s" data-c="prev">←</button><button class="s" data-c="again">Ещё раз</button>
      <button class="s p" data-c="know">Знаю</button><button class="s" data-c="next">→</button></div>
    <p class="muted" style="text-align:center">Нажми на карточку, чтобы перевернуть</p>`;
}

function vFiles() {
  const f = D.files || [];
  return section("Материалы к задачам", f.map(x => `<div class="row"><div>${x.kind === "photo" ? "🖼" : "📄"} ${esc(x.name)}</div>
    <div class="muted">#${x.task} ${esc(x.task_text).slice(0, 80)}</div>
    <div class="acts"><button class="s" data-file="${esc(x.path)}" data-task="${x.task}" ${x.path ? "" : "disabled"}>📩 Прислать в чат</button></div></div>`), "Файлов пока нет — они появятся, когда к задачам прикрепят материалы");
}

function render() {
  const active = tasksView().filter(t => !t.done), td = today(), dd = parseIso(td);
  const badge = { today: active.filter(t => t.date === td).length, tasks: active.filter(t => t.imp).length };
  document.getElementById("nav").innerHTML = TABS.map(([k, n, ic]) => `<button class="nb ${tab === k ? "on" : ""}" data-t="${k}"><span class="ic">${ic}</span>${n}${badge[k] ? `<span class="dot">${badge[k]}</span>` : ""}</button>`).join("");
  const TITLES = { today: ["Сегодня", WDL[dd.getDay()] + ", " + dd.getDate() + " " + MONTHS[dd.getMonth()]], week: ["Неделя", "7 дней вперёд"],
    tasks: ["Задачи", active.length + " активных"], sched: ["Расписание", "пары и ВУЦ по неделям"],
    cards: [deck === null ? "Карточки" : D.cards[deck].name, deck === null ? "колоды для зубрёжки" : "карточка " + (cardIdx + 1) + " из " + D.cards[deck].cards.length],
    files: ["Файлы", "материалы к задачам"] };
  document.getElementById("title").textContent = TITLES[tab][0];
  document.getElementById("sub").textContent = TITLES[tab][1];
  if (tg?.BackButton) { tab === "cards" && deck !== null ? tg.BackButton.show() : tg.BackButton.hide(); }
  const V = { today: vToday, week: vWeek, tasks: vTasks, sched: vSched, cards: vCards, files: vFiles };
  document.getElementById("main").innerHTML = V[tab]() + `<p class="muted" style="text-align:center;margin-top:20px">Данные бота от ${D.generated.slice(8, 10)}.${D.generated.slice(5, 7)} ${D.generated.slice(11, 16)}</p>`;
  renderBar();
}
function renderBar() {
  const n = ops.length, mb = useMainButton();
  document.getElementById("bar").classList.toggle("on", n > 0 && !mb);
  document.getElementById("undo2").classList.toggle("on", n > 0 && mb);
  document.getElementById("send").textContent = "Отправить боту (" + n + ")";
  if (mb) {
    if (n) { tg.MainButton.setText("Отправить боту (" + n + ")"); tg.MainButton.show(); } else tg.MainButton.hide();
  }
}

// ---------- события ----------
document.addEventListener("click", e => {
  const el = e.target.closest("button, [data-deck], #flash");
  if (!el) return;
  const ds = el.dataset;
  if (ds.t) { tab = ds.t; deck = null; tg?.HapticFeedback?.selectionChanged(); render(); window.scrollTo(0, 0); return; }
  if (ds.f) { taskFilter = ds.f; render(); return; }
  if (ds.w) { schedWeek += +ds.w; render(); return; }
  if (ds.a) {
    const id = +ds.id;
    if (ds.a === "move") {
      const t = tasksView().find(x => x.id === id);
      const v = prompt("Новая дата (ДД.ММ) и время через пробел, например: 20.10 10:35", t?.date ? ddmm(t.date) + (t.time ? " " + t.time : "") : "");
      const m = v && v.match(/(\d{1,2})\.(\d{1,2})(?:\s+(\d{1,2}:\d{2}))?/);
      if (m) addOp({ op: "move", id, date: mskNow().getFullYear() + "-" + m[2].padStart(2, "0") + "-" + m[1].padStart(2, "0"), time: m[3] || null });
      return;
    }
    if (ds.a === "imp") { const t = tasksView().find(x => x.id === id); addOp({ op: "imp", id, value: !t.imp }); return; }
    addOp({ op: ds.a, id }); return;
  }
  if (ds.file !== undefined) { addOp({ op: "send_file", path: ds.file, task: +ds.task }); tg?.showAlert?.("Файл придёт в чат после отправки боту"); return; }
  if (ds.deck !== undefined) { deck = +ds.deck < 0 ? null : +ds.deck; cardIdx = 0; flipped = false; render(); return; }
  if (el.id === "flash") { flipped = !flipped; render(); return; }
  if (ds.shuffle !== undefined) { D.cards[deck].cards.sort(() => Math.random() - .5); cardIdx = 0; flipped = false; render(); return; }
  if (ds.c) {
    const d = D.cards[deck], n = d.cards.length;
    if (ds.c === "know") { const k = new Set(store.get("known:" + d.name, [])); k.add(d.cards[cardIdx][0]); store.set("known:" + d.name, [...k]); }
    if (ds.c === "again") { d.cards.push(d.cards.splice(cardIdx, 1)[0]); }
    else cardIdx = (cardIdx + (ds.c === "prev" ? n - 1 : 1)) % n;
    flipped = false; render(); return;
  }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "addf") return;
  e.preventDefault();
  const f = new FormData(e.target);
  addOp({ op: "add", n: Date.now() % 1e6, text: f.get("text").trim(), date: f.get("date") || null, time: f.get("time") || null, imp: !!f.get("imp") });
});
document.getElementById("undo").onclick = document.getElementById("undo2").onclick = () => { ops.pop(); saveOps(); render(); };
function sendOps() {
  const payload = JSON.stringify({ v: 1, ops });
  if (!tg || !tg.sendData || !tg.initData && tg.platform === "unknown") { alert("Открой планер кнопкой «📅 Планер» внизу чата с ботом — отправка работает только оттуда."); return; }
  if (payload.length > 4000) { tg.showAlert("Слишком много изменений сразу — отправь часть, потом остальное."); return; }
  const sent = ops; ops = []; store.set("ops", []); store.set("sent", sent);
  tg.sendData(payload); // планер закроется, бот применит изменения в ближайший запуск
}
document.getElementById("send").onclick = sendOps;
if (tg?.MainButton) tg.MainButton.onClick(sendOps);
if (tg?.BackButton) tg.BackButton.onClick(() => { deck = null; render(); });

load().then(d => { D = d; if (mskNow().getDay() === 0) schedWeek = 1; render(); }).catch(err => {
  document.getElementById("main").innerHTML = `<div class="msg">${esc(err.message || "Не удалось расшифровать данные")}</div>`;
});
</script>
</body>
</html>
